name: Revisión de entrega

# Revisa los pull requests de estudiantes: que toquen sólo su propia carpeta,
# que esa carpeta se llame exactamente como su login, que no traigan basura y
# que no vengan de la rama default de su fork.
#
# `pull_request_target` y NO `pull_request`. Con `pull_request`, GitHub corre el
# workflow y los archivos del merge ref: el propio pull request puede reescribir
# este archivo y el script que lo juzga, y aprobarse solo. `pull_request_target`
# los toma de la rama base.
#
# El precio de ese disparador es que NUNCA se debe ejecutar código del pull
# request. Por eso el checkout va fijado a `base.sha`, sin credenciales, y el
# script sólo consulta la API: no lee ni corre nada del árbol de trabajo.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision:
    # Los bots no tienen carpeta de estudiante: rechazarlos sería un falso
    # positivo permanente en cada actualización de dependencias.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Revisar la entrega
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          RAMA: ${{ github.event.pull_request.head.ref }}
          RAMA_DEFAULT: ${{ github.event.pull_request.head.repo.default_branch }}
          MANTENEDORES: uumami
          # Mapa branch -> carpeta de cada entrega. El script lo lee de aqui y
          # nunca del arbol de trabajo: con pull_request_target, leer el repo
          # seria darle al pull request una via para reescribir sus propias
          # reglas. Cada unidad agrega sus lineas.
          TAREAS: >-
            tarea-08-datacamp-intro=docker,
            tarea-08-imagen=08_contenedores,
            tarea-08-datacamp-inter-1=docker,
            tarea-08-datacamp-inter-2=docker,
            tarea-09-datacamp-python=python,
            tarea-09-uv-docker=09_python,
            tarea-09-por-dentro=09_python,
            tarea-09-stack=09_python,
            tarea-11-datacamp-fastapi=fastapi
          # La regla de la branch (no entregar desde main) solo AVISA hasta
          # esta fecha, y a partir de ella rechaza. Existe porque el grupo ya
          # tenia pull requests abiertos desde main cuando la regla entro.
          # Cubre la entrega del 10 de septiembre y la de DataCamp del 17.
          # Para endurecerla ya, borra esta linea. NO es la misma fecha que
          # BRANCH_NOMBRE_ESTRICTO_DESDE: esta politica ya estaba vigente y
          # nadie pidio relajarla, asi que su fecha no se mueve.
          BRANCH_ESTRICTA_DESDE: "2026-09-18"
          # La regla del nombre de la branch (tarea-NN-nombre) solo AVISA
          # hasta esta fecha, y a partir de ella rechaza. Es una variable
          # propia, distinta de BRANCH_ESTRICTA_DESDE de arriba: a las tareas
          # de la unidad 7 nunca se les pidio un nombre de branch, asi que
          # nadie hizo nada mal al inventarse uno. El 22 de septiembre es la
          # primera entrega de la unidad 8, cuando ya existiran tareas que si
          # nombran su branch. Para endurecerla ya, borra esta linea.
          BRANCH_NOMBRE_ESTRICTO_DESDE: "2026-09-22"
        run: python3 .github/scripts/revisa_entrega.py

      # Segundo paso, separado a proposito: el de arriba juzga la FORMA (donde
      # viven los archivos, como se llama la branch, que no haya basura) y este
      # el CONTENIDO MINIMO (que esten los archivos que la tarea pidio y que no
      # sean la plantilla sin tocar). Separarlos hace que el mensaje de error
      # diga de una cual de las dos cosas fallo.
      #
      # Una branch que no este en el catalogo del script sale en verde sin
      # decir nada: las tareas de la unidad 7 nunca declararon nombre de
      # branch, asi que no hay forma de saber que tarea es.
      - name: Revisar el contenido minimo
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          RAMA: ${{ github.event.pull_request.head.ref }}
          MANTENEDORES: uumami
        run: python3 .github/scripts/revisa_contenido.py

      # Tercer paso: la ficha de la tarea. Cada tarea nueva trae su ficha en
      # .github/tareas/<branch>.toml con lo que se revisa solo (archivos,
      # capturas, secciones, reglas propias) y lo que revisa una persona. El
      # paso de arriba se queda con las tareas que ya estaban en curso cuando
      # entraron las fichas, para no cambiarles las reglas a media entrega;
      # una branch vive en uno de los dos, nunca en ambos.
      #
      # Leer la ficha del disco es seguro SOLO porque el checkout de arriba
      # esta fijado a base.sha: la ficha sale de la rama base, no del pull
      # request. Por eso el script lee del disco unicamente .github/tareas/ y
      # codigo/, y el trabajo del alumno solo por la API. Una branch sin
      # ficha sale en verde sin decir nada mas.
      - name: Revisar la ficha de la tarea
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          RAMA: ${{ github.event.pull_request.head.ref }}
          MANTENEDORES: uumami
        run: python3 .github/scripts/revisa_ficha.py
