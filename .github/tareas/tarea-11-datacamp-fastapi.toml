# Ficha de la entrega de la unidad 11 (cómputo y concurrencia): DataCamp,
# Introduction to FastAPI. El esquema está en .github/tareas/README.md.

[tarea]
branch = "tarea-11-datacamp-fastapi"
asignacion = "datacamp-fastapi"
carpeta = "fastapi"
available = "2026-10-30"
due = "2026-11-03"
penalizacion_tarde = "1/dia"
ia = "permitida-revisada"
debe_explicar = [
  "qué es una ruta en FastAPI y qué hace el decorador que la declara",
  "qué diferencia hay entre un parámetro de ruta y uno de consulta",
  "qué hace FastAPI cuando el cuerpo de una petición no cumple el modelo",
  "qué cambia entre un endpoint declarado con def y uno con async def",
  "la cosa que escribió en «Una cosa que aprendiste»: debe poder contarla sin leerla",
]
pagina = "Página «Las entregas de cómputo y concurrencia» (https://rayalucaria.org/fdd_o26/computo-y-concurrencia/b-entregas/)"

[entregables]
requeridos = ["certificaciones.md"]
prohibidos = []

[[capturas]]
nombre = "introduccion-fastapi"
