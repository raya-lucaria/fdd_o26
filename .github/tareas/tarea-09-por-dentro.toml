# prompt-especificación. El esquema está en .github/tareas/README.md.
#
# Los tres .md siempre vienen en el pull request (el ritual de la página 0
# hace commit de la plantilla), así que «falta X» nunca se dispara: lo que
# atrapa la plantilla sin llenar son las [[secciones]], todas con sin_tocar
# en "falla" (el valor por omisión).

