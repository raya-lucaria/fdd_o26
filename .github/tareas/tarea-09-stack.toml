# Tres filas con contenido en la tabla: cuenta las líneas con una barra y
# algo que no sea barra, dos puntos, guion o espacio (descarta el separador
# y las filas vacías de la plantilla), salvo el encabezado.
[[patrones]]
archivo = "decisiones.md"
seccion = "Qué cambié"
debe = '(?:^(?![^\n]*Qué cambié)(?=[^\n]*\|)(?=[^\n]*[^\s|:-])[^\n]*$[\s\S]*?){3}'
que = "la tabla de decisiones.md tiene menos de tres filas llenas"
porque = "la práctica pide al menos tres cambios explicados; con menos, una parte de lo que cambiaste queda sin su por qué ni su patrón"
investiga = "Página «Patrones y el stack escrito» (https://rayalucaria.org/fdd_o26/python/stack/patrones/): ¿qué patrón aplicaste en cada cambio entre ventas_ia.py y tu práctica?"
nivel = "falla"

# Tres o más pruebas pasadas y ninguna fallida, con error o saltada. Cuenta
# casos, no funciones: una función parametrizada con tres casos vale.
[[patrones]]
archivo = "decisiones.md"
