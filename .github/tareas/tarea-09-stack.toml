  "qué hace self en un método, y de dónde sale cuando llamas venta.total()",
  "por qué un TypedDict no detecta el precio \"abc\" al correr, y quién sí lo detecta",
  "qué baja hasta la lectura del archivo en un plan lazy de Polars, y qué gana con eso",
