# Ficha de la entrega de la sección 9.3 (Elegir el stack): DataCamp,
# Software Engineering Principles in Python (capítulos 3 y 4), la práctica
# que reescribe ventas_ia.py con el stack de la clase y el AGENTS.md lleno.
# El esquema está en .github/tareas/README.md.
#
# Los cinco requeridos siempre vienen en el pull request (el ritual de la
# página 0 hace commit de la plantilla), así que «falta X» nunca se dispara:
# lo que atrapa la plantilla sin tocar es `identica` (por omisión, "falla")
# y las [[secciones]], todas con sin_tocar en "falla".

