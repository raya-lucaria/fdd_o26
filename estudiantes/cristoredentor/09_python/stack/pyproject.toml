[project]
name = "stack"
version = "0.1.0"
description = "Labs de la sección 9.3 Elegir el stack"
requires-python = ">=3.14"
dependencies = [
    "polars>=2.0,<3",
    "duckdb",
    "pyarrow",
    "pydantic>=2.14,<3",
    "pandas>=3",
    "numpy",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "ipykernel>=6"]

[tool.ruff.lint]
# Explícito: ruff 0.16 cambió las reglas que vienen por defecto.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pandas no trae sus tipos (vienen aparte, en pandas-stubs): no los exijas.
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
# La sintaxis de Pydantic v1 es un error en las pruebas, no un aviso que se pierde.
filterwarnings = ["error::pydantic.PydanticDeprecatedSince20"]
