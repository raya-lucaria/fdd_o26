<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="lab-tree-title lab-tree-desc" preserveAspectRatio="xMidYMid meet">
  <title id="lab-tree-title">Árbol del laboratorio local de terminal</title>
  <desc id="lab-tree-desc">La carpeta personal contiene fdd y, dentro, terminal-lab. El laboratorio contiene los archivos nombres.txt y dos palabras.txt, más la carpeta reportes.</desc>
  <defs>
    <linearGradient id="lab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0f12"/>
      <stop offset="1" stop-color="#14242b"/>
    </linearGradient>
  </defs>
  <style>
    .heading { font-family: system-ui, sans-serif; font-size: 38px; font-weight: 700; fill: #e8f0e8; text-anchor: middle; }
    .note { font-family: system-ui, sans-serif; font-size: 25px; font-weight: 500; fill: #a7b8ad; text-anchor: middle; }
    .path { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 28px; font-weight: 700; fill: #e8f0e8; text-anchor: middle; }
    .name { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 22px; font-weight: 700; fill: #e8f0e8; text-anchor: middle; }
    .kind { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 500; fill: #a7b8ad; text-anchor: middle; }
    .line { fill: none; stroke: #4a7a63; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .box { stroke-width: 4; }
  </style>
  <rect width="720" height="850" rx="32" fill="url(#lab-bg)"/>
  <text x="360" y="58" class="heading">Un laboratorio, una ruta segura</text>
  <text x="360" y="96" class="note">Puedes practicar aquí sin afectar otra carpeta.</text>

  <rect x="92" y="142" width="536" height="98" rx="22" fill="#173b2a" stroke="#7ef29d" class="box"/>
  <text x="360" y="201" class="path">~/fdd/terminal-lab</text>

  <!-- El bus y sus tres ramales terminan antes de cada caja: son tres hijos hermanos. -->
  <path d="M360 240V286M132 286H588M132 286V326M360 286V326M588 286V326" class="line"/>

  <rect x="30" y="326" width="204" height="118" rx="20" fill="#164e63" stroke="#6fd8e8" class="box"/>
  <text x="132" y="372" class="name">nombres.txt</text>
  <text x="132" y="406" class="kind">archivo de texto</text>

  <rect x="258" y="326" width="204" height="118" rx="20" fill="#4c3814" stroke="#ffc857" class="box"/>
  <text x="360" y="372" class="name">dos palabras.txt</text>
  <text x="360" y="406" class="kind">archivo de texto</text>

  <rect x="486" y="326" width="204" height="118" rx="20" fill="#382057" stroke="#c9a7ff" class="box"/>
  <text x="588" y="372" class="name">reportes/</text>
  <text x="588" y="406" class="kind">carpeta</text>

  <rect x="56" y="552" width="608" height="86" rx="18" fill="#141b20" stroke="#4a7a63" class="box"/>
  <text x="360" y="590" class="note">Antes de mover o borrar, confirma</text>
  <text x="360" y="622" class="note">que sigues dentro de esta ruta.</text>
</svg>
