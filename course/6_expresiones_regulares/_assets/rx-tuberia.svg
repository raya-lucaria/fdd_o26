<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="352" viewBox="0 0 1060 352" role="img" aria-label="Cinco cajas encadenadas de izquierda a derecha: el archivo de contactos con diez lineas, grep que extrae ocho coincidencias, tr que las pasa a minusculas, sort menos u que deja cinco unicas y el archivo de salida; solo la primera caja usa una expresion regular"><rect x="0" y="0" width="1060" height="352" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="530.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Una limpieza es una cadena de pasos pequeños</text><rect x="25.0" y="96" width="178" height="108" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="114.0" y="132" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">contactos.txt</text><text x="114.0" y="160" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">10 líneas</text><text x="114.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el archivo sucio</text><rect x="233.0" y="96" width="178" height="108" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="322.0" y="132" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">grep -Eoih</text><text x="322.0" y="160" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">8 coincidencias</text><text x="322.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">encuentra</text><line x1="206.0" y1="150" x2="228.0" y2="150" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="441.0" y="96" width="178" height="108" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="530.0" y="132" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">tr A-Z a-z</text><text x="530.0" y="160" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">8, normalizadas</text><text x="530.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">unifica</text><line x1="414.0" y1="150" x2="436.0" y2="150" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="649.0" y="96" width="178" height="108" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="738.0" y="132" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">sort -u</text><text x="738.0" y="160" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">5 únicas</text><text x="738.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ordena y depura</text><line x1="622.0" y1="150" x2="644.0" y2="150" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="857.0" y="96" width="178" height="108" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="946.0" y="132" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">correos.txt</text><text x="946.0" y="160" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">5 líneas</text><text x="946.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el resultado</text><line x1="830.0" y1="150" x2="852.0" y2="150" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><line x1="322.0" y1="234" x2="322.0" y2="210" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="182.0" y="238" width="280" height="40" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="322.0" y="263" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">aquí, y sólo aquí, hay una regex</text><text x="530.0" y="306" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Los otros tres pasos son herramientas de texto corrientes: la regex encuentra, la tubería limpia.</text><text x="530.0" y="330" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cada eslabón hace una cosa y se puede probar solo: corre la tubería recortada hasta el paso que dudes.</text></svg>