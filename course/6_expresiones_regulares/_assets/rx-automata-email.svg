 estado</text><text x="530.0" y="76" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$</text><line x1="40" y1="214" x2="84" y2="214" stroke="#e8f0e8" stroke-width="2" marker-end="url(#fe8f0e8)"/><text x="36" y="182" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">empieza aquí</text><line x1="154" y1="214" x2="304" y2="214" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="150.5" y="166" width="159" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="230.0" y="185" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">[a-z0-9._%+-]</text><path d="M 326 186 C 298 134, 382 134, 354 186" fill="none" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="293.5" y="104" width="93" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="340" y="123" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">una más</text><line x1="374" y1="214" x2="484" y2="214" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="415.0" y="166" width="30" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="430.0" y="185" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">@</text><line x1="554" y1="214" x2="684" y2="214" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="557.0" y="166" width="126" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="620.0" y="185" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">[a-z0-9.-]</text><path d="M 706 186 C 678 134, 762 134, 734 186" fill="none" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="673.5" y="104" width="93" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="720" y="123" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">una más</text><line x1="754" y1="214" x2="904" y2="214" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="811.0" y="166" width="38" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="830.0" y="185" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">\.</text><circle cx="120" cy="214" r="32" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="120" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">ini</text><circle cx="340" cy="214" r="32" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="340" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">local</text><circle cx="520" cy="214" r="32" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="520" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">@</text><circle cx="720" cy="214" r="32" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="720" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">dom</text><circle cx="940" cy="214" r="32" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><circle cx="940" cy="214" r="26" fill="none" stroke="#7ef29d" stroke-width="2"/><text x="940" y="220" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">acc</text><text x="340" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">parte local</text><text x="520" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">la arroba</text><text x="720" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">dominio</text><text x="940" y="276" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">[a-z]{2,}</text><rect x="120" y="316" width="820" height="168" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="530" y="344" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">contra los datos sucios del laboratorio</text><text x="160" y="376" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">✓</text><text x="190" y="376" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">ana@itam.mx</text><text x="520" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">el caso normal</text><text x="160" y="404" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">✓</text><text x="190" y="404" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">ana+tareas@itam.mx</text><text x="520" y="404" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">el + está dentro de la clase local</text><text x="160" y="432" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">✗</text><text x="190" y="432" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">ana@itam.mx.</text><text x="520" y="432" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">el punto final no puede seguir a [a-z]{2,}</text><text x="160" y="460" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">✗</text><text x="190" y="460" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">@itam.mx</text><text x="520" y="460" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">la parte local exige al menos un carácter</text><text x="530.0" y="522" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Ninguna regex valida un correo de verdad: esto filtra bien, no demuestra nada.</text></svg>