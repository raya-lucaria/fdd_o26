<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="Dos patrones comparados: sin parentesis los anclajes se reparten uno a cada rama, con parentesis los anclajes encierran ambas ramas"><rect x="0" y="0" width="980" height="420" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="490.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Dónde cae el anclaje</text><text x="490.0" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">«|» parte la expresión completa, no sólo lo que tiene al lado</text><rect x="30" y="92" width="440" height="266" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="250" y="128" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" text-anchor="middle">^ana|beto$</text><text x="250" y="152" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">«empieza con ana» O «termina con beto»</text><path d="M 132 244 C 197.52 186, 300.48 186, 366 244" fill="none" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><path d="M 132 244 C 197.52 302, 300.48 302, 366 244" fill="none" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="220.0" y="186.5" width="60" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="250.0" y="205.5" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">^ana</text><rect x="214.5" y="273.5" width="71" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="250.0" y="292.5" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">beto$</text><circle cx="104" cy="244" r="28" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="104" y="250" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">ini</text><circle cx="396" cy="244" r="28" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><circle cx="396" cy="244" r="22" fill="none" stroke="#ff8a7a" stroke-width="2"/><text x="396" y="250" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">acc</text><text x="250" y="336" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">anaconda ✓   ·   yo soy beto ✓   ·   ana ✓</text><rect x="510" y="92" width="440" height="266" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="730" y="128" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" text-anchor="middle">^(ana|beto)$</text><text x="730" y="152" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">la línea entera es ana, o es beto</text><path d="M 612 244 C 677.52 186, 780.48 186, 846 244" fill="none" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><path d="M 612 244 C 677.52 302, 780.48 302, 846 244" fill="none" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="694.5" y="186.5" width="71" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="730.0" y="205.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">^ana$</text><rect x="689.0" y="273.5" width="82" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="730.0" y="292.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">^beto$</text><circle cx="584" cy="244" r="28" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="584" y="250" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">ini</text><circle cx="876" cy="244" r="28" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><circle cx="876" cy="244" r="22" fill="none" stroke="#7ef29d" stroke-width="2"/><text x="876" y="250" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">acc</text><text x="730" y="336" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">anaconda ✗   ·   yo soy beto ✗   ·   ana ✓</text><text x="490.0" y="394" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Si dudas, pon paréntesis: cuestan un carácter y quitan la ambigüedad.</text></svg>