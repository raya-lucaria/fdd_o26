<svg xmlns="http://www.w3.org/2000/svg" width="980" height="366" viewBox="0 0 980 366" role="img" aria-label="Un patron y un archivo de texto entran a un motor de expresiones regulares; el motor recorre el texto linea por linea y deja salir solo las lineas donde encontro el patron"><rect x="0" y="0" width="980" height="366" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="490.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Qué hace una expresión regular</text><rect x="40" y="82" width="240" height="62" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="160" y="105" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el patrón</text><text x="160" y="131" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">ana</text><rect x="40" y="172" width="240" height="108" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="160" y="195" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el texto</text><text x="160" y="220" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">Ana Ruiz</text><text x="160" y="242" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">Mariana Solís</text><text x="160" y="264" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">Beto Lara</text><line x1="284" y1="113" x2="388" y2="165" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="284" y1="226" x2="388" y2="196" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="392" y="140" width="220" height="82" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="502" y="168" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">el motor</text><text x="502" y="191" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lee de izquierda a derecha,</text><text x="502" y="208" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una línea a la vez</text><line x1="616" y1="181" x2="700" y2="181" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="704" y="140" width="236" height="82" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="822" y="165" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">las líneas que coinciden</text><text x="822" y="191" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">Ana Ruiz</text><text x="822" y="211" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">Mariana Solís</text><text x="490.0" y="320" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">«Mariana» también pasa: la regex busca una subcadena, no una palabra completa.</text><text x="490.0" y="344" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">grep imprime la línea entera; la coincidencia fue sólo el pedazo «ana».</text></svg>