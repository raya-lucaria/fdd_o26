<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="484" viewBox="0 0 1080 484" role="img" aria-label="Tabla de seis simbolos y tres columnas: que significa cada uno suelto en el patron, dentro de unos corchetes y precedido de barra invertida; dentro de los corchetes casi todos pierden su poder"><rect x="0" y="0" width="1080" height="484" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El mismo símbolo, tres significados</text><text x="540.0" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">lo que decide no es el símbolo: es dónde está</text><text x="120.0" y="116" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">símbolo</text><text x="368.0" y="116" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">suelto en el patrón</text><text x="667.0" y="116" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">dentro de [ … ]</text><text x="939.0" y="116" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">escapado con \</text><line x1="20" y1="130" x2="1060" y2="130" stroke="#4a7a63" stroke-width="2"/><text x="120.0" y="163" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">.</text><text x="368.0" y="163" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cualquier carácter</text><text x="667.0" y="163" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un punto literal</text><text x="939.0" y="163" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un punto literal</text><rect x="20" y="182" width="1040" height="50" rx="6" fill="#141b20" stroke="none" stroke-width="0"/><text x="120.0" y="213" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">*</text><text x="368.0" y="213" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">repite lo anterior</text><text x="667.0" y="213" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un asterisco literal</text><text x="939.0" y="213" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un asterisco literal</text><text x="120.0" y="263" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">+</text><text x="368.0" y="263" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">una o más veces</text><text x="667.0" y="263" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un signo más literal</text><text x="939.0" y="263" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un signo más literal</text><rect x="20" y="282" width="1040" height="50" rx="6" fill="#141b20" stroke="none" stroke-width="0"/><text x="120.0" y="313" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">^</text><text x="368.0" y="313" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">inicio de línea</text><text x="667.0" y="313" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">niega, sólo si va primero</text><text x="939.0" y="313" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un circunflejo literal</text><text x="120.0" y="363" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">-</text><text x="368.0" y="363" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un guion literal</text><text x="667.0" y="363" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">rango, salvo en los extremos</text><text x="939.0" y="363" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un guion literal</text><rect x="20" y="382" width="1040" height="50" rx="6" fill="#141b20" stroke="none" stroke-width="0"/><text x="120.0" y="413" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">]</text><text x="368.0" y="413" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un corchete literal</text><text x="667.0" y="413" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cierra, salvo si va primero</text><text x="939.0" y="413" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un corchete literal</text><text x="540.0" y="448" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Dentro de los corchetes casi todo pierde su poder: por eso [.] es un punto y [a+b] casa una a, un + o una b.</text></svg>