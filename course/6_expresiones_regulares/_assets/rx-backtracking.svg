<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Sobre el texto menor a mayor que, el punto asterisco toma ocho caracteres y falla porque despues no queda ningun mayor que; cede uno y entonces si encaja, dejando una sola coincidencia que abarca todo el renglon; debajo, la clase negada se detiene sola y da dos coincidencias cortas"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El goloso toma de más y después cede</text><text x="540.0" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">patrón &lt;.*&gt; sobre este renglón — «␣» es un espacio</text><rect x="150" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="175.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">&lt;</text><rect x="206" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="231.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">a</text><rect x="262" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="287.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">&gt;</text><rect x="318" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="343.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">␣</text><rect x="374" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="399.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">y</text><rect x="430" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="455.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">␣</text><rect x="486" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="511.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">&lt;</text><rect x="542" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="567.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">b</text><rect x="598" y="108" width="50" height="50" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="623.0" y="139.66666666666666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">&gt;</text><rect x="206" y="190" width="442" height="36" rx="8" fill="none" stroke="#ff8a7a" stroke-width="3"/><text x="427.0" y="214" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">a&gt;␣y␣&lt;b&gt;</text><text x="672" y="206" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">.* toma los ocho</text><text x="672" y="226" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">y después no queda ningún &gt;</text><rect x="206" y="256" width="386" height="36" rx="8" fill="none" stroke="#7ef29d" stroke-width="3"/><text x="399.0" y="280" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">a&gt;␣y␣&lt;b</text><text x="672" y="272" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">cede uno</text><text x="672" y="292" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el siguiente sí es &gt; → encaja</text><rect x="150" y="322" width="498" height="36" rx="8" fill="none" stroke="#7ef29d" stroke-width="3"/><text x="399.0" y="346" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">&lt;a&gt;␣y␣&lt;b&gt;</text><text x="672" y="346" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">una sola coincidencia</text><text x="540.0" y="406" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Ese ceder es lo único que retrocede. La cabeza sigue sin volver atrás: lo que se mueve es hasta dónde llega la repetición</text><text x="540.0" y="428" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">dentro de un mismo intento.</text><text x="540.0" y="470" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">&lt;[^&gt;]*&gt;</text><rect x="150" y="492" width="162" height="36" rx="8" fill="none" stroke="#7ef29d" stroke-width="3"/><text x="231.0" y="516" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">&lt;a&gt;</text><rect x="486" y="492" width="162" height="36" rx="8" fill="none" stroke="#7ef29d" stroke-width="3"/><text x="567.0" y="516" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">&lt;b&gt;</text><text x="672" y="516" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">no cede nada:</text><text x="672" y="536" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">se detiene sola en el primer &gt;</text></svg>