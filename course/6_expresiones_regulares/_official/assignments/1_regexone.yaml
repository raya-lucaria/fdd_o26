id: regexone-practica
type: assignment
authority: official
content:
  title: "RegexOne: de la lección 1 al problema 4"
  instructions: >-
    Para la clase del martes 8 de septiembre recorre RegexOne hasta terminar el
    Problema 4. Son dos tramos.
    Primero el tutorial completo: las lecciones 1 a 15. Son dieciséis pantallas
    porque hay una lección 1½. Cada una te da unas cadenas que deben casar y
    otras que no, y sólo avanzas cuando tu patrón las separa bien.
    Después los primeros cuatro problemas de práctica: 1 números decimales,
    2 teléfonos, 3 correos y 4 etiquetas HTML. Detente ahí y no sigas al
    problema 5. Esos cuatro son, uno por uno, lo que ya construimos en la
    unidad: los rangos y el separador opcional del teléfono, el autómata del
    correo y el caso goloso de las etiquetas. Si alguno se te atora, la página
    de la unidad que lo trata está en la lista de recursos.
    Un aviso que te va a ahorrar tiempo: la caja interactiva de RegexOne usa el
    dialecto de JavaScript, donde \d y \w sí funcionan. En tu terminal con
    grep -E, \d busca una letra d. Es exactamente la trampa de la página 5, y
    ahora la vas a ver desde los dos lados. Cuando pases un patrón del sitio a
    la terminal, traduce \d a [0-9].
    Entrega una captura de pantalla del último nivel que resolviste, con el
    patrón que escribiste y las marcas de verde visibles. Si llegaste hasta el
    Problema 4, esa es la captura. Si te quedaste antes, captura hasta donde
    llegaste y dilo: reportar el pendiente cuenta como entrega, presumir un
    avance que no ocurrió no.
    Sobre la ayuda: no está prohibido buscar, pero te pido de verdad que
    intentes cada nivel sin preguntarle a un modelo de lenguaje. Un LLM te
    devuelve el patrón ya escrito y te salta justo lo único que esta tarea
    entrena, que es leer una expresión de izquierda a derecha y decidir qué
    hace. Es un ejercicio de cabeza, y la cabeza sólo se ejercita fallando un
    par de veces primero. Si acabas consultando algo, anótalo; no baja la
    calificación.
    Se entrega en Canvas: https://itam.instructure.com/courses/17979/assignments/227512
