content:
  title: "Ver la primera mitad de «Bash Scripting Tutorial for Beginners»"
  instructions: >-
    Ve la primera mitad del video de TechWorld with Nana antes de la clase del
    martes 25 de agosto: desde el inicio hasta la sección **«Variables in Shell
    Scripts», incluida**. Ahí puedes detenerte; la segunda mitad —condicionales,
    ciclos, funciones y argumentos— la vemos después.
    Este tramo cubre lo mínimo para que la terminal deje de ser una lista de
    comandos sueltos: qué es una shell y qué es Bash, cómo se escribe un script,
    por qué la primera línea es un `#!/bin/bash`, qué hace `chmod +x` y cómo se
    guarda un valor en una variable para reutilizarlo. Es la diferencia entre
    teclear cosas y automatizarlas, y es el punto donde el sistema que acabas de
    instalar empieza a servirte para algo.
    El video está en inglés y trae subtítulos automáticos. Velo con la terminal
    abierta y reproduce los ejemplos conforme aparecen: no hay entrega, pero se
    preguntará en clase y el resto del curso da por hecho que ya sabes escribir
    un script y correrlo.
  resources:
    - title: "Bash Scripting Tutorial for Beginners — TechWorld with Nana"
