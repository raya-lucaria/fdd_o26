<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="Una tabla de seis escenarios de trabajo simultaneo. Cada fila dice que toco cada persona y que hace Git: en los tres primeros resuelve solo, y en los tres ultimos marca conflicto y pide que alguien decida. Los casos van de archivos distintos hasta uno que borra mientras el otro edita el mismo archivo"><rect x="0" y="0" width="1080" height="500" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Qué hace Git según lo que haya tocado cada quien</text><text x="60" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el escenario</text><text x="380" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">ana</text><text x="620" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">beto</text><text x="860" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">qué hace Git</text><rect x="40" y="108" width="1000" height="52" rx="8" fill="#141b20" stroke="#7ef29d" stroke-width="1.4"/><text x="60" y="140" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">archivos distintos</text><text x="380" y="140" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">toca main.py</text><text x="620" y="140" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">toca app.py</text><text x="860" y="140" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">resuelve solo</text><rect x="40" y="168" width="1000" height="52" rx="8" fill="#141b20" stroke="#7ef29d" stroke-width="1.4"/><text x="60" y="200" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">mismo archivo, lejos</text><text x="380" y="200" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">línea 3</text><text x="620" y="200" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">línea 60</text><text x="860" y="200" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">resuelve solo</text><rect x="40" y="228" width="1000" height="52" rx="8" fill="#141b20" stroke="#7ef29d" stroke-width="1.4"/><text x="60" y="260" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">una branch no avanzó</text><text x="380" y="260" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">3 commits</text><text x="620" y="260" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">nada</text><text x="860" y="260" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">fast-forward</text><rect x="40" y="288" width="1000" height="52" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.4"/><text x="60" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">mismo archivo, pegados</text><text x="380" y="320" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">línea 33</text><text x="620" y="320" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">línea 37</text><text x="860" y="320" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conflicto</text><rect x="40" y="348" width="1000" height="52" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.4"/><text x="60" y="380" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">la misma línea</text><text x="380" y="380" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">línea 12</text><text x="620" y="380" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">línea 12</text><text x="860" y="380" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conflicto</text><rect x="40" y="408" width="1000" height="52" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.4"/><text x="60" y="440" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">uno borra, otro edita</text><text x="380" y="440" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">borra notas.md</text><text x="620" y="440" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">edita notas.md</text><text x="860" y="440" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conflicto</text><text x="540.0" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Conflicto no significa que algo se rompió: significa que Git no puede decidir por ti y se detiene antes de tirar trabajo.</text></svg>