<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Una cadena de commits con dos etiquetas. La linea de abajo es main con tres commits; de la segunda se desprende hacia arriba una branch de tarea con dos commits propios. Las etiquetas main y tarea son chips que apuntan al ultimo commit de cada linea, y HEAD marca en cual estas parado. Abajo, dos paneles comparan el merge fast-forward con el que crea un commit nuevo de dos padres"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Una branch no copia archivos: es una etiqueta que apunta a un commit</text><line x1="144" y1="236" x2="236" y2="236" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><line x1="284" y1="236" x2="376" y2="236" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><line x1="278" y1="218" x2="382" y2="156" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><line x1="424" y1="140" x2="516" y2="140" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><circle cx="120" cy="236" r="22" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="120" y="242" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="260" cy="236" r="22" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="260" y="242" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="400" cy="236" r="22" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="400" y="242" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="400" cy="140" r="22" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="400" y="146" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="540" cy="140" r="22" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="540" y="146" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><rect x="370.0" y="282" width="60" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="400" y="301" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">main</text><line x1="400" y1="280" x2="400" y2="262" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="466.0" y="66" width="148" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="540" y="85" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">tarea-07-git</text><line x1="540" y1="96" x2="540" y2="114" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="632.0" y="126" width="60" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="662" y="145" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">HEAD</text><line x1="624" y1="140" x2="572" y2="140" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="720" y="120" width="320" height="148" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="1.4"/><text x="880" y="150" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Qué hay en el disco</text><text x="880" y="180" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">.git/refs/heads/main</text><text x="880" y="204" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">41 bytes: un hash y un salto de línea</text><text x="880" y="232" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Eso es toda la branch.</text><text x="880" y="254" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Por eso crearla es instantánea.</text><rect x="40" y="340" width="480" height="190" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="280" y="372" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">merge fast-forward</text><text x="280" y="398" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">nadie tocó main mientras trabajabas</text><circle cx="150" cy="448" r="17" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="150" y="454" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="250" cy="448" r="17" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="250" y="454" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="350" cy="448" r="17" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="350" y="454" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><line x1="167" y1="448" x2="233" y2="448" stroke="#4a7a63" stroke-width="1.8" marker-end="url(#f4a7a63)"/><line x1="267" y1="448" x2="333" y2="448" stroke="#4a7a63" stroke-width="1.8" marker-end="url(#f4a7a63)"/><text x="280" y="502" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la etiqueta main sólo se desliza hacia adelante</text><rect x="560" y="340" width="480" height="190" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="800" y="372" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">merge con commit nuevo</text><text x="800" y="398" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">las dos líneas avanzaron por separado</text><circle cx="660" cy="448" r="17" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="660" y="454" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="770" cy="420" r="17" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="770" y="426" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="770" cy="476" r="17" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="770" y="482" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><circle cx="890" cy="448" r="17" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="890" y="454" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle"></text><line x1="674" y1="440" x2="754" y2="425" stroke="#4a7a63" stroke-width="1.8" marker-end="url(#f4a7a63)"/><line x1="674" y1="456" x2="754" y2="471" stroke="#4a7a63" stroke-width="1.8" marker-end="url(#f4a7a63)"/><line x1="786" y1="425" x2="876" y2="440" stroke="#4a7a63" stroke-width="1.8" marker-end="url(#f4a7a63)"/><line x1="786" y1="471" x2="876" y2="456" stroke="#4a7a63" stroke-width="1.8" marker-end="url(#f4a7a63)"/><text x="800" y="512" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">nace un commit con dos padres</text></svg>