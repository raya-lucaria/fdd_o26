<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-label="Seis sistemas de control de versiones en orden cronologico, de SCCS en 1972 a Git en 2005, cada uno coloreado segun su modelo: ambar para los locales que trabajan un archivo a la vez, violeta para los centralizados que dependen de un servidor, y verde para los distribuidos donde cada copia es completa. Una flecha al pie marca el paso del tiempo"><rect x="0" y="0" width="1080" height="340" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Antes de Git: de un archivo a la vez a una copia completa por persona</text><rect x="40" y="86" width="156" height="118" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="118.0" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1972</text><text x="118.0" y="148" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">SCCS</text><text x="118.0" y="178" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">local</text><rect x="208" y="86" width="156" height="118" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="286.0" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1982</text><text x="286.0" y="148" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">RCS</text><text x="286.0" y="178" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">local</text><rect x="376" y="86" width="156" height="118" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="454.0" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1986</text><text x="454.0" y="148" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">CVS</text><text x="454.0" y="178" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">centralizado</text><rect x="544" y="86" width="156" height="118" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="622.0" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">2000</text><text x="622.0" y="148" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">Subversion</text><text x="622.0" y="178" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">centralizado</text><rect x="712" y="86" width="156" height="118" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="790.0" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">2000</text><text x="790.0" y="148" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">BitKeeper</text><text x="790.0" y="178" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">distribuido</text><rect x="880" y="86" width="156" height="118" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="958.0" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">2005</text><text x="958.0" y="148" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">Git</text><text x="958.0" y="178" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">distribuido</text><line x1="40" y1="236" x2="1040" y2="236" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="540.0" y="266" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El tiempo. Cada modelo aparece porque el anterior no daba: primero compartir, luego trabajar en paralelo, al final no depender de nadie.</text><text x="540.0" y="296" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Mercurial nace el mismo mes que Git y por la misma razón. El kernel de Linux eligió Git.</text></svg>