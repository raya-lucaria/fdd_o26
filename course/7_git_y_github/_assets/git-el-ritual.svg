<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Tres carriles verticales con el flujo completo. El primero, ponte al dia, sincroniza main con el repositorio del curso y actualiza tu fork. El segundo, abre tu espacio, crea la branch de la tarea y copia el codigo a tu carpeta. El tercero, entrega, revisa el estado, agrega por ruta, commitea, sube la branch y abre el pull request"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El ritual: tres bloques, siempre en este orden</text><rect x="40" y="80" width="334" height="372" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><circle cx="207" cy="118" r="24" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="207" y="124" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">A</text><text x="207" y="168" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Ponte al día</text><rect x="60" y="200" width="294" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="207" y="224" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">cd ~/fdd/fdd_o26</text><rect x="60" y="244" width="294" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="207" y="268" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git switch main</text><rect x="60" y="288" width="294" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="207" y="312" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git fetch upstream</text><rect x="60" y="332" width="294" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="207" y="356" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git merge upstream/main</text><rect x="60" y="376" width="294" height="36" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="207" y="400" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git push origin main</text><text x="207" y="428" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Tu main queda idéntico al del curso.</text><rect x="373" y="80" width="334" height="372" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><circle cx="540" cy="118" r="24" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="540" y="124" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">B</text><text x="540" y="168" fill="#ffc857" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Abre tu espacio</text><rect x="393" y="200" width="294" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="540" y="224" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git switch -c tarea-07-git</text><rect x="393" y="244" width="294" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="540" y="268" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">mkdir -p estudiantes/$U/07_git</text><rect x="393" y="288" width="294" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="540" y="312" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">cp -r codigo/07_git/. → tu carpeta</text><rect x="393" y="376" width="294" height="36" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="540" y="400" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">y trabaja sólo ahí dentro</text><text x="540" y="428" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Nunca en main. Nunca fuera de tu carpeta.</text><rect x="706" y="80" width="334" height="372" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><circle cx="873" cy="118" r="24" fill="#0b0f12" stroke="#6fd8e8" stroke-width="2"/><text x="873" y="124" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C</text><text x="873" y="168" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Entrega</text><rect x="726" y="200" width="294" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="873" y="224" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git status</text><rect x="726" y="244" width="294" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="873" y="268" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git add estudiantes/$U/07_git</text><rect x="726" y="288" width="294" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="873" y="312" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git status</text><rect x="726" y="332" width="294" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="873" y="356" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git commit -m "..."</text><rect x="726" y="376" width="294" height="36" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="873" y="400" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">git push -u origin tarea-07-git</text><text x="873" y="428" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Y abre el pull request en el navegador.</text><line x1="384" y1="266" x2="364" y2="266" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><line x1="717" y1="266" x2="697" y2="266" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="540.0" y="494" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Los dos git status del bloque C no son adorno: son el hábito que evita subir basura. Míralos de verdad.</text><text x="540.0" y="522" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El último paso es comprobar que el robot quedó en verde. Sin eso no entregaste, aunque el pull request exista.</text></svg>