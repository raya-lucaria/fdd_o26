<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="El ciclo con el que se contribuye a cualquier proyecto de codigo abierto. Arriba, el repositorio del proyecto, donde no tienes permiso de escritura. Un fork lo copia a tu cuenta; un clone lo baja a tu maquina; ahi creas una branch y commiteas; el push sube esa branch a tu fork; y el pull request propone tus commits de vuelta al proyecto, cerrando el ciclo. Debajo, los mismos cinco pasos con los nombres que usa este curso"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Así se contribuye a cualquier proyecto de código abierto</text><text x="540.0" y="66" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">y por eso así se entrega en este curso</text><rect x="60" y="110" width="300" height="74" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="210.0" y="140" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">EL PROYECTO</text><text x="210.0" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">no puedes escribir en él</text><rect x="720" y="110" width="300" height="74" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="870.0" y="140" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">TU FORK</text><text x="870.0" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">una copia, en tu cuenta</text><rect x="720" y="300" width="300" height="74" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="870.0" y="330" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">TU MÁQUINA</text><text x="870.0" y="354" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">aquí trabajas, en una branch</text><line x1="366" y1="136" x2="714" y2="136" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><rect x="488.0" y="108" width="104" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="540" y="127" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">1 · fork</text><line x1="870" y1="190" x2="870" y2="294" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><rect x="812.5" y="228" width="115" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="870" y="247" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">2 · clone</text><text x="870" y="404" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3 · branch  +  commits</text><line x1="714" y1="337" x2="366" y2="337" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="433.0" y="309" width="214" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="540" y="328" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">4 · push a tu fork</text><rect x="60" y="300" width="300" height="74" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="210" y="330" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">TU BRANCH, YA SUBIDA</text><text x="210" y="354" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">visible en tu fork</text><line x1="210" y1="296" x2="210" y2="190" stroke="#c9a7ff" stroke-width="2.5" marker-end="url(#fc9a7ff)"/><rect x="114.0" y="229" width="192" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="210" y="248" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">5 · pull request</text><text x="540.0" y="452" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Nadie escribe en el proyecto: se propone, y alguien con permiso decide. Linux, Python y GitHub mismo funcionan así.</text><text x="540.0" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">En este curso el proyecto es el repositorio de la materia, y lo que propones vive sólo dentro de tu carpeta.</text><text x="540.0" y="516" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Los pasos 1 y 2 son el paso 0 del ritual, una vez en el semestre. Los pasos 3, 4 y 5 son los bloques B y C, en cada entrega.</text></svg>