<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="A la izquierda, la carpeta punto ssh de tu computadora con dos archivos: la llave privada, que nunca sale de ahi, y la publica. A la derecha, GitHub. Una flecha lleva solo la llave publica hacia GitHub, y otra de vuelta representa la comprobacion con ssh -T"><rect x="0" y="0" width="1080" height="500" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Dos llaves: una se queda, la otra viaja</text><rect x="40" y="96" width="400" height="236" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="240" y="128" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">tu computadora</text><text x="240" y="154" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">~/.ssh/</text><rect x="66" y="176" width="348" height="66" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="240" y="204" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">id_ed25519</text><text x="240" y="226" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">la privada — nunca sale de aquí</text><rect x="66" y="252" width="348" height="62" rx="8" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="240" y="279" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">id_ed25519.pub</text><text x="240" y="301" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">la pública — ésta sí se comparte</text><rect x="640" y="96" width="400" height="236" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="840" y="128" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">GitHub</text><text x="840" y="152" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Settings → SSH and GPG keys</text><rect x="666" y="190" width="348" height="62" rx="8" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="840" y="217" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">id_ed25519.pub</text><text x="840" y="239" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">pegada en tu cuenta</text><text x="840" y="292" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">reconoce tu computadora</text><text x="840" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sin volver a pedirte nada</text><line x1="448" y1="200" x2="632" y2="200" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="455.0" y="162" width="170" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="540" y="181" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">copiar y pegar</text><path d="M 632 288 C 580.48 348, 499.52 348, 448 288" fill="none" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="499.0" y="319.0" width="82" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="540" y="338.0" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">ssh -T</text><text x="540.0" y="412" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">La privada se queda en tu disco y nunca se manda, ni por correo, ni en una captura, ni en una tarea.</text><text x="540.0" y="442" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Si reseteas la computadora la pierdes, y eso está bien: se genera otra y se agrega. Una cuenta admite varias.</text><text x="540.0" y="470" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">El archivo que termina en .pub es el único que se copia a algún lado.</text></svg>