l="#0b0f12" stroke="#a7b8ad" stroke-width="1.6"/><text x="670" y="291" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">.DS_Store</text><text x="890" y="290" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">se queda fuera</text><rect x="590" y="314" width="420" height="42" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.6"/><text x="670" y="341" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">__pycache__/</text><text x="890" y="340" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">se queda fuera</text><rect x="590" y="364" width="420" height="42" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.6"/><text x="670" y="391" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">.env</text><text x="890" y="390" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">se queda fuera</text><text x="540.0" y="446" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">La regla no es teclear más: es agregar una ruta que puedas nombrar y que acabes de ver en git status.</text></svg>