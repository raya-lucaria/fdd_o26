<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="Dos arboles de archivos lado a lado. A la izquierda, en rojo, la carpeta codigo del curso, que es de solo lectura. A la derecha, en verde, tu carpeta dentro de estudiantes, con tu nombre de usuario de GitHub. Los nombres de subcarpeta y de archivo son identicos en los dos lados, y una flecha los une con el comando de copia"><rect x="0" y="0" width="1080" height="500" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Tu carpeta es un espejo: misma ruta, mismo nombre</text><rect x="40" y="82" width="420" height="236" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="250" y="112" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">zona roja — sólo lectura</text><text x="70" y="152" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">codigo/</text><text x="92" y="186" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">07_git/</text><text x="114" y="220" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">ejemplo.sh</text><text x="114" y="254" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">notas.md</text><text x="250" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">lo que yo publico. No lo edites.</text><rect x="620" y="82" width="420" height="236" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="830" y="112" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">zona verde — tuya</text><text x="650" y="152" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">estudiantes/</text><text x="672" y="186" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">tu-login/</text><text x="694" y="220" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">07_git/</text><text x="716" y="254" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">ejemplo.sh</text><text x="830" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">aquí trabajas. Sólo aquí.</text><line x1="468" y1="196" x2="612" y2="196" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="499.0" y="154" width="82" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="540" y="173" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">copiar</text><rect x="120" y="350" width="840" height="64" rx="10" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.6"/><text x="540" y="378" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">cp -r codigo/07_git/. estudiantes/$U/07_git/</text><text x="540" y="402" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">la barra y el punto copian el contenido, no la carpeta: sin ellos acabas con 07_git dentro de 07_git</text><text x="540.0" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El nombre 07_git no se inventa ni se traduce: es el mismo de los dos lados, y el robot lo compara.</text><text x="540.0" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Tu carpeta se llama exactamente como tu usuario de GitHub, que sale de un comando y no del teclado.</text></svg>