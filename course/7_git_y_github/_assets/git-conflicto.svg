<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="El contenido de un archivo en conflicto, con sus tres marcadores. Entre el primero y la linea de iguales esta la version de la branch en la que estas parado; entre la linea de iguales y el ultimo marcador esta la version que trae la otra branch. Etiquetas laterales identifican cada mitad, y al pie estan los pasos para resolver y la salida de emergencia"><rect x="0" y="0" width="1080" height="470" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Un conflicto no es un error: es Git preguntándote cuál de las dos quieres</text><rect x="40" y="76" width="600" height="250" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="1.4"/><text x="64" y="112" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">saludo = "hola"</text><text x="64" y="144" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><text x="64" y="176" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">mensaje = "buenos días"</text><text x="64" y="208" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">=======</text><text x="64" y="240" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">mensaje = "qué tal"</text><text x="64" y="272" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">&gt;&gt;&gt;&gt;&gt;&gt;&gt; otra-branch</text><text x="64" y="304" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">despedida = "adiós"</text><rect x="760" y="106" width="280" height="76" rx="9" fill="#0b0f12" stroke="#ffc857" stroke-width="1.4"/><text x="900" y="134" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">lo que ya tenías</text><text x="900" y="158" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la branch donde estás parado</text><line x1="752" y1="144" x2="652" y2="144" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="760" y="222" width="280" height="76" rx="9" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.4"/><text x="900" y="250" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">lo que trae la otra</text><text x="900" y="274" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la branch que estás mergeando</text><line x1="752" y1="260" x2="652" y2="260" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><text x="540.0" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Se resuelve a mano: borra los tres marcadores y deja el archivo como lo quieres.</text><text x="540.0" y="394" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Puede quedarse una mitad, la otra, o algo nuevo. Después git add al archivo, que es como le dices a Git que ya, y git commit.</text><text x="540.0" y="430" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">¿Se complicó? git merge --abort deja todo como estaba antes de empezar. Nunca es tarde para eso.</text></svg>