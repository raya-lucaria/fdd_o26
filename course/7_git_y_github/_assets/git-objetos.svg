<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="Tres tipos de objeto encadenados. Un commit apunta a un tree y a su commit padre, y guarda autor, fecha y mensaje. El tree lista nombres de archivo y apunta a los blobs. Cada blob es el contenido de un archivo sin su nombre. Al pie se indica que el hash se calcula sobre el contenido, asi que dos archivos iguales son el mismo blob"><rect x="0" y="0" width="1080" height="470" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Un commit apunta a un árbol; el árbol apunta al contenido</text><rect x="40" y="86" width="292" height="190" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="186" y="116" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">commit</text><text x="186" y="146" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">a1b2c3d</text><text x="186" y="176" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">tree:   9f8e7d6</text><text x="186" y="198" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">parent: 4c5d6e7</text><text x="186" y="220" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">autor y fecha</text><text x="186" y="242" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">"agrego el ejemplo"</text><text x="186" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">qué, quién, cuándo y de dónde viene</text><rect x="394" y="86" width="292" height="190" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="540" y="116" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">tree</text><text x="540" y="146" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">9f8e7d6</text><text x="540" y="180" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">una carpeta: nombres y a qué apuntan</text><text x="540" y="210" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ejemplo.sh  →  1111aaa</text><text x="540" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">notas.md    →  2222bbb</text><text x="540" y="262" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">aquí viven los nombres</text><rect x="748" y="86" width="292" height="88" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="894" y="114" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">blob</text><text x="894" y="142" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">1111aaa</text><text x="894" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el contenido, sin nombre</text><rect x="748" y="188" width="292" height="88" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="894" y="216" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">blob</text><text x="894" y="244" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">2222bbb</text><text x="894" y="266" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el contenido, sin nombre</text><line x1="340" y1="152" x2="386" y2="152" stroke="#c9a7ff" stroke-width="2.5" marker-end="url(#fc9a7ff)"/><line x1="694" y1="130" x2="740" y2="130" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><line x1="694" y1="232" x2="740" y2="232" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><text x="540.0" y="336" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">El hash no es un número de serie: se calcula sobre el contenido.</text><text x="540.0" y="362" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cambia una coma y cambia el hash. Dos archivos con el mismo contenido, aunque se llamen distinto</text><text x="540.0" y="384" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">y vivan en carpetas distintas, son el mismo blob guardado una sola vez.</text><text x="540.0" y="420" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Fíjate en que el nombre del archivo vive en el tree, no en el blob.</text><text x="540.0" y="442" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Por eso Git rastrea archivos y no carpetas: un tree vacío no existe.</text></svg>