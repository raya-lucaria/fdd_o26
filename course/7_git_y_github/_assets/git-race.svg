<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-label="Tres columnas con tres escenarios. En el primero cada persona toca un archivo distinto y todo funciona. En el segundo tocan el mismo archivo pero en lineas separadas y tambien funciona, porque Git compara por bloques. En el tercero tocan la misma linea y hay conflicto: el primer push entra y el segundo es rechazado"><rect x="0" y="0" width="1080" height="460" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Dos personas, un repositorio: qué pasa según qué toquen</text><rect x="40" y="80" width="334" height="316" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><circle cx="207" cy="116" r="22" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="207" y="122" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">A</text><text x="207" y="166" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">archivos distintos</text><rect x="66" y="202" width="282" height="36" rx="7" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="207" y="226" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">ana  toca  main.py</text><rect x="66" y="246" width="282" height="36" rx="7" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="207" y="270" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">beto toca  app.py</text><text x="207" y="322" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Funciona.</text><text x="207" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Git junta los dos cambios</text><text x="207" y="370" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">sin preguntarte nada.</text><rect x="373" y="80" width="334" height="316" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><circle cx="540" cy="116" r="22" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="540" y="122" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">B</text><text x="540" y="166" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">mismo archivo, lejos</text><rect x="399" y="202" width="282" height="36" rx="7" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="540" y="226" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">ana  toca  línea 3</text><rect x="399" y="246" width="282" height="36" rx="7" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="540" y="270" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">beto toca  línea 60</text><text x="540" y="322" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">También funciona.</text><text x="540" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Git compara por bloques con</text><text x="540" y="370" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">contexto, no línea por línea.</text><rect x="706" y="80" width="334" height="316" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><circle cx="873" cy="116" r="22" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="873" y="122" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C</text><text x="873" y="166" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">misma línea</text><rect x="732" y="202" width="282" height="36" rx="7" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="873" y="226" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">ana  toca  línea 12</text><rect x="732" y="246" width="282" height="36" rx="7" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="873" y="270" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">beto toca  línea 12</text><text x="873" y="322" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Conflicto.</text><text x="873" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Gana quien pushea primero;</text><text x="873" y="370" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el segundo es rechazado.</text><text x="540.0" y="430" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El rechazo no es un castigo: Git se niega a tirar trabajo que todavía no ha visto. La salida es git pull, resolver, y volver a pushear.</text></svg>