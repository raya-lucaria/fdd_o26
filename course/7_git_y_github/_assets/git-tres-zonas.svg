<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-label="Tres cajas en fila: el working directory donde editas, el staging area donde apartas lo que va a entrar, y el repositorio local donde queda guardado. Por arriba, dos arcos verdes avanzan con git add y git commit. Por abajo, dos arcos ambar regresan con git restore --staged y git reset. A la derecha, una caja punteada representa GitHub, todavia fuera de alcance porque nada de esto toca internet"><rect x="0" y="0" width="1080" height="540" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Las tres zonas: nada avanza solo</text><rect x="40" y="176" width="280" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="180" y="210" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">working directory</text><text x="180" y="238" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">donde editas</text><text x="180" y="266" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">lo que ves con ls</text><rect x="400" y="176" width="280" height="116" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="540" y="210" fill="#ffc857" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">staging area</text><text x="540" y="238" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">lo que va a entrar</text><text x="540" y="266" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">el index</text><rect x="760" y="176" width="280" height="116" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="900" y="210" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">repositorio local</text><text x="900" y="238" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">guardado para siempre</text><text x="900" y="266" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">.git/</text><path d="M 250 176 C 311.6 114, 408.4 114, 470 176" fill="none" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="313.5" y="115.5" width="93" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="360.0" y="134.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">git add</text><path d="M 610 176 C 671.6 114, 768.4 114, 830 176" fill="none" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="657.0" y="115.5" width="126" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="720.0" y="134.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">git commit</text><path d="M 470 292 C 408.4 354, 311.6 354, 250 292" fill="none" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="264.0" y="324.5" width="192" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="360.0" y="343.5" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">restore --staged</text><path d="M 830 292 C 768.4 354, 671.6 354, 610 292" fill="none" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="684.5" y="324.5" width="71" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="720.0" y="343.5" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">reset</text><rect x="40" y="396" width="280" height="68" rx="9" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.4"/><text x="180" y="422" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">git restore &lt;archivo&gt;</text><text x="180" y="446" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">descarta aquí lo que editaste</text><rect x="760" y="396" width="280" height="68" rx="9" fill="none" stroke="#a7b8ad" stroke-width="1.6" stroke-dasharray="8 6"/><text x="900" y="424" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">GitHub</text><text x="900" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">todavía no existe para ti</text><text x="540.0" y="500" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Un commit no sube nada. Puedes hacer cien en un avión sin wifi: el repositorio completo está en tu disco.</text><text x="540.0" y="524" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Nada de lo que hay en este diagrama toca internet.</text></svg>