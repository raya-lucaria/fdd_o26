<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-label="Dos casos del mismo archivo de setenta lineas. En el primero, las dos personas editan lineas muy separadas y los bloques de contexto que Git toma alrededor de cada cambio no se tocan, asi que el merge sale solo. En el segundo editan lineas vecinas, los bloques se traslapan y hay conflicto aunque las lineas sean distintas"><rect x="0" y="0" width="1080" height="540" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">«Líneas distintas» no basta: Git compara bloques, no líneas sueltas</text><rect x="40" y="74" width="470" height="356" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="275" y="104" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">lejos: los bloques no se tocan</text><rect x="80" y="138" width="44" height="240" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="68" y="143.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">1</text><text x="68" y="209.08695652173913" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">20</text><text x="68" y="278.6521739130435" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">40</text><text x="68" y="383.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">70</text><rect x="80" y="151.34782608695653" width="44" height="22" rx="4" fill="#6fd8e8" fill-opacity="0.3" stroke="#6fd8e8" stroke-width="1.3"/><line x1="124" y1="162.34782608695653" x2="168" y2="178" stroke="#6fd8e8" stroke-width="1.2" stroke-dasharray="4 3"/><text x="176" y="174" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ana edita la línea 8</text><text x="176" y="193" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">y su bloque de contexto</text><rect x="80" y="339.17391304347825" width="44" height="22" rx="4" fill="#c9a7ff" fill-opacity="0.3" stroke="#c9a7ff" stroke-width="1.3"/><line x1="124" y1="350.17391304347825" x2="168" y2="336" stroke="#c9a7ff" stroke-width="1.2" stroke-dasharray="4 3"/><text x="176" y="332" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">beto edita la línea 62</text><text x="176" y="351" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">y su bloque de contexto</text><text x="275" y="402" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Merge automático</text><text x="275" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Git aplica los dos cambios sin preguntar.</text><rect x="570" y="74" width="470" height="356" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="805" y="104" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">pegados: los bloques se traslapan</text><rect x="610" y="138" width="44" height="240" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="598" y="143.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">1</text><text x="598" y="209.08695652173913" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">20</text><text x="598" y="278.6521739130435" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">40</text><text x="598" y="383.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">70</text><rect x="610" y="238.30434782608694" width="44" height="22" rx="4" fill="#6fd8e8" fill-opacity="0.3" stroke="#6fd8e8" stroke-width="1.3"/><line x1="654" y1="249.30434782608694" x2="698" y2="200" stroke="#6fd8e8" stroke-width="1.2" stroke-dasharray="4 3"/><text x="706" y="196" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ana edita la línea 33</text><text x="706" y="215" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">y su bloque de contexto</text><rect x="610" y="252.2173913043478" width="44" height="22" rx="4" fill="#c9a7ff" fill-opacity="0.3" stroke="#c9a7ff" stroke-width="1.3"/><line x1="654" y1="263.2173913043478" x2="698" y2="300" stroke="#c9a7ff" stroke-width="1.2" stroke-dasharray="4 3"/><text x="706" y="296" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">beto edita la línea 37</text><text x="706" y="315" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">y su bloque de contexto</text><text x="805" y="402" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Conflicto</text><text x="805" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Aunque las líneas sean distintas.</text><text x="540.0" y="502" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">No hay un número mágico de líneas de separación: depende de cuánto contexto tome Git alrededor de cada cambio.</text></svg>