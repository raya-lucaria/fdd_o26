<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Tres repositorios y las flechas entre ellos. Arriba a la izquierda el del curso, llamado upstream, que solo se lee. Arriba a la derecha tu fork en tu cuenta, llamado origin, donde si escribes. Abajo al centro tu copia en el disco. Una flecha baja lo nuevo del curso con git fetch upstream, otra sube tu trabajo con git push origin, y una tercera punteada va de tu fork al curso: el pull request, que es un boton y no un comando"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Tres repositorios, y sólo en dos puedes escribir</text><rect x="60" y="86" width="400" height="128" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="260" y="122" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">upstream</text><text x="260" y="150" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">raya-lucaria/fdd_o26</text><text x="260" y="174" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el repositorio del curso</text><text x="260" y="196" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sólo lectura: aquí no escribes nunca</text><rect x="620" y="86" width="400" height="128" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="820" y="122" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">origin</text><text x="820" y="150" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">tu-login/fdd_o26</text><text x="820" y="174" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">tu fork, en tu propia cuenta</text><text x="820" y="196" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aquí sí escribes</text><rect x="340" y="330" width="400" height="128" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="540" y="366" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">tu disco</text><text x="540" y="394" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">~/fdd/fdd_o26</text><text x="540" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">donde de verdad trabajas</text><text x="540" y="440" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">commits, branches, todo lo de la clase 1</text><line x1="214" y1="220" x2="420" y2="322" stroke="#ff8a7a" stroke-width="2.5" marker-end="url(#fff8a7a)"/><rect x="161.0" y="254" width="214" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="268" y="273" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git fetch upstream</text><line x1="668" y1="322" x2="862" y2="220" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="709.5" y="260" width="181" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="800" y="279" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git push origin</text><path d="M 612 118 L 476 118" fill="none" stroke="#c9a7ff" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#fc9a7ff)"/><rect x="470.0" y="78" width="148" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="544" y="97" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">pull request</text><text x="544" y="148" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">un botón, no un comando</text><text x="540.0" y="500" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El fork se hace una sola vez, desde el navegador. Después tu disco habla con los dos: baja del curso, sube a tu fork.</text><text x="540.0" y="526" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Ojo: al clonar quedaste apuntando al repositorio del curso. Hay que renombrar ese remote antes de que nada de esto funcione.</text></svg>