<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="Cuatro pasos encadenados: clonar una vez, crear una rama, hacer commits y subir la rama. Debajo, la rama main aparece aparte y marcada como intocable porque publica el sitio, con una flecha roja que muestra que no se hace push directo a ella"><rect x="0" y="0" width="1080" height="470" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Tu trabajo vive en tu rama</text><rect x="53.0" y="118" width="224" height="92" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="165.0" y="158" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git clone</text><text x="165.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">una sola vez</text><rect x="303.0" y="118" width="224" height="92" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="415.0" y="158" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git switch -c</text><text x="415.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu rama</text><line x1="279.0" y1="164.0" x2="297.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="553.0" y="118" width="224" height="92" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="665.0" y="158" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git commit</text><text x="665.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">las veces que haga falta</text><line x1="529.0" y1="164.0" x2="547.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="803.0" y="118" width="224" height="92" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="915.0" y="158" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git push</text><text x="915.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu rama queda en GitHub</text><line x1="779.0" y1="164.0" x2="797.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="390.0" y="300" width="300" height="86" rx="10" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="540.0" y="334" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">main</text><text x="540.0" y="360" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">publica el sitio — no la toques</text><path d="M 415.0 216 C 450.0 278, 505.0 358, 540.0 296" fill="none" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="381.5" y="262.5" width="192" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="477.5" y="281.5" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">push directo: no</text><text x="540.0" y="424" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Al terminar el push, tu rama ya está en GitHub y ahí se queda. Cómo se incorpora a main lo vemos más adelante.</text></svg>