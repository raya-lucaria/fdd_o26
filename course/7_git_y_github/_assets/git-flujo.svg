<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="470" viewBox="0 0 1140 470" role="img" aria-label="Cinco pasos encadenados: clonar, crear una rama, hacer commits, subir la rama y abrir un pull request; solo al aceptarse el pull request entra a main y el sitio se publica. Una flecha roja tachada muestra que no se hace push directo a main"><rect x="0" y="0" width="1140" height="470" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="570.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Tu cambio llega a main por una puerta, no por la ventana</text><rect x="51.0" y="118" width="190" height="92" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="146.0" y="158" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git clone</text><text x="146.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">una vez</text><rect x="263.0" y="118" width="190" height="92" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="358.0" y="158" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git switch -c</text><text x="358.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu rama</text><line x1="243.0" y1="164.0" x2="257.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="475.0" y="118" width="190" height="92" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="570.0" y="158" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git commit</text><text x="570.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">las veces que haga falta</text><line x1="455.0" y1="164.0" x2="469.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="687.0" y="118" width="190" height="92" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="782.0" y="158" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git push</text><text x="782.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">sube tu rama</text><line x1="667.0" y1="164.0" x2="681.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="899.0" y="118" width="190" height="92" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="994.0" y="158" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">Pull Request</text><text x="994.0" y="184" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">alguien lo revisa</text><line x1="879.0" y1="164.0" x2="893.0" y2="164.0" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="475.0" y="288" width="190" height="84" rx="10" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="570.0" y="322" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">main</text><text x="570.0" y="348" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">publica el sitio</text><path d="M 994.0 214 C 886.48 284, 717.52 354, 610.0 284" fill="none" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="738.0" y="232" width="148" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="812.0" y="251" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">al aceptarse</text><path d="M 358.0 214 C 406.16 144, 481.84 214, 530.0 284" fill="none" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="338.0" y="232" width="192" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="434.0" y="251" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">push directo: no</text><text x="570.0" y="414" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Un push a main dispara la publicación del sitio. Por eso el trabajo entra por una rama y un pull request:</text><text x="570.0" y="440" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">así hay un paso donde alguien mira el cambio antes de que salga al aire.</text></svg>