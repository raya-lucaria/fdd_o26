<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="A la izquierda el repositorio del curso en GitHub; a la derecha tu copia local. Una flecha baja el codigo con git clone la primera vez y otra lo actualiza con git pull cada vez que hay algo nuevo. Una tercera flecha, en rojo y de vuelta hacia GitHub, aparece marcada como que no aplica: en este repositorio no escribes. Abajo, una caja punteada anuncia que el trabajo se hara sobre un fork propio, mas adelante"><rect x="0" y="0" width="1080" height="470" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Este repositorio lo lees; no escribes en él</text><rect x="56" y="100" width="384" height="130" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="248" y="134" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">GitHub</text><text x="248" y="164" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">raya-lucaria/fdd_o26</text><text x="248" y="192" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el repositorio del curso</text><text x="248" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">público: cualquiera puede leerlo</text><rect x="640" y="100" width="384" height="130" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="832" y="134" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">tu computadora</text><text x="832" y="164" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">~/fdd/fdd_o26</text><text x="832" y="192" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">tu copia, para leer y consultar</text><text x="832" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">y para correr lo que trae dentro</text><line x1="448" y1="140" x2="632" y2="140" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="482.5" y="104" width="115" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="540" y="123" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">git clone</text><text x="540" y="162" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la primera vez</text><line x1="448" y1="210" x2="632" y2="210" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="488.0" y="174" width="104" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="540" y="193" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">git pull</text><text x="540" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">cada vez que haya algo nuevo</text><path d="M 632 268 C 580.48 324, 499.52 324, 448 268" fill="none" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="466.0" y="296.0" width="148" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="540" y="315.0" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">git push: no</text><text x="540" y="344" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">no tienes permiso de escritura, y no lo necesitas</text><rect x="290" y="372" width="500" height="52" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.6" stroke-dasharray="8 6"/><text x="540" y="396" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cuando toque trabajar será sobre un fork tuyo,</text><text x="540" y="415" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">una copia del repositorio en tu propia cuenta. Eso lo vemos en clase.</text></svg>