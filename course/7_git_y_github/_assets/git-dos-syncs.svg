<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="Los dos caminos para poner al dia tu copia, lado a lado. Hay tres copias de main: la del curso, la de tu fork en el servidor de GitHub y la de tu maquina. Por la terminal, el curso baja primero a tu maquina con fetch y merge, y de ahi sube a tu fork con push: tu maquina es el puente. Por el navegador, el boton Sync fork actualiza primero tu fork en el servidor, y de ahi baja a tu maquina con git pull: tu fork es el puente. Las dos rutas terminan con las tres copias iguales"><rect x="0" y="0" width="1080" height="520" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="38" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Hay tres copias de main. Sincronizar es hacer que las tres coincidan</text><text x="540.0" y="62" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">los dos caminos cambian quién recibe primero, y quién hace de puente</text><rect x="30" y="86" width="480" height="300" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="270" y="116" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Por la terminal  ·  el bloque A</text><rect x="170" y="138" width="200" height="52" rx="8" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.6"/><text x="270" y="160" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">EL CURSO</text><text x="270" y="178" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">upstream</text><rect x="56" y="276" width="170" height="52" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="1.6"/><text x="141" y="298" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">TU FORK</text><text x="141" y="316" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">en GitHub</text><rect x="314" y="276" width="170" height="52" rx="8" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.6"/><text x="399" y="298" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">TU MÁQUINA</text><text x="399" y="316" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el disco</text><line x1="326" y1="194" x2="386" y2="270" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><rect x="300.5" y="214" width="203" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="402" y="233" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">1 · fetch + merge</text><line x1="308" y1="350" x2="232" y2="350" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><rect x="152.0" y="354" width="236" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="270" y="373" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">2 · push origin main</text><rect x="570" y="86" width="480" height="300" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="810" y="116" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Por el navegador  ·  el botón</text><rect x="710" y="138" width="200" height="52" rx="8" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.6"/><text x="810" y="160" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">EL CURSO</text><text x="810" y="178" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">upstream</text><rect x="596" y="276" width="170" height="52" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="1.6"/><text x="681" y="298" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">TU FORK</text><text x="681" y="316" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">en GitHub</text><rect x="854" y="276" width="170" height="52" rx="8" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.6"/><text x="939" y="298" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">TU MÁQUINA</text><text x="939" y="316" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el disco</text><line x1="754" y1="194" x2="694" y2="270" stroke="#c9a7ff" stroke-width="2.2" marker-end="url(#fc9a7ff)"/><rect x="573.5" y="214" width="225" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="686" y="233" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">1 · botón Sync fork</text><line x1="772" y1="350" x2="848" y2="350" stroke="#c9a7ff" stroke-width="2.2" marker-end="url(#fc9a7ff)"/><rect x="692.0" y="354" width="236" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="810" y="373" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">2 · pull origin main</text><text x="285" y="412" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Úsalo siempre. Es el bloque A.</text><text x="810" y="412" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sólo si aún no clonaste, o tu copia está rota.</text><text x="540.0" y="456" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">No los mezcles: si aprietas el botón teniendo commits propios en tu main local, el git pull te crea un merge y tu main empieza a divergir.</text><text x="540.0" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Las dos rutas acaban igual: las tres copias de main, idénticas.</text></svg>