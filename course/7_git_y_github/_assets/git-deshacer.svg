<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="Un arbol de decision. La pregunta de arriba es donde esta el cambio que quieres deshacer, y de ella bajan cuatro ramas: en el working directory, en el staging area, en el ultimo commit sin compartir, y a medias cuando necesitas guardarlo para despues. Cada rama termina en su comando. Una franja al pie separa lo que reescribe la historia de lo que no"><rect x="0" y="0" width="1080" height="480" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">No preguntes qué comando quieres; pregunta dónde está el cambio</text><rect x="340" y="70" width="400" height="54" rx="10" fill="#16302a" stroke="#e8f0e8" stroke-width="2"/><text x="540" y="104" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">¿dónde está el cambio?</text><line x1="540" y1="130" x2="150" y2="176" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="40" y="182" width="220" height="150" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="150" y="210" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">en el working directory</text><text x="150" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">lo editaste y ya</text><rect x="52" y="248" width="196" height="40" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.4"/><text x="150" y="273" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git restore &lt;archivo&gt;</text><text x="150" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sólo si ya estaba rastreado</text><line x1="540" y1="130" x2="410" y2="176" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="300" y="182" width="220" height="150" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="410" y="210" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">en el staging area</text><text x="410" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">le hiciste add</text><rect x="312" y="248" width="196" height="40" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.4"/><text x="410" y="273" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git restore --staged &lt;archivo&gt;</text><text x="410" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">lo saca, no lo borra</text><line x1="540" y1="130" x2="670" y2="176" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="560" y="182" width="220" height="150" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="670" y="210" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">en el último commit</text><text x="670" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">y no lo has compartido</text><rect x="572" y="248" width="196" height="40" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.4"/><text x="670" y="273" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git reset --soft HEAD~1</text><text x="670" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">--hard además tira tu trabajo</text><line x1="540" y1="130" x2="930" y2="176" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="820" y="182" width="220" height="150" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="930" y="210" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">a medias, y estorba</text><text x="930" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">quieres volver luego</text><rect x="832" y="248" width="196" height="40" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.4"/><text x="930" y="273" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git stash / git stash pop</text><text x="930" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">revisa git stash list al final</text><rect x="40" y="366" width="480" height="82" rx="10" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.6"/><text x="280" y="396" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">No reescribe la historia</text><text x="280" y="422" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">restore, stash. Seguros siempre.</text><rect x="560" y="366" width="480" height="82" rx="10" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.6"/><text x="800" y="396" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Reescribe la historia</text><text x="800" y="422" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">reset. Barato en lo tuyo, caro en lo compartido.</text></svg>