<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-label="Tres casos de conflicto que no son de contenido. En el primero uno borra un archivo mientras el otro lo edita. En el segundo los dos crean un archivo con el mismo nombre y distinto contenido. En el tercero uno renombra el archivo mientras el otro lo edita, y Git suele seguir el contenido y aplicar la edicion sobre el nombre nuevo"><rect x="0" y="0" width="1080" height="430" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Tres conflictos que no son de contenido</text><rect x="40" y="76" width="330" height="280" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="205" y="108" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">borrar contra editar</text><rect x="62" y="132" width="286" height="38" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="205" y="156" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">ana borra notas.md</text><rect x="62" y="180" width="286" height="38" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="205" y="204" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">beto edita notas.md</text><text x="205" y="254" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Git no adivina si el archivo</text><text x="205" y="274" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">debe existir. Tú decides.</text><text x="205" y="324" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">git status te dice cuál es</text><rect x="375" y="76" width="330" height="280" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="540" y="108" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">los dos lo crean</text><rect x="397" y="132" width="286" height="38" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="540" y="156" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">ana crea guia.md</text><rect x="397" y="180" width="286" height="38" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="540" y="204" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">beto crea guia.md</text><text x="540" y="254" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Mismo nombre, distinto contenido.</text><text x="540" y="274" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Conflicto desde la primera línea.</text><text x="540" y="324" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">git status te dice cuál es</text><rect x="710" y="76" width="330" height="280" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="875" y="108" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">renombrar contra editar</text><rect x="732" y="132" width="286" height="38" rx="7" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="875" y="156" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">ana lo llama apuntes.md</text><rect x="732" y="180" width="286" height="38" rx="7" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="875" y="204" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">beto edita notas.md</text><text x="875" y="254" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Git sigue el contenido y suele</text><text x="875" y="274" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">aplicar la edición al nombre nuevo.</text><text x="875" y="324" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">git status te dice cuál es</text><text x="540.0" y="396" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">En los tres, la salida es la misma que ya conoces: git merge --abort para volver atrás, o resolver y hacer git add.</text></svg>