<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="El mecanismo del merge. Arriba, tres columnas con el mismo archivo: la version base que es el ancestro comun, la version tuya y la version de la otra branch. Cada linea esta marcada segun quien la cambio respecto de la base. Abajo, el resultado: donde solo uno cambio, Git toma ese cambio sin preguntar; donde cambiaron los dos, marca conflicto"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Git no compara tu versión con la otra: compara las dos contra el ancestro</text><rect x="40" y="76" width="300" height="210" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="190" y="106" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">base</text><text x="190" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">el último commit que</text><text x="190" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">las dos compartían</text><rect x="58" y="168" width="264" height="34" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="86" y="190" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 3</text><text x="240" y="190" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">hola</text><rect x="58" y="208" width="264" height="34" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="86" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 12</text><text x="240" y="230" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">buenos días</text><rect x="58" y="248" width="264" height="34" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="86" y="270" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 60</text><text x="240" y="270" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">adiós</text><rect x="390" y="76" width="300" height="210" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="540" y="106" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">tu versión</text><text x="540" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">lo que hiciste</text><text x="540" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">en tu branch</text><rect x="408" y="168" width="264" height="34" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="436" y="190" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 3</text><text x="590" y="190" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">hola</text><rect x="408" y="208" width="264" height="34" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="436" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 12</text><text x="590" y="230" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">qué tal</text><rect x="408" y="248" width="264" height="34" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="436" y="270" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 60</text><text x="590" y="270" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">adiós</text><rect x="740" y="76" width="300" height="210" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="890" y="106" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">la otra versión</text><text x="890" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">lo que hicieron</text><text x="890" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">en la otra branch</text><rect x="758" y="168" width="264" height="34" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="786" y="190" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 3</text><text x="940" y="190" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">buenas</text><rect x="758" y="208" width="264" height="34" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="786" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 12</text><text x="940" y="230" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">buenas tardes</text><rect x="758" y="248" width="264" height="34" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="786" y="270" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 60</text><text x="940" y="270" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">adiós</text><rect x="240" y="366" width="600" height="128" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="540" y="396" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">resultado del merge</text><text x="288" y="430" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 3</text><text x="430" y="430" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">buenas</text><text x="660" y="430" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sólo la otra la tocó</text><text x="288" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 12</text><text x="430" y="456" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">CONFLICTO</text><text x="660" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">las dos la tocaron</text><text x="288" y="482" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">línea 60</text><text x="430" y="482" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">adiós</text><text x="660" y="482" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">nadie la tocó</text><line x1="190" y1="296" x2="400" y2="358" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><line x1="540" y1="296" x2="540" y2="358" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><line x1="890" y1="296" x2="680" y2="358" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><text x="540.0" y="526" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">La regla es una sola: si un cambio viene de un solo lado, Git lo toma. Si viene de los dos, te pregunta a ti.</text></svg>