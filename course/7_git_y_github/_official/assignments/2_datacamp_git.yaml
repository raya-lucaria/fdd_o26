id: datacamp-git
type: assignment
authority: official
content:
  title: "DataCamp: Introduction to Git y Intermediate Git"
  instructions: >-
    Termina dos cursos de DataCamp y sube la evidencia por el flujo del curso.
    Los dos son de Git y se hacen en ese orden: primero Introduction to Git y
    después Intermediate Git. Los enlaces están abajo, en los recursos. Entras
    con la cuenta del grupo de DataCamp del ITAM, la misma que creaste en la
    primera semana; si perdiste el acceso, dilo pronto y no la noche anterior.
    Se hacen en orden por una razón: el segundo da por sabido lo del primero.
    Y aunque se traslapan con lo que vimos en clase, no es tiempo perdido. Un
    curso interactivo te obliga a teclear los comandos y te corrige al momento,
    que es exactamente lo que no puede hacer una página que lees. Si algo de la
    clase te quedó a medias, ahí se acomoda.
    La evidencia va en una carpeta llamada github, dentro de tu carpeta de
    estudiante. Como todo en este curso, esa carpeta es un espejo de la que
    publiqué en codigo, así que se copia con el comando de siempre y no se crea
    a mano. Dentro deben quedar tres archivos con nombres exactos. El primero
    es certificaciones punto md, que es la plantilla que copiaste, llena con tu
    nombre, tu usuario, las fechas y la reflexión de dos o tres líneas que se
    pide al final. Los otros dos son las capturas, una por curso, llamadas
    introduccion guion a guion git y git guion intermedio. Si tu captura sale
    en formato jpg en vez de png no pasa nada, pero el resto del nombre se
    respeta.
    Sobre las capturas: la que sirve es la de la página del curso ya terminado,
    donde se vea tu nombre y el cien por ciento completado. No sirve una foto
    del certificado suelto sin contexto, ni una donde no se distinga de qué
    curso se trata. Recorta lo que sobre, pero deja visible el nombre del curso.
    La entrega es un pull request, con el mismo ritual de tres bloques de
    siempre. Puedes usar la misma branch y el mismo pull request que la tarea
    de tu carpeta, porque vencen el mismo día, o abrir uno aparte; las dos
    formas están bien mientras el flujo sea correcto. Lo que no está bien es
    escribir fuera de tu carpeta o dejar basura del sistema en el commit, y de
    eso se encarga la revisión automática.
    Sabrás que terminaste cuando el pull request esté abierto y su revisión
    esté en verde, con los tres archivos dentro de la carpeta github. Si sale
    roja, lee el mensaje, corrige y haz push a la misma branch; el pull request
    se actualiza solo y no hay que abrir otro.
    Una nota sobre la honestidad de esta entrega. Los cursos se hacen, no se
    simulan: la captura es evidencia de que los hiciste, no el objetivo. Si no
    alcanzaste a terminar los dos, sube lo que sí completaste y dilo en el
    archivo. Reportar el pendiente cuenta como entrega; presumir un avance que
    no ocurrió, no.
  resources:
