id: github-ssh-setup
type: assignment
authority: official
content:
  title: "Imprescindible: GitHub, tu llave SSH y el repositorio del curso clonado"
  instructions: >-
    Esta es la tarea más importante de lo que va del curso, y es la única que
    bloquea todo lo que sigue. A partir de la semana entrante vamos a entregar
    trabajo dentro del repositorio del curso, así que si esto no queda
    configurado, no vas a poder entregar. No la dejes para la noche anterior:
    lo que se atora aquí casi siempre se atora por algo que toma diez minutos
    resolver, y esos diez minutos existen sólo si empiezas con tiempo.
    Sigue las dos hojas de la unidad Git y GitHub, en orden. Son cuatro cosas.
    Una, crea tu cuenta de GitHub si no la tienes, con un correo personal y no
    con el del ITAM, porque el institucional deja de funcionar cuando te
    gradúas. Dos, genera un par de llaves con ssh-keygen usando ed25519 y
    ponle una passphrase. Tres, deja el agente configurado para que no te la
    vuelva a pedir en cada operación, con las líneas de configuración que la
    hoja 1 da para tu sistema. Cuatro, pega la llave pública en tu cuenta y
    clona el repositorio del curso en la carpeta fdd de tu casa.
    Entrega tres capturas de pantalla y un dato.
    Captura 1: la salida de ssh -T git@github.com, donde se lea Hi seguido de
    tu nombre de usuario. Ese mensaje dice también que GitHub no da acceso a
    una shell; eso es parte de la respuesta correcta, no un error.
    Captura 2: la salida de git remote -v corrida dentro de la carpeta
    clonada, donde se vean las dos líneas que terminan en fdd_o26.git.
    Captura 3: la salida de git log --oneline -5 en esa misma carpeta, con los
    últimos cinco commits del curso.
    El dato: tu nombre de usuario de GitHub, escrito en el cuerpo de la
    entrega. Lo necesito para darte acceso de escritura al repositorio; sin él
    no puedes subir nada después.
    Una advertencia que va en serio. Tu llave privada, el archivo id_ed25519
    sin extensión, no se comparte nunca: ni en estas capturas, ni por correo,
    ni por mensaje. Lo único que se copia a algún lado es el archivo que
    termina en punto pub. Antes de subir una captura, míra la con calma: si
    aparece un bloque largo de texto que empieza con BEGIN OPENSSH PRIVATE
    KEY, bórrala, genera un par nuevo y sube otra. Nadie te va a regañar por
    eso, pero sí es importante que lo notes tú.
    Si algo no sale, no te quedes callado. Escribe qué comando corriste, qué
    esperabas y qué salió, y tráelo a clase o al canal del curso. Un
    Permission denied publickey tiene tres causas probables y las tres están
    en el ejercicio de la hoja 1.
    El enlace de entrega en Canvas está por determinar y se anunciará en clase.
  resources:
    - title: "Unidad — Cuenta y llave"
      url: "https://rayalucaria.org/fdd_o26/git-y-github/cuenta-y-llave/"
      note: "Los cinco pasos, con las variantes de Ubuntu, WSL2 y macOS."
    - title: "Unidad — Clonar y trabajar"
      url: "https://rayalucaria.org/fdd_o26/git-y-github/clonar-y-trabajar/"
      note: "El clonado, tu identidad en git y qué hacer si formateas la máquina."
    - title: "Crear una cuenta de GitHub"
      url: "https://github.com/signup"
      note: "Usa un correo personal y activa la verificación en dos pasos."
    - title: "GitHub — generar una llave SSH nueva"
      url: "https://docs.github.com/es/authentication/connecting-to-github-with-ssh/generating-a-new-ssh-key-and-adding-it-to-the-ssh-agent"
      note: "Documentación oficial, en español, con las tres plataformas."
    - title: "GitHub — agregar la llave a tu cuenta"
      url: "https://docs.github.com/es/authentication/connecting-to-github-with-ssh/adding-a-new-ssh-key-to-your-github-account"
      note: "Dónde se pega: Settings, SSH and GPG keys, New SSH key."
    - title: "GitHub — probar la conexión"
      url: "https://docs.github.com/es/authentication/connecting-to-github-with-ssh/testing-your-ssh-connection"
      note: "Qué respuesta esperar de ssh -T y qué significa cada error."
    - title: "Repositorio del curso"
      url: "https://github.com/raya-lucaria/fdd_o26"
      note: "El que vas a clonar. Es público, así que puedes verlo antes de tener la llave."
  due: "2026-09-03"
