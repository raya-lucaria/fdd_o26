id: github-ssh-setup
type: task
authority: official
content:
  title: "Imprescindible: deja GitHub y tu llave SSH funcionando"
  instructions: >-
    Esto es lo más importante que tienes que hacer esta semana. De aquí en
    adelante vamos a usar git mucho, y si no queda configurado, cada sesión se
    te va a ir peleando con la herramienta. No lo dejes para la noche anterior:
    lo que se atora aquí casi siempre se resuelve en diez minutos, y esos diez
    minutos existen sólo si empiezas con tiempo.
    No hay nada que subir ni que entregar. Es hacerlo y que te quede
    funcionando.
    El objetivo de hoy es modesto y concreto: que puedas clonar el repositorio
    del curso y traer lo nuevo con git pull. Ojo con esto, para que nadie se
    frustre intentando de más: este no es el repositorio sobre el que vas a
    trabajar. No tienes permiso de escritura ahí y no lo necesitas. Cuando
    llegue el momento de entregar, cada quien va a tener su propio fork, una
    copia del repositorio en su cuenta, y desde ahí se proponen los cambios.
    Eso tiene su orden y lo vemos en clase, así que por ahora no hagas nada al
    respecto.
    Sigue las dos hojas de la unidad Git y GitHub, en orden. Son cuatro cosas y
    ni una más. Una, crea tu cuenta de GitHub si no la tienes, con un correo
    personal y no con el del ITAM, porque el institucional deja de funcionar
    cuando te gradúas y se lleva tu historial. Dos, genera un par de llaves con
    ssh-keygen usando ed25519 y ponle una passphrase. Tres, deja el agente
    configurado para que no te la vuelva a pedir en cada operación, con las
    líneas que la hoja 1 da para tu sistema. Cuatro, pega la llave pública en
    tu cuenta, clona el repositorio del curso en la carpeta fdd de tu casa y
    corre git pull ahí dentro.
    Sabrás que terminaste cuando estos tres comandos te respondan bien, y los
    corres tú, para ti. El primero es ssh -T git@github.com, que debe saludarte
    con Hi seguido de tu nombre de usuario; ese mismo mensaje dice que GitHub
    no da acceso a una shell, y eso es parte de la respuesta correcta, no un
    error. El segundo es git remote -v dentro de la carpeta clonada, que debe
    mostrar dos líneas terminadas en fdd_o26 punto git. Y el tercero es git
    pull, que debe responderte que ya estás al día o bajarte lo que falte. Si
    git pull funciona, tu configuración está bien.
    Trae tu nombre de usuario de GitHub a la mano para la clase; lo vamos a
    necesitar cuando montemos los forks.
    Una advertencia que va en serio. Tu llave privada, el archivo id_ed25519
    sin extensión, no se comparte nunca: ni por correo, ni por mensaje, ni en
    una captura de pantalla. Lo único que se copia a algún lado es el archivo
    que termina en punto pub. Si alguna vez la mandas por accidente, se borra
    el par y se genera otro; toma dos minutos y no pasa nada grave, pero
    conviene que lo notes tú.
    Si algo no sale, no te quedes callado. Anota qué comando corriste, qué
    esperabas y qué salió, y tráelo a clase. Un Permission denied publickey
    tiene tres causas probables y las tres están explicadas en el ejercicio de
    la hoja 1.
  resources:
