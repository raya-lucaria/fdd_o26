id: idempotencia-en-pipelines
type: card
authority: official
content:
  front: >-
    La corrida del 4 de agosto sobre `ventas.csv` falla a la mitad. Se
    relanza, y ahora hay seis filas para ese día en vez de tres. ¿Qué le
    faltaba al paso de carga, y qué dos cambios lo arreglan?
  back: >-
    Le faltaba idempotencia: correrlo una o cinco veces debería dejar el
    sistema igual. El paso hacía un `append` ciego, que duplica renglones en
    cada reintento. Se arregla escribiendo con `upsert` por llave —para que la
    segunda escritura actualice en vez de insertar— o particionando por
    período y sobrescribiendo la partición entera del día, en vez de
    añadir sobre lo que ya estaba. Sin idempotencia no hay reintentos seguros
    ni backfills, y el mismo código empieza a dar números distintos según
    cuántas veces se ejecutó.
retrieval:
  kind: recall
