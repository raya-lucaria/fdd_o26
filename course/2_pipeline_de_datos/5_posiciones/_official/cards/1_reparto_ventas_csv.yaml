id: reparto-de-responsabilidades-sobre-ventas-csv
type: card
authority: official
content:
  front: >-
    El equipo que mantiene la API de la que sale `ventas.csv` le cambia un
    campo sin avisar, y las cargas del pipeline empiezan a llegar con horas
    de retraso. Alguien tiene que sentarse a acordar con ese equipo qué campos
    existen, de qué tipo son y con cuánto aviso pueden cambiar. ¿A qué papel
    le toca esa negociación, y a qué otro equipo de los diez de la tabla
    conviene sentar del otro lado de la mesa?
  back: >-
    Le toca al ingeniere de datos: Extract y Load son su tramo, y ese acuerdo
    es lo que en la unidad anterior se llamó contrato de datos. Del otro lado
    conviene sentar a backend, porque construye justo la API que generó el
    campo movido — es la fuente de la que depende esa carga. Antes del
    acuerdo, un cambio de API es indistinguible de una falla; con campos,
    tipos y aviso mínimo pactados y verificados en cada corrida, el mismo
    cambio se anuncia en vez de descubrirse horas tarde en un reporte.
retrieval:
  kind: recall
