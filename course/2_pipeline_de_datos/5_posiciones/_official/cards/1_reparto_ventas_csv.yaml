id: reparto-de-responsabilidades-sobre-ventas-csv
type: card
authority: official
content:
  front: >-
    El pipeline de `ventas.csv` corre bien toda la semana, pero un viernes a
    las tres de la mañana el job de carga falla y nadie se entera hasta el
    lunes: faltan tres días de datos. Aparte, dos analistas descubren que
    tienen definiciones distintas de "sucursal activa" en sus reportes, y en
    la misma junta salen dos cifras para lo mismo. ¿A qué papel le toca cada
    arreglo?
  back: >-
    La llamada de las tres de la mañana se la lleva el ingeniere de datos:
    Extract, Load y orquestación son su tramo, y notar que un job falló sin
    que nadie se entere hasta el lunes es justo el tipo de falla silenciosa
    que su trabajo existe para evitar. Las dos definiciones distintas de
    "sucursal activa" son el problema del analytics engineer: construir esa
    definición una sola vez, como código versionado, probado y documentado
    dentro del warehouse, en vez de dejar que cada analista la reinvente por
    su cuenta. No es jerarquía, es tramo del pipeline: cada pregunta cae del
    lado de quien la puede responder.
retrieval:
  kind: recall
