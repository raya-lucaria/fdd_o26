id: quiz-el-viaje
type: quiz
authority: official
content:
  questions:
    - id: schema-on-read-write
      prompt: >-
        Un equipo guarda archivos crudos tal como llegan de la fuente y decide
        la estructura hasta el momento de consultarlos. ¿Qué está eligiendo, y
        qué cuesta esa elección?
      options:
        - label: >-
            Schema-on-read, propio del datalake: abarata y acelera la ingesta
            porque nada se rechaza al escribir, pero traslada el costo a la
            lectura, donde cada consumidor debe interpretar y validar los datos
            por su cuenta
          correct: true
        - label: >-
            Schema-on-write, propio del data warehouse: garantiza que todo dato
            almacenado ya cumple un contrato, porque el esquema se valida antes
            de escribir y lo que no encaja se rechaza ahí mismo, en vez de
            guardarse para decidir después
          correct: false
        - label: >-
            Una elección sin consecuencias: el esquema es un detalle de
            implementación que un buen equipo puede cambiar más adelante sin
            que le cueste tiempo de ingeniería, dinero de cómputo ni
            confiabilidad en los datos que ya están guardados
          correct: false
        - label: >-
            Schema-on-read, que elimina el problema de la calidad de datos
            porque nunca se rechaza nada en la ingesta, así que cualquier
            análisis posterior parte de datos ya limpios y listos para
            consultarse sin revisión adicional
          correct: false

    - id: preproceso-frontera
      prompt: >-
        Un compañero imputa los valores faltantes de una columna con su media y
        lo llama "pre-procesamiento, nada que reportar". ¿Qué objeción cabe?
      options:
        - label: >-
            Que imputar con la media altera la distribución —reduce la varianza
            y puede sesgar las relaciones entre variables—, así que toca los
            supuestos estadísticos y pertenece al procesamiento: hay que
            justificarlo y documentarlo
          correct: true
        - label: >-
            Ninguna: cualquier operación anterior al modelado es
            pre-procesamiento por definición cronológica, sin importar si
            cambia la forma de la distribución o los supuestos con los que
            trabajará después el algoritmo
          correct: false
        - label: >-
            Que el problema es la herramienta: sería pre-procesamiento
            legítimo si se hiciera en SQL antes de que los datos lleguen a
            Python, en vez de dentro del mismo script de análisis
          correct: false
        - label: >-
            Que imputar faltantes nunca es aceptable y siempre hay que
            descartar los renglones incompletos, aunque eso reduzca el tamaño
            de la muestra y sesgue lo que queda
          correct: false
retrieval:
  kind: concept-check
