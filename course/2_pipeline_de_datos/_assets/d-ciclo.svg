<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Ciclo de vida de un proyecto de datos: un lazo de seis etapas que vuelve a empezar"><title>Ciclo de vida de un proyecto de datos: un lazo de seis etapas que vuelve a empezar</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker></defs><rect x="0" y="0" width="880" height="470" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Ciclo de vida de un proyecto de datos</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">No es una lista de pasos que se terminan: es un lazo que vuelve a la pregunta.</text><path d="M553.0,137.6 Q591.3,119.0 578.1,144.9" fill="none" stroke="#7ef29d" stroke-width="1.8" opacity="0.85" marker-end="url(#f7ef29d)"/><path d="M691.1,211.5 Q725.1,250.0 691.1,288.5" fill="none" stroke="#6fd8e8" stroke-width="1.8" opacity="0.85" marker-end="url(#f6fd8e8)"/><path d="M578.1,355.1 Q591.3,381.0 553.0,362.4" fill="none" stroke="#ffc857" stroke-width="1.8" opacity="0.85" marker-end="url(#fffc857)"/><path d="M327.0,362.4 Q288.7,381.0 301.9,355.1" fill="none" stroke="#c9a7ff" stroke-width="1.8" opacity="0.85" marker-end="url(#fc9a7ff)"/><path d="M188.9,288.5 Q154.9,250.0 188.9,211.5" fill="none" stroke="#5fe0c0" stroke-width="1.8" opacity="0.85" marker-end="url(#f5fe0c0)"/><path d="M301.9,144.9 Q288.7,119.0 327.0,137.6" fill="none" stroke="#ff9f6b" stroke-width="1.8" opacity="0.85" marker-end="url(#fff9f6b)"/><rect x="335.0" y="79.0" width="210.0" height="52.0" rx="12" fill="#1b2730" stroke="#7ef29d" stroke-width="1.5"/><circle cx="361.0" cy="105.0" r="12" fill="#7ef29d" opacity="0.9"/><text x="361.0" y="110.0" fill="#0b0f12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="381.0" y="110.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Pregunta y alcance</text><rect x="586.1" y="151.5" width="210.0" height="52.0" rx="12" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.5"/><circle cx="612.1" cy="177.5" r="12" fill="#6fd8e8" opacity="0.9"/><text x="612.1" y="182.5" fill="#0b0f12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="632.1" y="182.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Adquisición de datos</text><rect x="586.1" y="296.5" width="210.0" height="52.0" rx="12" fill="#1b2730" stroke="#ffc857" stroke-width="1.5"/><circle cx="612.1" cy="322.5" r="12" fill="#ffc857" opacity="0.9"/><text x="612.1" y="327.5" fill="#0b0f12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="632.1" y="327.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Preparación y limpieza</text><rect x="335.0" y="369.0" width="210.0" height="52.0" rx="12" fill="#1b2730" stroke="#c9a7ff" stroke-width="1.5"/><circle cx="361.0" cy="395.0" r="12" fill="#c9a7ff" opacity="0.9"/><text x="361.0" y="400.0" fill="#0b0f12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="381.0" y="400.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Análisis y modelado</text><rect x="83.9" y="296.5" width="210.0" height="52.0" rx="12" fill="#1b2730" stroke="#5fe0c0" stroke-width="1.5"/><circle cx="109.9" cy="322.5" r="12" fill="#5fe0c0" opacity="0.9"/><text x="109.9" y="327.5" fill="#0b0f12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="129.9" y="327.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Despliegue y entrega</text><rect x="83.9" y="151.5" width="210.0" height="52.0" rx="12" fill="#1b2730" stroke="#ff9f6b" stroke-width="1.5"/><circle cx="109.9" cy="177.5" r="12" fill="#ff9f6b" opacity="0.9"/><text x="109.9" y="182.5" fill="#0b0f12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text><text x="129.9" y="182.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Monitoreo y aprendizaje</text><text x="440.0" y="240.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">El ciclo se repite</text><text x="440.0" y="264.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">cada vuelta cambia la pregunta</text><text x="30.0" y="452.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">El monitoreo no cierra el proyecto: es lo que produce la siguiente pregunta.</text></svg>