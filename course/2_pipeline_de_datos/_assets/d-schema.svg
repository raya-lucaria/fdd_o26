rse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8ad4"/></marker><marker id="f7aa7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa7ff"/></marker><marker id="f84eba6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#84eba6"/></marker><marker id="f84c9eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#84c9eb"/></marker><marker id="fa684eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a684eb"/></marker><marker id="feb84c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb84c9"/></marker><marker id="feba684" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eba684"/></marker><marker id="fc9eb84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9eb84"/></marker><marker id="f5b83d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b83d6"/></marker><marker id="f4fd6c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd6c0"/></marker><marker id="fff7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a5c"/></marker><linearGradient id="gRamaAB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6fd8e8"/><stop offset="1" stop-color="#c9a7ff"/></linearGradient></defs><rect x="0" y="0" width="880" height="500" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Dónde vive el esquema</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Antes de escribir, o al leer.</text><rect x="30.0" y="76.0" width="390.0" height="262.0" rx="14" fill="#141b20" stroke="#4a7a63" stroke-width="1.2"/><text x="48.0" y="104.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Schema-on-write</text><text x="48.0" y="124.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Valida antes de guardar.</text><rect x="48.0" y="140.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.4"/><rect x="49.0" y="152.0" width="5.0" height="64.0" rx="2.5" fill="#6fd8e8"/><text x="70.0" y="168.0" fill="#6fd8e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Base de datos relacional</text><text x="70.0" y="190.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Esquema fijo y transacciones.</text><text x="70.0" y="208.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Para la app, no el análisis.</text><rect x="48.0" y="240.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#7ef29d" stroke-width="1.4"/><rect x="49.0" y="252.0" width="5.0" height="64.0" rx="2.5" fill="#7ef29d"/><text x="70.0" y="268.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Data warehouse</text><text x="70.0" y="290.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Esquema modelado para consultar.</text><text x="70.0" y="308.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Entra dato ya limpio y conformado.</text><rect x="460.0" y="76.0" width="390.0" height="262.0" rx="14" fill="#141b20" stroke="#4a7a63" stroke-width="1.2"/><text x="478.0" y="104.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Schema-on-read</text><text x="478.0" y="124.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Valida al leer, no antes.</text><rect x="478.0" y="140.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#ffc857" stroke-width="1.4"/><rect x="479.0" y="152.0" width="5.0" height="64.0" rx="2.5" fill="#ffc857"/><text x="500.0" y="168.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Data lake</text><text x="500.0" y="190.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Archivos crudos, cualquier formato.</text><text x="500.0" y="208.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Barato, flexible, sin promesas.</text><rect x="478.0" y="240.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#ff6b6b" stroke-width="1.4"/><rect x="479.0" y="252.0" width="5.0" height="64.0" rx="2.5" fill="#ff6b6b"/><text x="500.0" y="268.0" fill="#ff6b6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">El costo de no tener contrato</text><text x="500.0" y="290.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Nadie garantiza la forma:</text><text x="500.0" y="308.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Quien lee paga la limpieza.</text><line x1="225.0" y1="338.0" x2="320.0" y2="366.0" stroke="#c9a7ff" stroke-width="1.5" marker-end="url(#fc9a7ff)"/><line x1="655.0" y1="338.0" x2="560.0" y2="366.0" stroke="#c9a7ff" stroke-width="1.5" marker-end="url(#fc9a7ff)"/><rect x="30.0" y="372.0" width="820.0" height="86.0" rx="14" fill="#1b2730" stroke="#c9a7ff" stroke-width="1.5"/><rect x="31.0" y="386.0" width="5.0" height="58.0" rx="2.5" fill="#c9a7ff"/><text x="50.0" y="400.0" fill="#c9a7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Lakehouse</text><text x="50.0" y="422.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start">Lake crudo más tablas con esquema.</text><text x="50.0" y="442.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Ya no es una elección binaria.</text></svg>