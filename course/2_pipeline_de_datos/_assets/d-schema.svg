<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="Schema-on-write frente a schema-on-read: base de datos, data lake, data warehouse y lakehouse"><title>Schema-on-write frente a schema-on-read: base de datos, data lake, data warehouse y lakehouse</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker></defs><rect x="0" y="0" width="880" height="500" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Dónde vive el esquema</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Schema-on-write valida al escribir; schema-on-read acepta todo y valida al leer.</text><rect x="30.0" y="76.0" width="390.0" height="262.0" rx="14" fill="#141b20" stroke="#4a7a63" stroke-width="1.2"/><text x="48.0" y="104.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Schema-on-write</text><text x="48.0" y="124.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">El esquema se declara antes. Lo que no encaja, no entra.</text><rect x="48.0" y="140.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#7ef29d" stroke-width="1.2"/><text x="64.0" y="168.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Base de datos relacional</text><text x="64.0" y="190.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Esquema fijo y transacciones.</text><text x="64.0" y="208.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Sirve a la aplicación, no al análisis.</text><rect x="48.0" y="240.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#7ef29d" stroke-width="1.2"/><text x="64.0" y="268.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Data warehouse</text><text x="64.0" y="290.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Esquema modelado para consultar.</text><text x="64.0" y="308.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Entra dato ya limpio y conformado.</text><rect x="460.0" y="76.0" width="390.0" height="262.0" rx="14" fill="#141b20" stroke="#4a7a63" stroke-width="1.2"/><text x="478.0" y="104.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Schema-on-read</text><text x="478.0" y="124.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">El dato se guarda tal cual llegó. La forma se impone al leerlo.</text><rect x="478.0" y="140.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#ffc857" stroke-width="1.2"/><text x="494.0" y="168.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Data lake</text><text x="494.0" y="190.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Archivos crudos, cualquier formato.</text><text x="494.0" y="208.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Barato, flexible, sin promesas.</text><rect x="478.0" y="240.0" width="354.0" height="88.0" rx="10" fill="#1b2730" stroke="#ffc857" stroke-width="1.2"/><text x="494.0" y="268.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">El costo de no tener contrato</text><text x="494.0" y="290.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Nadie garantiza la forma:</text><text x="494.0" y="308.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">quien lee paga la limpieza, cada vez.</text><line x1="225.0" y1="338.0" x2="320.0" y2="366.0" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><line x1="655.0" y1="338.0" x2="560.0" y2="366.0" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="30.0" y="372.0" width="820.0" height="86.0" rx="14" fill="#1b2730" stroke="#c9a7ff" stroke-width="1.5"/><text x="50.0" y="400.0" fill="#c9a7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Lakehouse</text><text x="50.0" y="422.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start">Los archivos crudos del lake, más una capa de tablas con esquema, transacciones y versiones.</text><text x="50.0" y="442.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">La frontera entre lake y warehouse dejó de ser una elección binaria.</text><text x="30.0" y="482.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">La pregunta útil no es qué producto usar, sino en qué momento alguien se compromete con la forma del dato.</text></svg>