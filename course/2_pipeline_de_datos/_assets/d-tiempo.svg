<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" role="img" aria-label="Batch, micro-batch, streaming y CDC sobre una línea de tiempo, con la latencia de cada uno"><title>Batch, micro-batch, streaming y CDC sobre una línea de tiempo, con la latencia de cada uno</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker></defs><rect x="0" y="0" width="880" height="436" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Cuando un dato se vuelve verdad</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Los cuatro modos mueven los mismos datos; los separa cuánto tardan en estar disponibles.</text><text x="24.0" y="114.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Batch</text><text x="24.0" y="132.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">latencia ~24 h</text><text x="24.0" y="150.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="0.85">Una corrida al día sobre todo el período.</text><rect x="230.0" y="103.0" width="600.0" height="34.0" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1"/><rect x="250.0" y="109.0" width="60.0" height="22.0" rx="3" fill="#7ef29d" opacity="0.9"/><rect x="560.0" y="109.0" width="60.0" height="22.0" rx="3" fill="#7ef29d" opacity="0.9"/><text x="24.0" y="188.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Micro-batch</text><text x="24.0" y="206.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">latencia ~5 min</text><text x="24.0" y="224.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="0.85">Lotes pequeños y frecuentes; misma lógica que batch.</text><rect x="230.0" y="177.0" width="600.0" height="34.0" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1"/><rect x="248.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="320.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="392.0" y="183.0" width="18.0" height="22.0" rx="3" 