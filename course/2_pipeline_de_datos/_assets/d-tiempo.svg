path d="M0,0 L10,5 L0,10 z" fill="#ff8ad4"/></marker><marker id="f7aa7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa7ff"/></marker><marker id="f84eba6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#84eba6"/></marker><marker id="f84c9eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#84c9eb"/></marker><marker id="fa684eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a684eb"/></marker><marker id="feb84c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb84c9"/></marker><marker id="feba684" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eba684"/></marker><marker id="fc9eb84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9eb84"/></marker><marker id="f5b83d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b83d6"/></marker><marker id="f4fd6c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd6c0"/></marker><marker id="fff7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a5c"/></marker><linearGradient id="gRamaAB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6fd8e8"/><stop offset="1" stop-color="#c9a7ff"/></linearGradient></defs><rect x="0" y="0" width="880" height="470" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Cuando un dato se vuelve verdad</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Los cuatro modos mueven los mismos datos; los separa cuánto tardan en estar disponibles.</text><text x="24.0" y="114.0" fill="#5b83d6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Batch</text><text x="24.0" y="132.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">latencia ~24 h</text><text x="24.0" y="150.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="0.85">Una corrida al día sobre todo el período.</text><rect x="230.0" y="103.0" width="600.0" height="34.0" rx="8" fill="#141b20" stroke="#5b83d6" stroke-width="1" opacity="0.95"/><rect x="250.0" y="109.0" width="60.0" height="22.0" rx="3" fill="#5b83d6" opacity="0.9"/><rect x="560.0" y="109.0" width="60.0" height="22.0" rx="3" fill="#5b83d6" opacity="0.9"/><text x="24.0" y="188.0" fill="#4fd6c0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Micro-batch</text><text x="24.0" y="206.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">latencia ~5 min</text><text x="24.0" y="224.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="0.85">Lotes pequeños y frecuentes; misma lógica que batch.</text><rect x="230.0" y="177.0" width="600.0" height="34.0" rx="8" fill="#141b20" stroke="#4fd6c0" stroke-width="1" opacity="0.95"/><rect x="248.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="320.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="392.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="464.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="536.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="608.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="680.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><rect x="752.0" y="183.0" width="18.0" height="22.0" rx="3" fill="#4fd6c0" opacity="0.9"/><text x="24.0" y="262.0" fill="#ff7a5c" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Streaming</text><text x="24.0" y="280.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">latencia &lt; 1 s</text><text x="24.0" y="298.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="0.85">Cada evento se procesa al llegar.</text><rect x="230.0" y="251.0" width="600.0" height="34.0" rx="8" fill="#141b20" stroke="#ff7a5c" stroke-width="1" opacity="0.95"/><rect x="240.0" y="257.0" width="4.0" height="22.0" rx="3" fill="#ff7a5c" opacity="0.9"/><rect x="264.0" y="257.0" width="4.0" height="22.0" rx="3" fill="#ff7a5c" opacity="0.9"/><rect x="288.0" y="257.0" width="4.0" height="22.0" rx="3" fill="#ff7a5c" opacity="0.9"/><rect x="312.0" y="257.0" width="4.0" height="22.0" rx="3" fill="#ff7a5c" opacity="0.9"/><rect x="336.0" y="257.0" width="4.0" height="22.0" rx="3" fill="#ff7a5c" opacity="0.9"/><rect x="360.0" y="257.0" width="4.0" height="22.0" rx="3" fill="#ff7a5c" opacity="0.9"/><rect x="384.0" y="257.0" width