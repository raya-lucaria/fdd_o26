</text><text x="24.0" y="372.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="0.85">Solo viaja lo que cambió en la fuente.</text><rect x="230.0" y="325.0" width="600.0" height="34.0" rx="8" fill="#141b20" stroke="#ffc857" stroke-width="1" opacity="0.95"/><rect x="252.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="300.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="388.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="402.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="470.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="560.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="604.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="690.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><rect x="770.0" y="331.0" width="10.0" height="22.0" rx="3" fill="#ffc857" opacity="0.9"/><line x1="230.0" y1="384.0" x2="830.0" y2="384.0" stroke="#a7b8ad" stroke-width="1.2" marker-end="url(#fa7b8ad)"/><text x="230.0" y="404.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">tiempo</text><text x="24.0" y="434.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">de más lento a más fresco:</text><rect x="196.0" y="422.0" width="13" height="13" rx="4" fill="#5b83d6"/><text x="215.0" y="433.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">batch</text><rect x="265.5" y="422.0" width="13" height="13" rx="4" fill="#4fd6c0"/><text x="284.5" y="433.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">micro-batch</text><rect x="371.5" y="422.0" width="13" height="13" rx="4" fill="#ffc857"/><text x="390.5" y="433.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">CDC</text><rect x="428.8" y="422.0" width="13" height="13" rx="4" fill="#ff7a5c"/><text x="447.8" y="433.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">streaming</text><text x="30.0" y="452.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Elegir el modo es elegir cuánta frescura se paga: más frescura, más maquinaria que sostener.</text></svg>