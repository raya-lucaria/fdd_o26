<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="Las seis dimensiones de la calidad de los datos: exactitud, completitud, formato, consistencia, duplicación e integridad"><title>Las seis dimensiones de la calidad de los datos: exactitud, completitud, formato, consistencia, duplicación e integridad</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker></defs><rect x="0" y="0" width="880" height="380" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Seis dimensiones de la calidad de los datos</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Cada dimensión se revisa con una pregunta distinta; ninguna cubre a las otras.</text><rect x="20.0" y="92.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#7ef29d" stroke-width="1.3"/><circle cx="44" cy="120" r="6" fill="#7ef29d"/><text x="60.0" y="125.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Exactitud</text><text x="40.0" y="156.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿El valor corresponde a la realidad?</text><text x="40.0" y="178.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: un precio negativo.</text><rect x="305.0" y="92.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#ffc857" stroke-width="1.3"/><circle cx="329" cy="120" r="6" fill="#ffc857"/><text x="345.0" y="125.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Completitud</text><text x="325.0" y="156.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Faltan valores, o faltan filas enteras?</text><text x="325.0" y="178.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: 30% de la columna vacía.</text><rect x="590.0" y="92.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#6fd8e8" stroke-width="1.3"/><circle cx="614" cy="120" r="6" fill="#6fd8e8"/><text x="630.0" y="125.0" fill="#6fd8e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Formato</text><text x="610.0" y="156.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿La forma es la esperada?</text><text x="610.0" y="178.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: fechas en dos formatos.</text><rect x="20.0" y="214.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#c9a7ff" stroke-width="1.3"/><circle cx="44" cy="242" r="6" fill="#c9a7ff"/><text x="60.0" y="247.0" fill="#c9a7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Consistencia</text><text x="40.0" y="278.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Las fuentes dicen lo mismo?</text><text x="40.0" y="300.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: el CRM y el ERP no cuadran.</text><rect x="305.0" y="214.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#ff9f6b" stroke-width="1.3"/><circle cx="329" cy="242" r="6" fill="#ff9f6b"/><text x="345.0" y="247.0" fill="#ff9f6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Duplicación</text><text x="325.0" y="278.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿La misma entidad aparece dos veces?</text><text x="325.0" y="300.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: dos IDs para un cliente.</text><rect x="590.0" y="214.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#5fe0c0" stroke-width="1.3"/><circle cx="614" cy="242" r="6" fill="#5fe0c0"/><text x="630.0" y="247.0" fill="#5fe0c0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Integridad</text><text x="610.0" y="278.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Las relaciones entre tablas se sostienen?</text><text x="610.0" y="300.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: una venta sin cliente.</text><text x="30.0" y="362.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Un dato puede estar completo y bien formado y aún así ser falso: las dimensiones no se sustituyen entre sí.</text></svg>