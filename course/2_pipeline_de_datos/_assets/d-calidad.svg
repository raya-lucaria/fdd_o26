system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Cada una se revisa por separado.</text><rect x="20.0" y="92.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#ffc857" stroke-width="1.3"/><rect x="32.0" y="98.0" width="246.0" height="4.0" rx="2" fill="#ffc857"/><circle cx="44" cy="124" r="6" fill="#ffc857"/><text x="60.0" y="129.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Completitud</text><text x="40.0" y="158.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Faltan valores, o faltan filas enteras?</text><text x="40.0" y="180.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: columna casi vacía.</text><rect x="305.0" y="92.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#ff8ad4" stroke-width="1.3"/><rect x="317.0" y="98.0" width="246.0" height="4.0" rx="2" fill="#ff8ad4"/><circle cx="329" cy="124" r="6" fill="#ff8ad4"/><text x="345.0" y="129.0" fill="#ff8ad4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Unicidad</text><text x="325.0" y="158.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿La misma entidad aparece dos veces?</text><text x="325.0" y="180.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: dos IDs, un cliente.</text><rect x="590.0" y="92.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#6fd8e8" stroke-width="1.3"/><rect x="602.0" y="98.0" width="246.0" height="4.0" rx="2" fill="#6fd8e8"/><circle cx="614" cy="124" r="6" fill="#6fd8e8"/><text x="630.0" y="129.0" fill="#6fd8e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Validez</text><text x="610.0" y="158.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Respeta las reglas de su dominio?</text><text x="610.0" y="180.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: edad de 200 años.</text><rect x="20.0" y="214.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#c9a7ff" stroke-width="1.3"/><rect x="32.0" y="220.0" width="246.0" height="4.0" rx="2" fill="#c9a7ff"/><circle cx="44" cy="246" r="6" fill="#c9a7ff"/><text x="60.0" y="251.0" fill="#c9a7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Consistencia</text><text x="40.0" y="280.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Las fuentes dicen lo mismo?</text><text x="40.0" y="302.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: CRM y ERP distintos.</text><rect x="305.0" y="214.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#7ef29d" stroke-width="1.3"/><rect x="317.0" y="220.0" width="246.0" height="4.0" rx="2" fill="#7ef29d"/><circle cx="329" cy="246" r="6" fill="#7ef29d"/><text x="345.0" y="251.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Exactitud</text><text x="325.0" y="280.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿El valor corresponde a la realidad?</text><text x="325.0" y="302.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: un precio negativo.</text><rect x="590.0" y="214.0" width="270.0" height="110.0" rx="12" fill="#141b20" stroke="#ff9f6b" stroke-width="1.3"/><rect x="602.0" y="220.0" width="246.0" height="4.0" rx="2" fill="#ff9f6b"/><circle cx="614" cy="246" r="6" fill="#ff9f6b"/><text x="630.0" y="251.0" fill="#ff9f6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Oportunidad</text><text x="610.0" y="280.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">¿Está disponible cuando se necesita?</text><text x="610.0" y="302.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start">Falla típica: un tablero con retraso.</text></svg>