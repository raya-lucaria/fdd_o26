<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-label="Idempotencia: correr dos veces el mismo paso deja el mismo resultado, o duplica las filas"><title>Idempotencia: correr dos veces el mismo paso deja el mismo resultado, o duplica las filas</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker></defs><rect x="0" y="0" width="880" height="450" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">La misma corrida, dos veces</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Un paso idempotente se puede reintentar. Uno que no lo es, castiga cada reintento.</text><rect x="30.0" y="80.0" width="390.0" height="320.0" rx="14" fill="#141b20" stroke="#7ef29d" stroke-width="1.3"/><text x="50.0" y="108.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">Idempotente</text><text x="50.0" y="130.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Escribe reemplazando la partición del día.</text><text x="65.0" y="154.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Corrida 1</text><text x="245.0" y="154.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Corrida 2</text><rect x="65.0" y="164.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#7ef29d" stroke-width="1.2"/><rect x="65.0" y="190.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#7ef29d" stroke-width="1.2"/><rect x="65.0" y="216.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#7ef29d" stroke-width="1.2"/><rect x="245.0" y="164.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#7ef29d" stroke-width="1.2"/><rect x="245.0" y="190.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#7ef29d" stroke-width="1.2"/><rect x="245.0" y="216.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#7ef29d" stroke-width="1.2"/><text x="135.0" y="344.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">3 filas</text><text x="315.0" y="344.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">3 filas</text><text x="225.0" y="378.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="middle">El resultado no cambia: se puede reintentar sin miedo.</text><rect x="460.0" y="80.0" width="390.0" height="320.0" rx="14" fill="#141b20" stroke="#ff9f6b" stroke-width="1.3"/><text x="480.0" y="108.0" fill="#ff9f6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="start">No idempotente</text><text x="480.0" y="130.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Inserta filas sin llave ni borrado previo.</text><text x="495.0" y="154.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Corrida 1</text><text x="675.0" y="154.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Corrida 2</text><rect x="495.0" y="164.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#ff9f6b" stroke-width="1.2"/><rect x="495.0" y="190.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#ff9f6b" stroke-width="1.2"/><rect x="495.0" y="216.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#ff9f6b" stroke-width="1.2"/><rect x="675.0" y="164.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#ff9f6b" stroke-width="1.2"/><rect x="675.0" y="190.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#ff9f6b" stroke-width="1.2"/><rect x="675.0" y="216.0" width="140.0" height="22.0" rx="5" fill="#16302a" stroke="#ff9f6b" stroke-width="1.2"/><rect x="675.0" y="242.0" width="140.0" height="22.0" rx="5" fill="#3a231c" stroke="#ff9f6b" stroke-width="1.2"/><rect x="675.0" y="268.0" width="140.0" height="22.0" rx="5" fill="#3a231c" stroke="#ff9f6b" stroke-width="1.2"/><rect x="675.0" y="294.0" width="140.0" height="22.0" rx="5" fill="#3a231c" stroke="#ff9f6b" stroke-width="1.2"/><text x="565.0" y="344.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">3 filas</text><text x="745.0" y="344.0" fill="#ff9f6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">6 filas (3 duplicadas)</text><text x="655.0" y="378.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Cada reintento inventa datos que nadie produjo.</text><text x="225.0" y="208.0" fill="#7ef29d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="middle">=</text><text x="655.0" y="250.0" fill="#ff9f6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="middle">≠</text><text x="30.0" y="432.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">El reintento no es un caso raro: es la operación normal de cualquier orquestador.</text></svg>