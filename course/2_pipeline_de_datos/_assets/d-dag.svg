ize="11.5" font-weight="400" text-anchor="middle">Transformación</text><text x="612.0" y="368.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">Modelo</text><text x="784.0" y="368.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">Consumo</text><text x="30.0" y="392.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Si una rama falla, solo se vuelve a correr esa rama: no hace falta rehacer el pipeline entero.</text></svg>