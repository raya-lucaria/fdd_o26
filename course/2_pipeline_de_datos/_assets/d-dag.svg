<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-label="Un pipeline de datos es un grafo dirigido acíclico: las etapas se bifurcan y vuelven a converger"><title>Un pipeline de datos es un grafo dirigido acíclico: las etapas se bifurcan y vuelven a converger</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker></defs><rect x="0" y="0" width="880" height="410" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">Un pipeline es un DAG, no una flecha</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">El orden no lo pone el autor: lo imponen las dependencias.</text><path d="M170.0,134.0 C194.0,134.0 170.0,159.0 194.0,159.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M170.0,224.0 C194.0,224.0 170.0,159.0 194.0,159.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M170.0,314.0 C194.0,314.0 170.0,289.0 194.0,289.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M342.0,159.0 C366.0,159.0 342.0,104.0 366.0,104.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M342.0,159.0 C366.0,159.0 342.0,214.0 366.0,214.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M342.0,289.0 C366.0,289.0 342.0,324.0 366.0,324.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M514.0,104.0 C538.0,104.0 514.0,214.0 538.0,214.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M514.0,214.0 C538.0,214.0 514.0,214.0 538.0,214.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M514.0,324.0 C538.0,324.0 514.0,214.0 538.0,214.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M686.0,214.0 C710.0,214.0 686.0,154.0 710.0,154.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><path d="M686.0,214.0 C710.0,214.0 686.0,274.0 710.0,274.0" fill="none" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="22.0" y="110.0" width="148.0" height="48.0" rx="10" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.5"/><text x="96.0" y="129.4" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Ventas</text><text x="96.0" y="146.9" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">(API)</text><rect x="22.0" y="200.0" width="148.0" height="48.0" rx="10" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.5"/><text x="96.0" y="219.4" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Catálogo</text><text x="96.0" y="236.9" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">(CSV)</text><rect x="22.0" y="290.0" width="148.0" height="48.0" rx="10" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.5"/><text x="96.0" y="309.4" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Clics</text><text x="96.0" y="326.9" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">(stream)</text><rect x="194.0" y="135.0" width="148.0" height="48.0" rx="10" fill="#1b2730" stroke="#7ef29d" stroke-width="1.5"/><text x="268.0" y="163.2" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Ingesta batch</text><rect x="194.0" y="265.0" width="148.0" height="48.0" rx="10" fill="#1b2730" stroke="#7ef29d" stroke-width="1.5"/><text x="268.0" y="293.2" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Ingesta continua</text><rect x="366.0" y="80.0" width="148.0" height="48.0" rx="10" fill="#1b2730" stroke="#ffc857" stroke-width="1.5"/><text x="440.0" y="108.2" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Limpieza</text><rect x="366.0" y="190.0" width="148.0" height="48.0" rx="10" fi