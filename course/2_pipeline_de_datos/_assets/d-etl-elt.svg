<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="ETL frente a ELT, y la caída del costo del almacenamiento que invirtió el orden"><title>ETL frente a ELT, y la caída del costo del almacenamiento que invirtió el orden</title><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a7ff"/></marker><marker id="fff9f6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f6b"/></marker><marker id="f5fe0c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fe0c0"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b8ad"/></marker><marker id="fff6b6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker><marker id="fff8ad4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8ad4"/></marker><marker id="f7aa7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa7ff"/></marker><marker id="f84eba6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#84eba6"/></marker><marker id="f84c9eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#84c9eb"/></marker><marker id="fa684eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a684eb"/></marker><marker id="feb84c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb84c9"/></marker><marker id="feba684" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eba684"/></marker><marker id="fc9eb84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9eb84"/></marker><marker id="f5b83d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b83d6"/></marker><marker id="f4fd6c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd6c0"/></marker><marker id="fff7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a5c"/></marker><linearGradient id="gRamaAB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6fd8e8"/><stop offset="1" stop-color="#c9a7ff"/></linearGradient></defs><rect x="0" y="0" width="880" height="500" rx="16" fill="#0b0f12"/><text x="30.0" y="32.0" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="start">ETL y ELT: el mismo trabajo, otro orden</text><text x="30.0" y="54.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Extract, Transform y Load no cambiaron. Cambió cuando conviene transformar.</text><text x="40.0" y="116.0" fill="#6fd8e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start">ETL</text><rect x="150.0" y="84.0" width="150.0" height="52.0" rx="10" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.5"/><text x="225.0" y="114.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Extract</text><line x1="300.0" y1="110.0" x2="334.0" y2="110.0" stroke="#6fd8e8" stroke-width="1.5" marker-end="url(#f6fd8e8)"/><rect x="340.0" y="84.0" width="150.0" height="52.0" rx="10" fill="#16302a" stroke="#ffc857" stroke-width="1.5"/><text x="415.0" y="114.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Transform</text><line x1="490.0" y1="110.0" x2="524.0" y2="110.0" stroke="#6fd8e8" stroke-width="1.5" marker-end="url(#f6fd8e8)"/><rect x="530.0" y="84.0" width="150.0" height="52.0" rx="10" fill="#1b2730" stroke="#6fd8e8" stroke-width="1.5"/><text x="605.0" y="114.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Load</text><text x="40.0" y="174.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Transformar antes de cargar: el almacenamiento era caro, así que solo entraba lo ya modelado.</text><text x="40.0" y="226.0" fill="#ff9f6b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start">ELT</text><rect x="150.0" y="194.0" width="150.0" height="52.0" rx="10" fill="#1b2730" stroke="#ff9f6b" stroke-width="1.5"/><text x="225.0" y="224.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Extract</text><line x1="300.0" y1="220.0" x2="334.0" y2="220.0" stroke="#ff9f6b" stroke-width="1.5" marker-end="url(#fff9f6b)"/><rect x="340.0" y="194.0" width="150.0" height="52.0" rx="10" fill="#1b2730" stroke="#ff9f6b" stroke-width="1.5"/><text x="415.0" y="224.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Load</text><line x1="490.0" y1="220.0" x2="524.0" y2="220.0" stroke="#ff9f6b" stroke-width="1.5" marker-end="url(#fff9f6b)"/><rect x="530.0" y="194.0" width="150.0" height="52.0" rx="10" fill="#16302a" stroke="#ffc857" stroke-width="1.5"/><text x="605.0" y="224.5" fill="#e8f0e8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Transform</text><text x="40.0" y="284.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Cargar crudo y transformar dentro del warehouse: el cómputo es elástico y guardar ya casi no cuesta.</text><text x="850.0" y="116.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="end">Transform es el paso</text><text x="850.0" y="133.0" fill="#ffc857" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="end">que cambia de lugar</text><line x1="760.0" y1="142.0" x2="690.0" y2="210.0" stroke="#ffc857" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fffc857)"/><line x1="30.0" y1="292.0" x2="850.0" y2="292.0" stroke="#4a7a63" stroke-width="1" stroke-dasharray="5 4"/><text x="40.0" y="320.0" fill="#c9a7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="start">Costo del almacenamiento por GB</text><line x1="120.0" y1="344.0" x2="120.0" y2="440.0" stroke="#a7b8ad" stroke-width="1"/><line x1="120.0" y1="440.0" x2="830.0" y2="440.0" stroke="#a7b8ad" stroke-width="1"/><path d="M120.0,352.0 L236.7,403.0 L353.3,423.3 L470.0,432.1 L586.7,436.0 L703.3,438.1 L820.0,438.9" fill="none" stroke="#c9a7ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120.0" cy="352.0" r="3.5" fill="#c9a7ff"/><circle cx="236.7" cy="403.0" r="3.5" fill="#c9a7ff"/><circle cx="353.3" cy="423.3" r="3.5" fill="#c9a7ff"/><circle cx="470.0" cy="432.1" r="3.5" fill="#c9a7ff"/><circle cx="586.7" cy="436.0" r="3.5" fill="#c9a7ff"/><circle cx="703.3" cy="438.1" r="3.5" fill="#c9a7ff"/><circle cx="820.0" cy="438.9" r="3.5" fill="#c9a7ff"/><text x="120.0" y="458.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="middle">1990</text><text x="353.0" y="458.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="middle">2005</text><text x="587.0" y="458.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="middle">2020</text><text x="820.0" y="458.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="middle">hoy</text><text x="450.0" y="378.0" fill="#c9a7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">Esta caída es la causa del cambio de orden</text><line x1="448.0" y1="384.0" x2="406.0" y2="420.0" stroke="#c9a7ff" stroke-width="1.2" marker-end="url(#fc9a7ff)"/><text x="30.0" y="482.0" fill="#a7b8ad" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Guardar dejó de ser lo caro; lo caro pasó a ser el cómputo y el tiempo de quien modela.</text></svg>