id: llave-identifica-sin-ambiguedad
type: card
authority: official
content:
  front: >-
    En `ventas.csv`, el valor `2026-08-04` aparece en dos filas distintas de
    `fecha`, y `CDMX` aparece en dos filas distintas de `sucursal` —no las
    mismas dos filas—. ¿Podría `fecha` o `sucursal` ser la llave de esa tabla?
    ¿Cuál columna sí lo es, y por qué?
  back: >-
    Ni `fecha` ni `sucursal` sirven solas: cada una repite su valor en más de
    una fila, así que ninguna identifica sin ambigüedad a una fila por sí
    sola. `pedido` sí es la llave, porque cada pedido es único: dos filas con
    el mismo `pedido` serían la misma venta registrada dos veces, no dos
    ventas distintas. Sin una llave de verdad única no se puede saber si dos
    filas son la misma cosa repetida o dos cosas distintas.
retrieval:
  kind: recall
