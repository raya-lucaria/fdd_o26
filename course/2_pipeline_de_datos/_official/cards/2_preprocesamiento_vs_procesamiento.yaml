id: preprocesamiento-vs-procesamiento
type: card
authority: official
content:
  front: >-
    ¿Dónde está la frontera entre pre-procesamiento y procesamiento de datos?
  back: >-
    La frontera no es cronológica ni de herramienta: es si la operación toca
    los supuestos estadísticos del análisis. Cambiar codificación, normalizar
    nombres de columna o parsear fechas deja intacta la distribución de los
    datos: eso es pre-procesamiento. Imputar faltantes, quitar atípicos,
    escalar variables o balancear clases altera la distribución y, con ella,
    las conclusiones: eso ya es procesamiento y hay que justificarlo y
    documentarlo como parte del análisis.
retrieval:
  kind: recall
