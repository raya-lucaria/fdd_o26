<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="dm-title dm-desc">
  <title id="dm-title">Modelo denso frente a mezcla de expertos</title>
  <desc id="dm-desc">En un modelo denso cada token atraviesa todos los bloques. En un modelo MoE un router selecciona dos de ocho expertos; todos los pesos deben almacenarse, pero sólo una fracción se activa por token.</desc>
  <defs><linearGradient id="bg-dm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#064e3b"/></linearGradient><marker id="arr-dm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#67e8f9"/></marker></defs>
  <style>.h{font:800 36px system-ui,sans-serif;fill:#fff;text-anchor:middle}.t{font:750 24px system-ui,sans-serif;fill:#fff;text-anchor:middle}.s{font:600 20px system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.b{stroke-width:3}.a{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#arr-dm)}</style>
  <rect width="960" height="650" rx="32" fill="url(#bg-dm)"/><text x="480" y="48" class="h">Guardar todos no significa activar todos</text>
  <text x="240" y="100" class="h" style="font-size:29px">Denso</text><text x="720" y="100" class="h" style="font-size:29px">MoE</text>
  <circle cx="80" cy="200" r="30" fill="#164e63" stroke="#67e8f9" class="b"/><text x="80" y="208" class="t">T</text>
  <path d="M110 200H155" class="a"/><rect x="155" y="160" width="170" height="80" rx="18" fill="#6d28d9" stroke="#ddd6fe" class="b"/><text x="240" y="208" class="t">Todo el bloque</text><path d="M325 200H370" class="a"/><circle cx="400" cy="200" r="30" fill="#047857" stroke="#6ee7b7" class="b"/><text x="400" y="208" class="t">S</text>
  <circle cx="535" cy="200" r="30" fill="#164e63" stroke="#67e8f9" class="b"/><text x="535" y="208" class="t">T</text><path d="M565 200H600" class="a"/><rect x="600" y="160" width="130" height="80" rx="18" fill="#9a3412" stroke="#fed7aa" class="b"/><text x="665" y="208" class="t">Router</text>
  <g><rect x="510" y="310" width="90" height="55" rx="12" fill="#4338ca" stroke="#c7d2fe" class="b"/><rect x="615" y="310" width="90" height="55" rx="12" fill="#1f2937" stroke="#64748b" class="b"/><rect x="720" y="310" width="90" height="55" rx="12" fill="#4338ca" stroke="#c7d2fe" class="b"/><rect x="825" y="310" width="90" height="55" rx="12" fill="#1f2937" stroke="#64748b" class="b"/><text x="555" y="345" class="t">E1</text><text x="660" y="345" class="t">E2</text><text x="765" y="345" class="t">E3</text><text x="870" y="345" class="t">E4</text>
  <rect x="510" y="385" width="90" height="55" rx="12" fill="#1f2937" stroke="#64748b" class="b"/><rect x="615" y="385" width="90" height="55" rx="12" fill="#1f2937" stroke="#64748b" class="b"/><rect x="720" y="385" width="90" height="55" rx="12" fill="#1f2937" stroke="#64748b" class="b"/><rect x="825" y="385" width="90" height="55" rx="12" fill="#1f2937" stroke="#64748b" class="b"/><text x="555" y="420" class="t">E5</text><text x="660" y="420" class="t">E6</text><text x="765" y="420" class="t">E7</text><text x="870" y="420" class="t">E8</text></g>
  <path d="M665 240L555 305M665 240L765 305" class="a"/>
  <text x="240" y="505" class="t">10B totales = 10B activos</text><text x="720" y="505" class="t">80B totales ≠ 20B activos</text>
  <text x="480" y="570" class="s">MoE reduce cómputo por token; no elimina memoria, routing ni comunicación.</text>
</svg>
