<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Aceleradores concurrentes de entrenamiento</title>
  <desc id="desc">Escala logarítmica de aceleradores concurrentes: BLOOM 176B, 384 aceleradores [FACT]; PaLM 540B, 6,144 aceleradores [FACT]; Llama 3.1 405B, 16,384 aceleradores [FACT]; DeepSeek-V3, 2,048 aceleradores [FACT].</desc>
