<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Potencia: parte y todo no se suman</title>
  <desc id="desc">Potencia nominal de aceleradores, separada de servidor e IT: BLOOM 176B, 153.6 kW [DERIVED]; PaLM 540B, 1.18 MW [DERIVED]; Llama 3.1 405B, 11.47 MW [DERIVED]; DeepSeek-V3, sin valor identificable [ESTIMATION_NOT_IDENTIFIABLE]. El ledger no aporta potencia de servidor o IT y no se suma parte más todo.</desc>
