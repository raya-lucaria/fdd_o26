<svg width="960" height="660" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="pd-title pd-desc">
  <title id="pd-title">Prefill procesa el prompt y decode genera token por token</title>
  <desc id="pd-desc">Prefill lee cuatro tokens juntos, calcula en paralelo y crea caché KV. Decode genera una palabra a la vez y consulta una caché KV que crece. Prefill suele exigir cómputo; decode suele depender de memoria y latencia.</desc>
  <defs><linearGradient id="bg-pd" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="arr-pd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#67e8f9"/></marker></defs>
  <style>.h{font:800 36px system-ui,sans-serif;fill:#fff;text-anchor:middle}.t{font:750 24px system-ui,sans-serif;fill:#fff;text-anchor:middle}.s{font:600 20px system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.b{stroke-width:3}.a{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#arr-pd)}</style>
  <rect width="960" height="660" rx="32" fill="url(#bg-pd)"/><text x="480" y="48" class="h">Una solicitud tiene dos ritmos</text>
  <text x="240" y="104" class="h" style="font-size:29px">1 · PREFILL</text><text x="720" y="104" class="h" style="font-size:29px">2 · DECODE</text>
  <g fill="#164e63" stroke="#67e8f9" class="b"><rect x="55" y="150" width="90" height="58" rx="12"/><rect x="155" y="150" width="90" height="58" rx="12"/><rect x="255" y="150" width="90" height="58" rx="12"/><rect x="355" y="150" width="90" height="58" rx="12"/></g><text x="100" y="187" class="t">El</text><text x="200" y="187" class="t">gato</text><text x="300" y="187" class="t">duerme</text><text x="400" y="187" class="t">en</text>
  <path d="M250 215V265" class="a"/><rect x="90" y="265" width="320" height="80" rx="18" fill="#6d28d9" stroke="#ddd6fe" class="b"/><text x="250" y="314" class="t">Procesa el bloque</text>
  <path d="M250 345V395" class="a"/><rect x="110" y="395" width="280" height="70" rx="18" fill="#0e7490" stroke="#a5f3fc" class="b"/><text x="250" y="438" class="t">Crea caché KV</text><text x="250" y="500" class="s">Mucho trabajo paralelo</text>
  <rect x="555" y="150" width="330" height="70" rx="18" fill="#0e7490" stroke="#a5f3fc" class="b"/><text x="720" y="193" class="t">Lee caché KV</text><path d="M720 220V270" class="a"/><rect x="615" y="270" width="210" height="70" rx="18" fill="#4338ca" stroke="#c7d2fe" class="b"/><text x="720" y="313" class="t">Genera “la”</text><path d="M720 340V390" class="a"/><rect x="575" y="390" width="290" height="75" rx="18" fill="#1d4ed8" stroke="#bfdbfe" class="b"/><text x="720" y="422" class="t">KV crece</text><text x="720" y="451" class="s">repite para cada token</text><text x="720" y="500" class="s">Secuencial y sensible a memoria</text>
  <rect x="100" y="550" width="760" height="72" rx="20" fill="#78350f" stroke="#fbbf24" class="b"/><text x="480" y="580" class="t">Contexto largo = caché mayor</text><text x="480" y="608" class="s">Batch comparte ejecución, pero suma memoria y espera.</text>
</svg>
