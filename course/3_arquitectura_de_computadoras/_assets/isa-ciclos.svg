<svg width="960" height="620" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="isa-title isa-desc" preserveAspectRatio="xMidYMid meet">
  <title id="isa-title">La ISA conecta programas con la CPU</title>
  <desc id="isa-desc">Los programas llegan a las instrucciones de una ISA mediante un compilador o runtime. La CPU implementa esa ISA. Buscar, decodificar y ejecutar son etapas simplificadas, no ciclos fijos.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker></defs>
  <style>.head{font:700 46px system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.label{font:700 40px system-ui,sans-serif;fill:#fff;text-anchor:middle}.box{stroke-width:4}.arrow{fill:none;stroke:#67e8f9;stroke-width:7;marker-end:url(#a)}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="62" class="head">La ISA es el contrato</text>
  <rect x="44" y="108" width="220" height="68" rx="20" fill="#164e63" stroke="#67e8f9" class="box"/><text x="154" y="153" class="label">C / Rust</text>
  <path d="M264 142H330" class="arrow"/><rect x="330" y="108" width="286" height="68" rx="20" fill="#6d28d9" stroke="#d8b4fe" class="box"/><text x="473" y="153" class="label">compilador</text>
  <rect x="44" y="200" width="220" height="68" rx="20" fill="#164e63" stroke="#67e8f9" class="box"/><text x="154" y="245" class="label">Python</text>
  <path d="M264 234H330" class="arrow"/><rect x="330" y="200" width="286" height="68" rx="20" fill="#6d28d9" stroke="#d8b4fe" class="box"/><text x="473" y="245" class="label">runtime</text>
  <path d="M616 142L680 178M616 234L680 198" class="arrow"/><rect x="680" y="142" width="236" height="92" rx="24" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="798" y="198" class="label">ISA → CPU</text>
  <text x="480" y="332" class="head">Etapas: modelo simplificado</text>
  <rect x="60" y="384" width="240" height="100" rx="26" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="180" y="447" class="label">Buscar</text>
  <path d="M300 434H342" class="arrow"/><rect x="342" y="384" width="276" height="100" rx="26" fill="#4338ca" stroke="#c7d2fe" class="box"/><text x="480" y="447" class="label">Decodificar</text>
  <path d="M618 434H660" class="arrow"/><rect x="660" y="384" width="240" height="100" rx="26" fill="#7e22ce" stroke="#e9d5ff" class="box"/><text x="780" y="447" class="label">Ejecutar</text>
  <text x="480" y="560" class="head">No son ciclos fijos</text>
</svg>
