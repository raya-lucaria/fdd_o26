<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 320 360" role="img" aria-labelledby="roof-title roof-desc">
  <title id="roof-title">Roofline para 100 GB/s y 2 TFLOPS FP32, equivalentes a 2,000 GFLOPS: una suma de 0.083 FLOP/byte queda limitada por memoria a 8.3 GFLOPS; quiebre en 20 FLOP/byte</title>
  <desc id="roof-desc">Resumen de hardware hipotético con 100 GB/s y 2 TFLOPS FP32, equivalentes a 2,000 GFLOPS. La línea de memoria alcanza 8.3 GFLOPS para la suma de 0.083 FLOP/byte, muy por debajo del techo de cómputo; ambos se igualan en 20 FLOP/byte.</desc>
  <defs>
    <pattern id="memory-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#172554"/><rect width="3" height="8" fill="#1e3a8a"/></pattern>
  </defs>
  <style>
    .h{font-family:Arial,sans-serif;font-size:17px;font-weight:800;fill:#fff}.k{font-family:Arial,sans-serif;font-size:13px;font-weight:800;fill:#fff}.t{font-family:Arial,sans-serif;font-size:11px;font-weight:700;fill:#e2e8f0}.s{font-family:Arial,sans-serif;font-size:10px;font-weight:700;fill:#bfdbfe}.axis{stroke:#cbd5e1;stroke-width:1.5}.roof{fill:none;stroke:#fbbf24;stroke-width:4;stroke-linejoin:round}.guide{stroke:#93c5fd;stroke-width:1;stroke-dasharray:4 4}.point{fill:#fbbf24;stroke:#fff;stroke-width:2}.panel{fill:url(#memory-pattern);stroke:#93c5fd;stroke-width:1.5}
  </style>
  <rect width="320" height="360" rx="20" fill="#0f172a"/>
  <text x="16" y="28" class="h">Roofline: limita el menor</text>
  <rect x="16" y="43" width="288" height="32" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="30" y="64" class="k">suma · 0.083 FLOP/byte</text>

  <text x="20" y="98" class="s">rendimiento (GFLOPS)</text>
  <line x1="44" y1="256" x2="296" y2="256" class="axis"/>
  <line x1="44" y1="256" x2="44" y2="112" class="axis"/>
  <path d="M44 242 L238 126 L296 126" class="roof"/>
  <text x="166" y="119" class="s">techo del chip · 2,000</text>

  <line x1="74" y1="224" x2="74" y2="256" class="guide"/>
  <line x1="44" y1="224" x2="74" y2="224" class="guide"/>
  <circle cx="74" cy="224" r="6" class="point"/>
  <text x="84" y="216" class="k">suma</text>
  <text x="84" y="234" class="t">memoria · 8.3 GFLOPS</text>
  <text x="52" y="276" class="s">0.083</text>
  <text x="224" y="276" class="s">20 FLOP/byte</text>
  <text x="44" y="294" class="s">intensidad (FLOP/byte)</text>
  <text x="198" y="294" class="t">Quiebre: 20 FLOP/byte</text>

  <rect x="16" y="308" width="288" height="38" rx="10" class="panel"/>
  <text x="30" y="332" class="k">8.3 &lt; 2,000 GFLOPS → limita memoria</text>
</svg>
