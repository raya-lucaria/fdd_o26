<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="mem-title mem-desc">
  <title id="mem-title">Jerarquía de memoria en escala aproximada de latencia</title>
  <desc id="mem-desc">Una escalera logarítmica compara registros, cachés L1, L2 y L3, RAM, SSD NVMe y red. Sus latencias típicas crecen desde menos de un nanosegundo hasta milisegundos. Si un nanosegundo fuera un segundo, RAM tardaría minutos, SSD más de un día y una red lejana semanas.</desc>
  <defs><linearGradient id="bg-mem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#064e3b"/></linearGradient></defs>
  <style>.h{font:800 36px system-ui,sans-serif;fill:#fff;text-anchor:middle}.t{font:750 23px system-ui,sans-serif;fill:#fff}.s{font:600 19px system-ui,sans-serif;fill:#cbd5e1}.num{font:800 22px ui-monospace,monospace;fill:#fde68a;text-anchor:end}.b{stroke-width:3}</style>
  <rect width="960" height="760" rx="32" fill="url(#bg-mem)"/><text x="480" y="46" class="h">Cada escalón puede costar órdenes de magnitud</text>
  <text x="55" y="92" class="s">más cerca · menor capacidad</text><text x="905" y="92" class="s" text-anchor="end">latencia típica orientativa</text>
  <g><rect x="70" y="115" width="390" height="62" rx="15" fill="#6d28d9" stroke="#ddd6fe" class="b"/><text x="92" y="153" class="t">Registros · bytes–KiB</text><text x="890" y="153" class="num">&lt;1 ns</text>
  <rect x="95" y="190" width="420" height="62" rx="15" fill="#4338ca" stroke="#c7d2fe" class="b"/><text x="117" y="228" class="t">L1 · decenas de KiB/core</text><text x="890" y="228" class="num">~1 ns</text>
  <rect x="120" y="265" width="450" height="62" rx="15" fill="#1d4ed8" stroke="#bfdbfe" class="b"/><text x="142" y="303" class="t">L2 · cientos de KiB–MiB</text><text x="890" y="303" class="num">~3–5 ns</text>
  <rect x="145" y="340" width="480" height="62" rx="15" fill="#0e7490" stroke="#a5f3fc" class="b"/><text x="167" y="378" class="t">L3 · varios MiB compartidos</text><text x="890" y="378" class="num">~10–30 ns</text>
  <rect x="170" y="415" width="510" height="62" rx="15" fill="#0369a1" stroke="#bae6fd" class="b"/><text x="192" y="453" class="t">RAM · GiB</text><text x="890" y="453" class="num">~60–150 ns</text>
  <rect x="195" y="490" width="540" height="62" rx="15" fill="#9a3412" stroke="#fed7aa" class="b"/><text x="217" y="528" class="t">SSD NVMe · TB</text><text x="890" y="528" class="num">~50–300 μs</text>
  <rect x="220" y="565" width="570" height="62" rx="15" fill="#7f1d1d" stroke="#fecaca" class="b"/><text x="242" y="603" class="t">Red/servicio remoto · escala</text><text x="890" y="603" class="num">~0.5–100 ms</text></g>
  <rect x="70" y="660" width="820" height="65" rx="18" fill="#172554" stroke="#67e8f9" class="b"/><text x="480" y="687" class="t" text-anchor="middle">Si 1 ns = 1 s: RAM ≈ 1–2 min · SSD ≈ 14 h–3.5 días</text><text x="480" y="714" class="s" text-anchor="middle">Red de 1 ms ≈ 11.6 días. ESTIMATE: hardware y patrón cambian el rango.</text>
</svg>
