<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="mem-title mem-desc" preserveAspectRatio="xMidYMid meet">
  <title id="mem-title">Jerarquía de memoria y camino de los datos</title>
  <desc id="mem-desc">Jerarquía vertical con registros arriba y almacenamiento o red abajo. Flechas verdes llevan datos y operandos hacia arriba, cerca del cómputo; flechas ámbar llevan resultados y datos desalojados hacia abajo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#064e3b"/></linearGradient>
    <marker id="up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34d399"/></marker>
    <marker id="down" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fbbf24"/></marker>
  </defs>
  <style>.head{font:700 44px system-ui,sans-serif;fill:#fff;text-anchor:middle}.direction{font:700 38px system-ui,sans-serif;text-anchor:middle}.label{font:700 40px system-ui,sans-serif;fill:#fff;text-anchor:middle}.box{stroke-width:4}.up{fill:none;stroke:#34d399;stroke-width:7;marker-end:url(#up)}.down{fill:none;stroke:#fbbf24;stroke-width:7;marker-end:url(#down)}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="54" class="head">Dos flujos, una jerarquía</text>
  <text x="240" y="94" class="direction" fill="#6ee7b7">DATOS</text>
  <text x="240" y="132" class="direction" fill="#6ee7b7">OPERANDOS ↑</text>
  <text x="720" y="94" class="direction" fill="#fde68a">RESULTADOS</text>
  <text x="720" y="132" class="direction" fill="#fde68a">DESALOJOS ↓</text>
  <rect x="350" y="150" width="260" height="76" rx="22" fill="#7c3aed" stroke="#ddd6fe" class="box"/><text x="480" y="201" class="label">Registros</text>
  <path d="M450 262V232" class="up"/><path d="M510 232V262" class="down"/>
  <rect x="290" y="262" width="380" height="78" rx="24" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="480" y="314" class="label">Caché</text>
  <path d="M450 378V346" class="up"/><path d="M510 346V378" class="down"/>
  <rect x="206" y="378" width="548" height="80" rx="24" fill="#0369a1" stroke="#bae6fd" class="box"/><text x="480" y="431" class="label">RAM / VRAM</text>
  <path d="M450 496V464" class="up"/><path d="M510 464V496" class="down"/>
  <rect x="104" y="496" width="752" height="82" rx="24" fill="#9a3412" stroke="#fed7aa" class="box"/><text x="480" y="550" class="label">SSD / red</text>
</svg>
