  <text x="18" y="31" fill="#f3f7f3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="750" text-anchor="start">Piso y capacidad</text>
  <text x="18" y="57" fill="#b7c5bb" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="start">1 réplica · 1 shard · sin SLA</text>
