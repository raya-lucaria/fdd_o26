<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Valor de reemplazo — dashboard de modelos de IA</title>
  <desc id="desc">No existe una serie cuantitativa comparable por Año de publicación. Las ausencias no se convierten en cero ni reciben una posición inventada.</desc>
  <rect width="600" height="300" rx="24" fill="#111827" />
  <text x="24" y="38" font-size="31" font-family="system-ui, -apple-system, sans-serif" fill="#f8fafc" text-anchor="start" font-weight="700">Valor de reemplazo</text>
  <text x="24" y="72" font-size="29" font-family="system-ui, -apple-system, sans-serif" fill="#cbd5e1" text-anchor="start" font-weight="400">0 modelos · 0 observaciones</text>
  <text x="300.0" y="175" font-size="30" font-family="system-ui, -apple-system, sans-serif" fill="#f8fafc" text-anchor="middle" font-weight="700">No hay una serie comparable</text>
  <text x="300.0" y="215" font-size="29" font-family="system-ui, -apple-system, sans-serif" fill="#cbd5e1" text-anchor="middle" font-weight="400">La ausencia no equivale a cero</text>
</svg>
