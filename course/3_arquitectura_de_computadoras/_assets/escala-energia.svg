<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="energia-title energia-desc">
  <title id="energia-title">Escala logarítmica de potencia desde un foco hasta un rack de IA</title>
  <desc id="energia-desc">Barras comparan un foco LED de diez watts, una laptop de decenas de watts, un refrigerador de cientos, una GPU RTX 5090 de 575 watts, un microondas de alrededor de 1.5 kilowatts, un aire acondicionado de varios kilowatts y un rack GB300 de hasta 142 kilowatts.</desc>
  <defs><linearGradient id="bg-en" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs>
  <style>.h{font:800 36px system-ui,sans-serif;fill:#fff;text-anchor:middle}.t{font:750 22px system-ui,sans-serif;fill:#fff}.s{font:600 19px system-ui,sans-serif;fill:#cbd5e1}.n{font:800 21px ui-monospace,monospace;fill:#fde68a;text-anchor:end}.axis{stroke:#cbd5e1;stroke-width:4}.grid{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7}.bar{stroke-width:3}</style>
  <rect width="960" height="720" rx="32" fill="url(#bg-en)"/><text x="480" y="46" class="h">Potencia: una tasa, no una factura</text>
  <path d="M250 590H890M250 100V590" class="axis"/><path d="M390 100V590M540 100V590M690 100V590M840 100V590" class="grid"/>
  <text x="250" y="625" class="s" text-anchor="middle">1 W</text><text x="390" y="625" class="s" text-anchor="middle">10 W</text><text x="540" y="625" class="s" text-anchor="middle">100 W</text><text x="690" y="625" class="s" text-anchor="middle">1 kW</text><text x="840" y="625" class="s" text-anchor="middle">100 kW</text>
  <text x="30" y="137" class="t">Foco LED</text><rect x="250" y="112" width="140" height="32" rx="9" fill="#047857" stroke="#6ee7b7" class="bar"/><text x="885" y="137" class="n">~10 W</text>
  <text x="30" y="207" class="t">Laptop</text><rect x="250" y="182" width="230" height="32" rx="9" fill="#0e7490" stroke="#a5f3fc" class="bar"/><text x="885" y="207" class="n">~30–100 W</text>
  <text x="30" y="277" class="t">Refrigerador</text><rect x="250" y="252" width="300" height="32" rx="9" fill="#0369a1" stroke="#bae6fd" class="bar"/><text x="885" y="277" class="n">~100–300 W</text>
  <text x="30" y="347" class="t">RTX 5090</text><rect x="250" y="322" width="390" height="32" rx="9" fill="#6d28d9" stroke="#ddd6fe" class="bar"/><text x="885" y="347" class="n">575 W TGP</text>
  <text x="30" y="417" class="t">Microondas</text><rect x="250" y="392" width="455" height="32" rx="9" fill="#9a3412" stroke="#fed7aa" class="bar"/><text x="885" y="417" class="n">~1–1.8 kW</text>
  <text x="30" y="487" class="t">Aire acond.</text><rect x="250" y="462" width="515" height="32" rx="9" fill="#b45309" stroke="#fde68a" class="bar"/><text x="885" y="487" class="n">~1–5 kW</text>
  <text x="30" y="557" class="t">Rack GB300</text><rect x="250" y="532" width="610" height="32" rx="9" fill="#7f1d1d" stroke="#fecaca" class="bar"/><text x="885" y="557" class="n">hasta 142 kW</text>
  <text x="480" y="676" class="h" style="font-size:28px">energía = potencia × tiempo · 575 W × 1 h = 0.575 kWh</text>
</svg>
