<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="energia-title energia-desc" preserveAspectRatio="xMidYMid meet">
  <title id="energia-title">Potencia por tiempo produce energía</title>
  <desc id="energia-desc">La potencia en watts es una tasa instantánea. Sostenida durante un tiempo acumula energía en watt-hora; la potencia aumenta desde un chip hacia un centro de datos.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs>
  <style>.head{font:700 46px system-ui,sans-serif;fill:#fff;text-anchor:middle}.big{font:800 58px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 40px system-ui,sans-serif;fill:#e2e8f0;text-anchor:middle}.box{stroke-width:4}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="62" class="head">Potencia × tiempo = energía</text>
  <rect x="72" y="132" width="240" height="164" rx="28" fill="#1e3a8a" stroke="#93c5fd" class="box"/><text x="192" y="205" class="big">W</text><text x="192" y="258" class="label">potencia</text>
  <text x="372" y="224" class="big">×</text>
  <rect x="438" y="132" width="160" height="164" rx="28" fill="#4338ca" stroke="#c7d2fe" class="box"/><text x="518" y="205" class="big">h</text><text x="518" y="258" class="label">tiempo</text>
  <text x="662" y="224" class="big">=</text>
  <rect x="728" y="132" width="160" height="164" rx="28" fill="#9a3412" stroke="#fed7aa" class="box"/><text x="808" y="205" class="big">Wh</text><text x="808" y="258" class="label">energía</text>
  <rect x="72" y="350" width="240" height="142" rx="24" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="192" y="405" class="label">Chip</text><text x="192" y="459" class="label">W</text>
  <rect x="360" y="350" width="240" height="142" rx="24" fill="#7e22ce" stroke="#e9d5ff" class="box"/><text x="480" y="405" class="label">Rack</text><text x="480" y="459" class="label">kW</text>
  <rect x="648" y="350" width="240" height="142" rx="24" fill="#b45309" stroke="#fde68a" class="box"/><text x="768" y="405" class="label">Centro</text><text x="768" y="459" class="label">MW</text>
  <text x="480" y="558" class="head">El tiempo conecta ambas</text>
</svg>
