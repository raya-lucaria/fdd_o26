<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="scale-title scale-desc" preserveAspectRatio="xMidYMid meet">
  <title id="scale-title">Escalar hardware empieza por identificar el cuello de botella</title>
  <desc id="scale-desc">Antes de pasar de un equipo a un servidor o cluster se mide si falta memoria, cómputo o comunicación. Cada salto agrega capacidad y complejidad.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#164e63"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker></defs>
  <style>.head{font:700 46px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 40px system-ui,sans-serif;fill:#fff;text-anchor:middle}.box{stroke-width:4}.arrow{fill:none;stroke:#67e8f9;stroke-width:8;marker-end:url(#a)}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="62" class="head">Mide el cuello de botella primero</text>
  <rect x="70" y="122" width="250" height="106" rx="24" fill="#4338ca" stroke="#c7d2fe" class="box"/><text x="195" y="188" class="label">Memoria</text>
  <rect x="355" y="122" width="250" height="106" rx="24" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="480" y="188" class="label">Cómputo</text>
  <rect x="640" y="122" width="250" height="106" rx="24" fill="#9a3412" stroke="#fed7aa" class="box"/><text x="765" y="188" class="label">Red</text>
  <text x="480" y="304" class="head">Sólo entonces añade recursos</text>
  <rect x="70" y="358" width="220" height="112" rx="26" fill="#1e3a8a" stroke="#93c5fd" class="box"/><text x="180" y="427" class="label">Equipo</text>
  <path d="M290 414H370" class="arrow"/><rect x="370" y="358" width="220" height="112" rx="26" fill="#5b21b6" stroke="#d8b4fe" class="box"/><text x="480" y="427" class="label">Servidor</text>
  <path d="M590 414H670" class="arrow"/><rect x="670" y="358" width="220" height="112" rx="26" fill="#9a3412" stroke="#fed7aa" class="box"/><text x="780" y="427" class="label">Cluster</text>
  <text x="480" y="558" class="head">Escalar agrega coordinación</text>
</svg>
