<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 360 300" role="img" aria-labelledby="lt-title lt-desc">
  <title id="lt-title">Latencia de cuatro segundos y throughput de uno o dos workers</title>
  <desc id="lt-desc">Una tarea siempre tarda cuatro segundos. En doce segundos, un worker termina tres tareas, 0.25 tareas por segundo; dos workers terminan seis, 0.5 tareas por segundo.</desc>
  <style>
    .title{font:800 15px system-ui,sans-serif;fill:#f8fafc}.head{font:800 12px system-ui,sans-serif;fill:#f8fafc}.text{font:700 10px system-ui,sans-serif;fill:#dbeafe}.small{font:700 9px system-ui,sans-serif;fill:#bfdbfe}.axis{stroke:#94a3b8;stroke-width:1.5}.tick{stroke:#64748b;stroke-width:1}.task{fill:#164e63;stroke:#67e8f9;stroke-width:1.5}.task2{fill:#4c1d95;stroke:#c4b5fd;stroke-width:1.5}.result{fill:#064e3b;stroke:#34d399;stroke-width:1.5}
  </style>
  <rect width="360" height="300" rx="16" fill="#0f172a"/>
  <text x="18" y="27" class="title">Misma latencia, distinto throughput</text>

  <text x="18" y="53" class="head">Latencia</text>
  <text x="91" y="53" class="text">seguir una tarea: 4 s por tarea</text>
  <rect x="91" y="62" width="80" height="24" rx="6" class="task"/>
  <text x="131" y="78" text-anchor="middle" class="text">tarea 1 · 4 s</text>

  <line x1="91" y1="105" x2="331" y2="105" class="axis"/>
  <path d="M91 100v10M171 100v10M251 100v10M331 100v10" class="tick"/>
  <text x="91" y="120" text-anchor="middle" class="small">0 s</text>
  <text x="171" y="120" text-anchor="middle" class="small">4 s</text>
  <text x="251" y="120" text-anchor="middle" class="small">8 s</text>
  <text x="331" y="120" text-anchor="middle" class="small">12 s</text>

  <text x="18" y="149" class="head">1 worker</text>
  <rect x="91" y="132" width="80" height="22" rx="5" class="task"/>
  <rect x="171" y="132" width="80" height="22" rx="5" class="task"/>
  <rect x="251" y="132" width="80" height="22" rx="5" class="task"/>
  <text x="211" y="170" text-anchor="middle" class="text">3 tareas / 12 s = 0.25 tareas/s</text>

  <text x="18" y="204" class="head">2 workers</text>
  <rect x="91" y="186" width="80" height="18" rx="5" class="task2"/>
  <rect x="171" y="186" width="80" height="18" rx="5" class="task2"/>
  <rect x="251" y="186" width="80" height="18" rx="5" class="task2"/>
  <rect x="91" y="208" width="80" height="18" rx="5" class="task2"/>
  <rect x="171" y="208" width="80" height="18" rx="5" class="task2"/>
  <rect x="251" y="208" width="80" height="18" rx="5" class="task2"/>
  <text x="211" y="244" text-anchor="middle" class="text">6 tareas / 12 s = 0.5 tareas/s</text>

  <rect x="18" y="263" width="324" height="24" rx="7" class="result"/>
  <text x="180" y="279" text-anchor="middle" class="text">Latencia: 4 s en ambos · throughput: se duplica</text>
</svg>
