<svg width="960" height="620" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="cvg-title cvg-desc" preserveAspectRatio="xMidYMid meet">
  <title id="cvg-title">CPU versus GPU</title>
  <desc id="cvg-desc">Una CPU concentra pocas rutas flexibles para decisiones y baja latencia. Una GPU reúne muchas unidades paralelas para aplicar trabajo parecido a muchos datos.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
  <style>.head{font:700 46px system-ui,sans-serif;fill:#fff;text-anchor:middle}.title{font:800 48px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 40px system-ui,sans-serif;fill:#e2e8f0;text-anchor:middle}.core{stroke-width:5}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="62" class="head">CPU y GPU sirven patrones distintos</text>
  <rect x="58" y="116" width="396" height="388" rx="30" fill="#082f49" stroke="#67e8f9" class="core"/><text x="256" y="180" class="title">CPU</text>
  <rect x="128" y="220" width="92" height="92" rx="16" fill="#0e7490"/><rect x="292" y="220" width="92" height="92" rx="16" fill="#0e7490"/><path d="M220 266H292" stroke="#67e8f9" stroke-width="8"/>
  <text x="256" y="382" class="label">Pocas rutas</text><text x="256" y="430" class="label">flexibles</text>
  <rect x="506" y="116" width="396" height="388" rx="30" fill="#3b0764" stroke="#d8b4fe" class="core"/><text x="704" y="180" class="title">GPU</text>
  <g fill="#a855f7"><rect x="560" y="218" width="56" height="56" rx="10"/><rect x="638" y="218" width="56" height="56" rx="10"/><rect x="716" y="218" width="56" height="56" rx="10"/><rect x="794" y="218" width="56" height="56" rx="10"/><rect x="560" y="294" width="56" height="56" rx="10"/><rect x="638" y="294" width="56" height="56" rx="10"/><rect x="716" y="294" width="56" height="56" rx="10"/><rect x="794" y="294" width="56" height="56" rx="10"/></g>
  <text x="704" y="406" class="label">Muchas rutas</text><text x="704" y="454" class="label">paralelas</text>
  <text x="480" y="570" class="head">El problema elige el procesador</text>
</svg>
