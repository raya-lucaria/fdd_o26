<svg width="960" height="700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="rcg-title rcg-desc">
  <title id="rcg-title">Dos caminos de datos hacia CPU y GPU</title>
  <desc id="rcg-desc">La ruta CPU pasa de SSD o red a RAM, cachés, registros y operación. Una GPU dedicada añade interconexión, VRAM, cachés GPU y registros GPU. Cada flecha es movimiento que cuesta tiempo y energía.</desc>
  <defs><linearGradient id="bg-rcg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="arr-rcg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#67e8f9"/></marker></defs>
  <style>.h{font:800 38px system-ui,sans-serif;fill:#fff;text-anchor:middle}.lane{font:800 30px system-ui,sans-serif;fill:#fff}.t{font:700 23px system-ui,sans-serif;fill:#fff;text-anchor:middle}.s{font:600 20px system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.b{stroke-width:3}.a{fill:none;stroke:#67e8f9;stroke-width:5;marker-end:url(#arr-rcg)}</style>
  <rect width="960" height="700" rx="32" fill="url(#bg-rcg)"/><text x="480" y="48" class="h">Mover también es trabajar</text>
  <text x="55" y="112" class="lane">CPU</text><text x="55" y="388" class="lane">GPU dedicada</text>
  <g><rect x="70" y="145" width="135" height="75" rx="16" fill="#9a3412" stroke="#fed7aa" class="b"/><text x="138" y="190" class="t">SSD/red</text><path d="M205 183H245" class="a"/><rect x="245" y="145" width="130" height="75" rx="16" fill="#0369a1" stroke="#bae6fd" class="b"/><text x="310" y="190" class="t">RAM</text><path d="M375 183H415" class="a"/><rect x="415" y="145" width="150" height="75" rx="16" fill="#0e7490" stroke="#a5f3fc" class="b"/><text x="490" y="190" class="t">Cachés</text><path d="M565 183H605" class="a"/><rect x="605" y="145" width="145" height="75" rx="16" fill="#6d28d9" stroke="#ddd6fe" class="b"/><text x="678" y="190" class="t">Registros</text><path d="M750 183H790" class="a"/><rect x="790" y="145" width="115" height="75" rx="16" fill="#047857" stroke="#6ee7b7" class="b"/><text x="848" y="190" class="t">Op.</text></g>
  <text x="480" y="265" class="s">El hardware trae líneas completas; el dato pedido puede ser sólo una parte.</text>
  <g><rect x="35" y="420" width="110" height="72" rx="15" fill="#9a3412" stroke="#fed7aa" class="b"/><text x="90" y="464" class="t">SSD</text><path d="M145 456H175" class="a"/><rect x="175" y="420" width="100" height="72" rx="15" fill="#0369a1" stroke="#bae6fd" class="b"/><text x="225" y="464" class="t">RAM</text><path d="M275 456H305" class="a"/><rect x="305" y="420" width="130" height="72" rx="15" fill="#78350f" stroke="#fbbf24" class="b"/><text x="370" y="450" class="t">PCIe/</text><text x="370" y="477" class="s">NVLink</text><path d="M435 456H465" class="a"/><rect x="465" y="420" width="110" height="72" rx="15" fill="#1d4ed8" stroke="#bfdbfe" class="b"/><text x="520" y="464" class="t">VRAM</text><path d="M575 456H605" class="a"/><rect x="605" y="420" width="110" height="72" rx="15" fill="#0e7490" stroke="#a5f3fc" class="b"/><text x="660" y="464" class="t">Caché</text><path d="M715 456H745" class="a"/><rect x="745" y="420" width="110" height="72" rx="15" fill="#6d28d9" stroke="#ddd6fe" class="b"/><text x="800" y="464" class="t">Regs.</text><path d="M855 456H880" class="a"/><circle cx="910" cy="456" r="28" fill="#047857" stroke="#6ee7b7" class="b"/><text x="910" y="464" class="t">Op.</text></g>
  <rect x="85" y="550" width="790" height="105" rx="20" fill="#164e63" stroke="#67e8f9" class="b"/><text x="480" y="586" class="t">DMA mueve bloques; CPU y driver coordinan</text><text x="480" y="620" class="s">Memoria unificada evita algunas copias, no elimina cachés ni sincronización.</text>
</svg>
