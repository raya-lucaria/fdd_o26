<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="anatomia-title anatomia-desc" preserveAspectRatio="xMidYMid meet">
  <title id="anatomia-title">Anatomía funcional de una computadora</title>
  <desc id="anatomia-desc">Una CPU se conecta mediante una interconexión con RAM, almacenamiento, acelerador, red y entrada y salida. Las piezas especializadas intercambian datos.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient></defs>
  <style>.head{font:700 46px system-ui,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 40px system-ui,sans-serif;fill:#fff;text-anchor:middle}.box{stroke-width:4}.link{fill:none;stroke:#67e8f9;stroke-width:7}</style>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
  <text x="480" y="62" class="head">Piezas especializadas mueven datos</text>
  <rect x="350" y="224" width="260" height="126" rx="28" fill="#6d28d9" stroke="#ddd6fe" class="box"/><text x="480" y="300" class="label">CPU</text>
  <path d="M350 268H226" class="link"/><path d="M610 268H734" class="link"/><path d="M405 350V440H225" class="link"/><path d="M555 350V440H735" class="link"/><path d="M480 350V488" class="link"/>
  <rect x="54" y="190" width="172" height="110" rx="22" fill="#0e7490" stroke="#a5f3fc" class="box"/><text x="140" y="257" class="label">RAM</text>
  <rect x="734" y="190" width="172" height="110" rx="22" fill="#9a3412" stroke="#fed7aa" class="box"/><text x="820" y="257" class="label">Disco</text>
  <rect x="40" y="440" width="250" height="112" rx="22" fill="#065f46" stroke="#a7f3d0" class="box"/><text x="165" y="490" class="label">Entrada</text><text x="165" y="535" class="label">/ salida</text>
  <rect x="684" y="440" width="222" height="112" rx="22" fill="#7e22ce" stroke="#e9d5ff" class="box"/><text x="795" y="507" class="label">Red</text>
  <rect x="350" y="488" width="260" height="88" rx="22" fill="#92400e" stroke="#fde68a" class="box"/><text x="480" y="544" class="label">Acelerador</text>
  <text x="480" y="404" class="label">interconexión</text>
</svg>
