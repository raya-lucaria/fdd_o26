<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Diagrama de tiempo de un evento que ocurre a los 10 s y tres formas de enterarse. Polling con consulta cada 3 s: consultas en 3, 6, 9 y 12 s; las tres primeras vuelven sin novedades y la cuarta trae el resultado, con 2 s de demora. Long polling: una consulta pendiente que el servidor retiene y responde en el evento. SSE: una respuesta abierta por la que el servidor escribe el evento en cuanto ocurre. Ámbar marca el evento."><rect x="0" y="0" width="1080" height="640" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El polling se entera con demora; long polling y SSE, al ocurrir el evento</text><text x="540.0" y="66" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un evento a los 10 s; el polling consulta cada 3 s</text><rect x="41.0" y="83.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="96" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">petición o respuesta</text><rect x="249.0" y="83.0" width="30.0" height="16" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="288.0" y="96" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">conexión abierta, esperando</text><line x1="190.0" y1="124.0" x2="190.0" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="255.4" y1="124.0" x2="255.4" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="320.8" y1="124.0" x2="320.8" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="386.2" y1="124.0" x2="386.2" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="451.5" y1="124.0" x2="451.5" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="516.9" y1="124.0" x2="516.9" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="582.3" y1="124.0" x2="582.3" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="647.7" y1="124.0" x2="647.7" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="713.1" y1="124.0" x2="713.1" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="778.5" y1="124.0" x2="778.5" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="843.8" y1="124.0" x2="843.8" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="909.2" y1="124.0" x2="909.2" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="974.6" y1="124.0" x2="974.6" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="124.0" x2="1040.0" y2="450.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="843.8" y1="124.0" x2="843.8" y2="450.0" stroke="#ffc857" stroke-width="2.4" stroke-dasharray="6 4"/><text x="843.8461538461538" y="118" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">evento: 10 s</text><text x="174" y="172" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">polling</text><text x="174" y="192" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">consulta cada 3 s</text><line x1="190.0" y1="176.0" x2="1040.0" y2="176.0" stroke="#a7b8ad" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="379.2" y="162.0" width="14.0" height="28" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="386.1538461538462" y="212" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">consulta 1</text><text x="386.1538461538462" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sin novedades</text><rect x="575.3" y="162.0" width="14.0" height="28" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="582.3076923076924" y="212" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">consulta 2</text><text x="582.3076923076924" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sin novedades</text><rect x="771.5" y="162.0" width="14.0" height="28" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="778.4615384615385" y="212" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">consulta 3</text><text x="778.4615384615385" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sin novedades</text><rect x="967.6" y="162.0" width="14.0" height="28" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="974.6153846153846" y="212" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">consulta 4</text><text x="974.6153846153846" y="232" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">trae el resultado</text><line x1="843.8" y1="256.0" x2="974.6" y2="256.0" stroke="#ffc857" stroke-width="2"/><text x="909.2307692307693" y="276" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">demora de 2 s</text><text x="288.0769230769231" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">entre consultas no hay petición pendiente (con keep-alive el socket puede seguir abierto)</text><text x="174" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">long polling</text><text x="174" y="340" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">una consulta pendiente</text><rect x="191.0" y="306.0" width="651.8" height="34" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="516.9230769230769" y="328.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">consulta pendiente: el servidor no responde hasta que haya resultado</text><rect x="836.8" y="306.0" width="14.0" height="34" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="835.8461538461538" y="360" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">responde en 10 s</text><rect x="868.8" y="306.0" width="170.2" height="34" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="953.9230769230769" y="328.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">nueva consulta</text><text x="174" y="396" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">SSE</text><text x="174" y="416" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">una respuesta abierta</text><rect x="191.0" y="382.0" width="848.0" height="34" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="615.0" y="404.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">respuesta abierta: el servidor escribe cuando ocurre algo</text><rect x="836.8" y="382.0" width="14.0" height="34" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="857.8461538461538" y="436" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">el evento llega en 10 s</text><line x1="190.0" y1="450.0" x2="1040.0" y2="450.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="450.0" x2="190.0" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="255.4" y1="450.0" x2="255.4" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="255.3846153846154" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1</text><line x1="320.8" y1="450.0" x2="320.8" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="320.7692307692308" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2</text><line x1="386.2" y1="450.0" x2="386.2" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="386.1538461538462" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3</text><line x1="451.5" y1="450.0" x2="451.5" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="451.53846153846155" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4</text><line x1="516.9" y1="450.0" x2="516.9" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="516.9230769230769" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">5</text><line x1="582.3" y1="450.0" x2="582.3" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="582.3076923076924" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">6</text><line x1="647.7" y1="450.0" x2="647.7" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="647.6923076923076" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">7</text><line x1="713.1" y1="450.0" x2="713.1" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="713.0769230769231" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">8</text><line x1="778.5" y1="450.0" x2="778.5" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="778.4615384615385" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">9</text><line x1="843.8" y1="450.0" x2="843.8" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="843.8461538461538" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10</text><line x1="909.2" y1="450.0" x2="909.2" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="909.2307692307693" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">11</text><line x1="974.6" y1="450.0" x2="974.6" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="974.6153846153846" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">12</text><line x1="1040.0" y1="450.0" x2="1040.0" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">13</text><text x="174" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (s)</text><rect x="24" y="500" width="1032" height="118" rx="12" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="196" y="530" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">polling</text><text x="196" y="556" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2 s de demora</text><text x="196" y="580" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4 consultas, 3 sin novedades</text><text x="540" y="530" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">long 