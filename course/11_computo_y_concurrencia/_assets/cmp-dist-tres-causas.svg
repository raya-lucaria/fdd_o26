<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-label="Tres carriles de la misma petición del cliente al servidor que no recibe respuesta antes de t_max. Primero, la ida se pierde y el servidor no se entera. Segundo, el servidor ejecuta la petición pero la respuesta se pierde. Tercero, el servidor tarda más que t_max y la respuesta llega tarde. En los tres casos el cliente observa lo mismo: espero t_max y no sé cuál fue."><rect x="0" y="0" width="1080" height="690" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Tres causas distintas, una sola observación: sin respuesta tras t_max</text><text x="540.0" y="70.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">La misma petición, el mismo cliente; lo que pasó en la red y en el servidor no se ve desde el cliente</text><text x="480.0" y="106.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">qué pasó</text><text x="920.0" y="106.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">qué observa el cliente</text><rect x="24" y="120" width="1032" height="150" rx="10" fill="none" stroke="#4a7a63" stroke-width="1"/><text x="40.0" y="166.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">1. La ida se pierde</text><text x="40.0" y="194.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">el servidor nunca la recibe</text><rect x="280" y="148" width="120" height="94" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="340.0" y="182.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">cliente</text><text x="340.0" y="206.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">espera t_max</text><rect x="600" y="148" width="150" height="94" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="675.0" y="182.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">servidor</text><text x="675.0" y="204.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no se entera:</text><text x="675.0" y="222.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no ejecuta nada</text><line x1="400.0" y1="174.0" x2="500.0" y2="174.0" stroke="#ff8a7a" stroke-width="2.2" stroke-dasharray="6 4"/><text x="512.0" y="180.0" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">×</text><text x="500.0" y="166.0" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la petición se pierde</text><text x="500.0" y="240.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no hay respuesta</text><rect x="800" y="148" width="240" height="94" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="1.6"/><text x="920.0" y="176.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tras t_max, sin respuesta</text><text x="920.0" y="202.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">espero t_max y no sé</text><text x="920.0" y="224.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">cuál fue</text><rect x="24" y="284" width="1032" height="150" rx="10" fill="none" stroke="#4a7a63" stroke-width="1"/><text x="40.0" y="330.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">2. La respuesta</text><text x="40.0" y="352.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">   se pierde</text><text x="40.0" y="380.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">el servidor sí ejecutó</text><rect x="280" y="312" width="120" height="94" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="340.0" y="346.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">cliente</text><text x="340.0" y="370.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">espera t_max</text><rect x="600" y="312" width="150" height="94" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="675.0" y="346.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">servidor</text><text x="675.0" y="368.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ejecutó:</text><text x="675.0" y="386.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">hubo efecto</text><line x1="400" y1="338" x2="600" y2="338" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><text x="500.0" y="330.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la petición llega</text><line x1="600.0" y1="384.0" x2="500.0" y2="384.0" stroke="#ff8a7a" stroke-width="2.2" stroke-dasharray="6 4"/><text x="488.0" y="390.0" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">×</text><text x="500.0" y="404.0" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la respuesta se pierde</text><rect x="800" y="312" width="240" height="94" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="1.6"/><text x="920.0" y="340.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tras t_max, sin respuesta</text><text x="920.0" y="366.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">espero t_max y no sé</text><text x="920.0" y="388.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">cuál fue</text><rect x="24" y="448" width="1032" height="150" rx="10" fill="none" stroke="#4a7a63" stroke-width="1"/><text x="40.0" y="494.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">3. El servidor tarda</text><text x="40.0" y="516.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">   más que t_max</text><text x="40.0" y="544.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">ejecuta, pero despacio</text><rect x="280" y="476" width="120" height="94" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="340.0" y="510.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">cliente</text><text x="340.0" y="534.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">espera t_max</text><rect x="600" y="476" width="150" height="94" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="675.0" y="510.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">servidor</text><text x="675.0" y="532.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ejecuta lento:</text><text x="675.0" y="550.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">responde tarde</text><line x1="400" y1="502" x2="600" y2="502" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><text x="500.0" y="494.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la petición llega</text><line x1="600" y1="548" x2="400" y2="548" stroke="#ffc857" stroke-width="2.2" marker-end="url(#fffc857)"/><text x="500.0" y="568.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">llega tras t_max</text><rect x="800" y="476" width="240" height="94" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="1.6"/><text x="920.0" y="504.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tras t_max, sin respuesta</text><text x="920.0" y="530.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">espero t_max y no sé</text><text x="920.0" y="552.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">cuál fue</text><text x="540.0" y="642.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">En la 2 el servidor ejecutó; en la 3 puede estar ejecutando todavía: reintentar sin más puede ejecutar dos veces.</text><text x="540.0" y="668.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Desde el cliente el silencio es idéntico: sólo t_max lo delimita, ningún dato lo explica.</text></svg>