<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="668" viewBox="0 0 1080 668" role="img" aria-label="Cinco carriles con el mismo caso: el servidor genera tres eventos en 2, 5 y 9 segundos. El polling cada 3 segundos se entera en 3, 6 y 9 segundos; el long polling, el SSE y el WebSocket se enteran en 2, 5 y 9 segundos con una consulta o conexión abierta; el webhook recibe tres llamadas cortas sin dejar nada abierto."><rect x="0" y="0" width="1080" height="668" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Los cinco canales para los mismos tres eventos</text><line x1="210.0" y1="104.0" x2="1030.0" y2="104.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="210.0" y1="98.0" x2="210.0" y2="104.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="210.0" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0 s</text><line x1="415.0" y1="98.0" x2="415.0" y2="104.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="415.0" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">3 s</text><line x1="620.0" y1="98.0" x2="620.0" y2="104.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="620.0" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">6 s</text><line x1="825.0" y1="98.0" x2="825.0" y2="104.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="825.0" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">9 s</text><line x1="1030.0" y1="98.0" x2="1030.0" y2="104.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1030.0" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">12 s</text><text x="192" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="end">tiempo</text><line x1="346.7" y1="114.0" x2="346.7" y2="576.0" stroke="#ffc857" stroke-width="1.2" stroke-dasharray="2 5"/><path d="M 346.7 94 L 356.7 104 L 346.7 114 L 336.7 104 Z" fill="#ffc857"/><line x1="551.7" y1="114.0" x2="551.7" y2="576.0" stroke="#ffc857" stroke-width="1.2" stroke-dasharray="2 5"/><path d="M 551.7 94 L 561.7 104 L 551.7 114 L 541.7 104 Z" fill="#ffc857"/><line x1="825.0" y1="114.0" x2="825.0" y2="576.0" stroke="#ffc857" stroke-width="1.2" stroke-dasharray="2 5"/><path d="M 825.0 94 L 835.0 104 L 825.0 114 L 815.0 104 Z" fill="#ffc857"/><text x="24" y="160" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">polling</text><text x="210" y="198" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">pregunta cada 3 s</text><line x1="24.0" y1="212.0" x2="1030.0" y2="212.0" stroke="#4a7a63" stroke-width="0.8"/><text x="24" y="252" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">long polling</text><text x="210" y="290" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">una consulta pendiente; al responder se vuelve a abrir</text><line x1="24.0" y1="304.0" x2="1030.0" y2="304.0" stroke="#4a7a63" stroke-width="0.8"/><text x="24" y="344" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">SSE</text><text x="210" y="382" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">una conexión abierta</text><line x1="24.0" y1="396.0" x2="1030.0" y2="396.0" stroke="#4a7a63" stroke-width="0.8"/><text x="24" y="436" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">WebSocket</text><text x="210" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">una conexión abierta, dos sentidos</text><line x1="24.0" y1="488.0" x2="1030.0" y2="488.0" stroke="#4a7a63" stroke-width="0.8"/><text x="24" y="528" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">webhook</text><text x="210" y="566" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">tres llamadas, nada abierto entre ellas</text><line x1="346.7" y1="154.0" x2="415.0" y2="154.0" stroke="#ffc857" stroke-width=