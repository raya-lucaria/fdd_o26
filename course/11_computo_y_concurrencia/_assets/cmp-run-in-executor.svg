anchor="middle">1500</text><line x1="785.0" y1="302.0" x2="785.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="785.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1750</text><line x1="870.0" y1="302.0" x2="870.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="870.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2000</text><line x1="955.0" y1="302.0" x2="955.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="955.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2250</text><line x1="1040.0" y1="302.0" x2="1040.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2500</text><text x="174" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><rect x="41.0" y="353.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">corre en el hilo del loop</text><rect x="285.0" y="353.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="324.0" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">espera el Future, CPU libre</text><rect x="543.4" y="353.0" width="30.0" height="16" rx="3" fill="#c9a7ff" stroke="none" stroke-width="0"/><text x="582.4" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">calcula en otro proceso y otra CPU</text><text x="540.0" y="404" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">la corrutina termina en 2020 ms: 2000 de cálculo en el pool + 20 suyos en el loop; mientras, el loop late 20 veces</text><text x="540.0" y="430" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">los latidos siguen cada 100 ms durante los 2000 ms: el hilo del loop sólo envía y recibe</text><text x="540.0" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">con el cálculo dentro del loop, ese carril quedaría vacío 2000 ms</text></svg>