<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="484" viewBox="0 0 1080 484" role="img" aria-label="Diagrama de Gantt con eje de 0 a 2500 ms y tres carriles. La corrutina ejecuta un instante, manda un cálculo de 2000 ms a un ProcessPoolExecutor con run_in_executor y espera el Future con await. El carril del hilo del loop muestra un latido cada 100 ms que sigue sin pausa durante los 2000 ms, porque el loop no calcula. El carril del proceso del pool calcula de 0 a 2000 ms en otra CPU con su propio GIL. En 2000 ms el Future queda listo, el resultado vuelve al loop y la corrutina se reanuda."><rect x="0" y="0" width="1080" height="484" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">run_in_executor: el cálculo sale del hilo del loop</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">una corrutina manda 2 s de cálculo a un pool de procesos; otra late cada 100 ms en el mismo loop</text><line x1="190.0" y1="112.0" x2="190.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="275.0" y1="112.0" x2="275.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="360.0" y1="112.0" x2="360.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="445.0" y1="112.0" x2="445.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="530.0" y1="112.0" x2="530.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="112.0" x2="615.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="700.0" y1="112.0" x2="700.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="785.0" y1="112.0" x2="785.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="870.0" y1="112.0" x2="870.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="955.0" y1="112.0" x2="955.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="112.0" x2="1040.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="138.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">corrutina</text><text x="174" y="168" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">latido: otra corrutina</text><rect x="191.0" y="120.0" width="4.8" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="197.8" y="120.0" width="671.2" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="533.4000000000001" y="138.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">await: espera el Future; el hilo del loop queda libre</text><rect x="871.0" y="120.0" width="4.8" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="174" y="194.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">hilo del loop</text><rect x="190.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="224.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="258.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="292.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="326.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="360.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="394.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="428.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="462.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="496.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="530.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="564.0" y="176.0" width="6.0" height="26" rx="1" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="598.0" y="17