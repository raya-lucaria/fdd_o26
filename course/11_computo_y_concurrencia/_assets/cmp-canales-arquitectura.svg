<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="Arquitectura en dos bandas. Arriba, navegadores y clientes pasan por un balanceador hacia dos servidores de aplicación; con SSE y WebSocket cada cliente deja una conexión abierta que el servidor retiene, y con polling el cliente solo pregunta. Abajo, un tercero llama al endpoint público, que pone el aviso en una cola para un trabajador y no retiene ninguna conexión abierta."><rect x="0" y="0" width="1080" height="700" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Quién conecta con quién y qué retiene el servidor</text><text x="40" y="94" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">polling / long polling: el cliente pregunta al servidor</text><path d="M 140 168 V 124 H 700 V 140" fill="none" stroke="#6fd8e8" stroke-width="2.4" stroke-dasharray="8 6"/><line x1="700" y1="124" x2="700" y2="150" stroke="#6fd8e8" stroke-width="2.4" marker-end="url(#f6fd8e8)"/><rect x="40" y="170" width="200" height="90" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="140.0" y="211.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">navegadores</text><text x="140.0" y="233.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">/ clientes</text><rect x="330" y="170" width="180" height="90" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="420.0" y="221.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">balanceador</text><rect x="600" y="154" width="250" height="66" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="725.0" y="193.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">servidor de aplicación</text><rect x="600" y="240" width="250" height="66" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="725.0" y="279.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">servidor de aplicación</text><line x1="240" y1="215" x2="328" y2="215" stroke="#7ef29d" stroke-width="2.4" marker-end="url(#f7ef29d)"/><line x1="510" y1="200" x2="598" y2="187" stroke="#7ef29d" stroke-width="2.4" marker-end="url(#f7ef29d)"/><line x1="510" y1="230" x2="598" y2="273" stroke="#7ef29d" stroke-width="2.4" marker-end="url(#f7ef29d)"/><path d="M 894 207 V 203 a 6 6 0 0 1 12 0 V 207" fill="none" stroke="#ffc857" stroke-width="2.4"/><rect x="890" y="207" width="20" height="13" rx="3" fill="#ffc857"/><text x="920" y="214" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">retiene</text><text x="890" y="244" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">una conexión abierta</text><text x="890" y="266" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">por cliente</text><text x="40" y="338" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="start">SSE y WebSocket: cada cliente deja UNA conexión abierta en un servidor</text><text x="40" y="364" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">(memoria + un hilo o una tarea por sesión)</text><line x1="40.0" y1="400.0" x2="1040.0" y2="400.0" stroke="#4a7a63" stroke-width="1"/><rect x="40" y="450" width="210" height="90" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="145.0" y="491.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">tercero</text><text x="145.0" y="513.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">(pasarela de pagos)</text><rect x="320" y="450" width="220" height="90" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="430.0" y="491.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">tu endpoint</text><text x="430.0" y="513.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">público (webhook)</text><rect x="610" y="450" width="130" height="90" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="675.0" y="501.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">cola</text><rect x="810" y="450" width="180" height="90" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="900.0" y="501.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">trabajador</text><line x1="250" y1="495" x2="318" y2="495" stroke="#c9a7ff" stroke-width="2.4" marker-end="url(#fc9a7ff)"/><line x1="540" y1="495" x2="608" y2="495" stroke="#7ef29d" stroke-width="2.4" marker-end="url(#f7ef29d)"/><line x1="740" y1="495" x2="808" y2="495" stroke="#7ef29d" stroke-width="2.4" marker-end="url(#f7ef29d)"/><text x="285" y="482" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">llama</text><text x="575" y="482" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">rápido</text><text x="775" y="482" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">después</text><path d="M 334 569 V 565 a 6 6 0 0 1 12 0 V 562" fill="none" stroke="#7ef29d" stroke-width="2.4"/><rect x="330" y="569" width="20" height="13" rx="3" fill="#7ef29d"/><text x="362" y="576" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">retiene: ninguna conexión abierta</text><text x="40" y="618" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="start">webhook: el tercero te llama; respondes rápido y procesas después;</text><text x="40" y="644" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">el mismo aviso puede llegar dos veces</text></svg>