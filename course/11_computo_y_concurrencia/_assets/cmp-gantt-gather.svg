1="344.0" x2="1040.0" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">400</text><text x="174" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><line x1="827.5" y1="96.0" x2="827.5" y2="344.0" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 4"/><text x="835.5" y="106" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">total 300 ms</text><line x1="211.25" y1="138" x2="211.25" y2="236" stroke="#e8f0e8" stroke-width="2" marker-end="url(#fe8f0e8)"/><text x="219.25" y="152" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">fan-out</text><line x1="806.25" y1="238" x2="806.25" y2="140" stroke="#e8f0e8" stroke-width="2" marker-end="url(#fe8f0e8)"/><rect x="40.0" y="395.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta: corre en el hilo del loop (usa la CPU)</text><rect x="426.4" y="395.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="466.40000000000003" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">espera: la red; cedió el loop con await</text><rect x="40.0" y="423.0" width="30.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><text x="80" y="436" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista: puede seguir; el loop corre a otra</text><rect x="383.2" y="423.0" width="30.0" height="16" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="423.2" y="436" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">CPU inactiva: nadie la usa</text><text x="540.0" y="472" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T3 empieza en 50 ms (tras main, T1 y T2): 50 + 20 + 200 + 20 = 290; main recibe y termina en 300 ms.</text><text x="540.0" y="500" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">El total lo pone la vida más larga, no la suma: 300 ms contra 720 en serie.</text></svg>