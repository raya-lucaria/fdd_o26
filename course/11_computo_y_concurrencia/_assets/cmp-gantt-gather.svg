<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="524" viewBox="0 0 1080 524" role="img" aria-label="Diagrama de Gantt de gather con tres tareas, eje de 0 a 400 ms. Main ejecuta 10 ms y crea T1, T2 y T3 en un solo tick: fan out. Cada tarea ejecuta 20 ms, espera 200 ms la red y ejecuta 20 ms; T2 queda lista mientras el loop corre T1, y T3 mientras corren T1 y T2. Las tres esperas se solapan. Main espera sin CPU hasta que termina T3, la ultima, en 290 ms: fan in. Recibe los resultados y termina en 300 ms."><rect x="0" y="0" width="1080" height="524" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">gather: fan-out en un tick, esperas solapadas, fan-in al terminar la última</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">main y 3 tareas: cada una ejecuta 20 ms, espera 200 ms la red, ejecuta 20 ms</text><line x1="190.0" y1="106.0" x2="190.0" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="296.2" y1="106.0" x2="296.2" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="402.5" y1="106.0" x2="402.5" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="508.8" y1="106.0" x2="508.8" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="106.0" x2="615.0" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="721.2" y1="106.0" x2="721.2" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="827.5" y1="106.0" x2="827.5" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="933.8" y1="106.0" x2="933.8" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="106.0" x2="1040.0" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="130.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">main</text><rect x="190.0" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="211.2" y="112.0" width="595.0" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="508.75" y="130.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera a gather: no ocupa CPU</text><rect x="806.2" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="839.5" y="116.0" width="204.6" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="843.5" y="130.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">fan-in: termina T3 (290 ms)</text><text x="174" y="172.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T1</text><rect x="211.2" y="154.0" width="42.5" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="253.8" y="154.0" width="425.0" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="466.25" y="172.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="678.8" y="154.0" width="42.5" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="839.5" y="158.0" width="102.6" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="843.5" y="172.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">corre primero</text><text x="174" y="214.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T2</text><rect x="211.2" y="196.0" width="42.5" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="253.8" y="196.0" width="42.5" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="296.2" y="196.0" width="425.0" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharr