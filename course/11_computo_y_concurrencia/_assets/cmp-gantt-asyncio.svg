<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="482" viewBox="0 0 1080 482" role="img" aria-label="Diagrama de Gantt con eje de tiempo en milisegundos de 0 a 800. Las mismas tres tareas, T1 a T3, como corrutinas en el hilo del loop, lanzadas juntas con gather. Cada corrutina ejecuta 20 ms hasta su await y cede el loop; T2 queda lista, en rayado, de 0 a 20 ms mientras el loop atiende a T1, y T3 de 0 a 40 ms. Las tres esperas de 200 ms se solapan. Total 280 ms, igual que con hilos y sin ningun hilo extra."><rect x="0" y="0" width="1080" height="482" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">asyncio con gather: un hilo, cada await cede el turno</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las mismas 3 tareas: ejecuta 20 ms, espera 200 ms la red, ejecuta 20 ms</text><line x1="190.0" y1="106.0" x2="190.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="296.2" y1="106.0" x2="296.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="402.5" y1="106.0" x2="402.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="508.8" y1="106.0" x2="508.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="106.0" x2="615.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="721.2" y1="106.0" x2="721.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="827.5" y1="106.0" x2="827.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="933.8" y1="106.0" x2="933.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="106.0" x2="1040.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="130.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T1 · corrutina</text><rect x="190.0" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="211.2" y="112.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="317.5" y="130.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="423.8" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="497.5" y="116.0" width="270.1" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="501.5" y="130.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">corre primero; su await cede el loop</text><text x="174" y="172.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T2 · corrutina</text><rect x="190.0" y="154.0" width="21.2" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="211.2" y="154.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="232.5" y="154.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="338.75" y="172.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="445.0" y="154.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="497.5" y="158.0" width="262.8" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="501.5" y="172.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista 0–20 ms: el loop atiende a T1</text><text x="174" y="214.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T3 · corrutina</text><rect x="190.0" y="196.0" width="42.5" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="232.5" y="196.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="253.8" y="196.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="360.0" y="214.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="466.2" y="196.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="497.5" y="200.0" width="357.4" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="501.5" y="214.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista 0–40 ms: el loop atiende a T1 y luego a T2</text><line x1="20.0" y1="244.0" x2="1040.0" y2="244.0" stroke="#4a7a63" stroke-width="1"/><text x="174" y="270.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">hilo del loop</text><rect x="190.0" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="200.625" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T1</text><rect x="211.2" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="221.875" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T2</text><rect x="232.5" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="243.125" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T3</text><rect x="253.8" y="255.0" width="170.0" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="338.75" y="270.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">inactiva</text><rect x="423.8" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="434.375" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T1</text><rect x="445.0" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="455.625" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T2</text><rect x="466.2" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="476.875" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T3</text><line x1="190.0" y1="302.0" x2="1040.0" y2="302.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="302.0" x2="190.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="296.2" y1="302.0" x2="296.2" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="296.25" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">100</text><line x1="402.5" y1="302.0" x2="402.5" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="402.5" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">200</text><line x1="508.8" y1="302.0" x2="508.8" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="508.75" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">300</text><line x1="615.0" y1="302.0" x2="615.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="615.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">400</text><line x1="721.2" y1="302.0" x2="721.2" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="721.25" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">500</text><line x1="827.5" y1="302.0" x2="827.5" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="827.5" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">600</text><line x1="933.8" y1="302.0" x2="933.8" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="933.75" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">700</text><line x1="1040.0" y1="302.0" x2="1040.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">800</text><text x="174" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><line x1="487.5" y1="96.0" x2="487.5" y2="302.0" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 4"/><text x="495.5" y="106" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">total 280 ms</text><rect x="40.0" y="353.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta: corre en el hilo del loop (usa la CPU)</text><rect x="426.4" y="353.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="466.40000000000003" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">espera: la red; cedió el loop con await</text><rect x="40.0" y="381.0" width="30.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><text x="80" y="394" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista: puede seguir; el loop atiende a otra</text><rect x="397.6" y="381.0" width="30.0" height="16" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="437.6" y="394" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">CPU inactiva: nadie la usa</text><text x="540.0" y="430" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T3 espera su turno 40 ms y luego ejecuta, espera y ejecuta: 40 + 20 + 200 + 20 = 280 ms.</text><text x="540.0" y="458" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Mismo total que con hilos. La diferencia es quién decide el turno: el await, no el sistema.</text></svg>