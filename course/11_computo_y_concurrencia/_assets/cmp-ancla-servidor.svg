<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-label="Ruta de una petición: el cliente llega al balanceador, que la manda a una de 3 réplicas; cada réplica tiene 4 workers y cada worker es un proceso con su propio loop y su propio pool local de 10 conexiones. Cada conexión de cada pool es un backend propio en Postgres, que admite 97 de 100 conexiones. Con 3 réplicas, 4 workers y 10 conexiones salen 120 conexiones, más de las 97 disponibles. Abajo, la variante con PgBouncer tiene dos poblaciones: 120 conexiones de cliente hacia PgBouncer y una población menor de conexiones de servidor hacia Postgres."><rect x="0" y="0" width="1080" height="720" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Cada conexión del pool de cada worker es un backend de Postgres</text><text x="540.0" y="66" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el límite del servidor se agota con réplicas × workers × pool, no con usuarios</text><rect x="24" y="224" width="100" height="64" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="74" y="262" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">cliente</text><line x1="124" y1="256" x2="156" y2="256" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="160" y="224" width="130" height="64" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="225" y="252" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">balanceador</text><text x="225" y="274" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">elige una réplica</text><line x1="290" y1="256" x2="322" y2="256" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="326" y="92" width="470" height="350" rx="12" fill="#16302a" stroke="#4a7a63" stroke-width="2"/><text x="344" y="116" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">réplica 1 de 3</text><text x="780" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">N = 4 workers</text><rect x="342" y="130" width="438" height="66" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="356" y="158" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">worker 1</text><text x="356" y="180" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">proceso propio</text><rect x="458" y="142" width="112" height="42" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="514" y="159" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">loop</text><text x="514" y="176" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">un hilo</text><rect x="584" y="138" width="186" height="50" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="3"/><text x="677" y="160" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">pool local</text><text x="677" y="179" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">k = 10 conexiones</text><rect x="342" y="206" width="438" height="66" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="356" y="234" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">worker 2</text><text x="356" y="256" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">proceso propio</text><rect x="458" y="218" width="112" height="42" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="514" y="235" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">loop</text><text x="514" y="252" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">un hilo</text><rect x="584" y="214" width="186" height="50" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="3"/><text x="677" y="236" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">pool local</text><text x="677" y="255" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">k = 10 conexiones</text><rect x="342" y="282" width="438" height="66" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="356" y="310" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">worker 3</text><text x="356" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">proceso propio</text><rect x="458" y="294" width="112" height="42" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="514" y="311" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">loop</text><text x="514" y="328" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">un hilo</text><rect x="584" y="290" width="186" height="50" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="3"/><text x="677" y="312" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">pool local</text><text x="677" y="331" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">k = 10 conexiones</text><rect x="342" y="358" width="438" height="66" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="356" y="386" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">worker 4</text><text x="356" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">proceso propio</text><rect x="458" y="370" width="112" height="42" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="514" y="387" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">loop</text><text x="514" y="404" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">un hilo</text><rect x="584" y="366" width="186" height="50" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="3"/><text x="677" y="388" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">pool local</text><text x="677" y="407" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">k = 10 conexiones</text><text x="561" y="462" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">réplicas 2 y 3: la misma estructura</text><rect x="868" y="92" width="190" height="350" rx="12" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="963" y="118" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Postgres</text><text x="963" y="138" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">max_connections = 100</text><line x1="770" y1="163" x2="860" y2="163" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="815" y="155" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una por</text><text x="815" y="181" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">conexión</text><line x1="770" y1="239" x2="860" y2="239" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="770" y1="315" x2="860" y2="315" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="770" y1="391" x2="860" y2="391" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="884" y="144" width="158" height="40" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="963" y="161" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">10 backends</text><text x="963" y="177" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">de este worker</text><rect x="884" y="220" width="158" height="40" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="963" y="237" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">10 backends</text><text x="963" y="253" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">de este worker</text><rect x="884" y="296" width="158" height="40" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="963" y="313" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">10 backends</text><text x="963" y="329" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">de este worker</text><rect x="884" y="372" width="158" height="40" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="963" y="389" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">10 backends</text><text x="963" y="405" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">de este worker</text><text x="540.0" y="500" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">R × N × k = 3 × 4 × 10 = 120 conexiones, contra 97 disponibles (100 menos 3 reservadas)</text><text x="540.0" y="524" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el pool vive dentro de cada worker: los workers no se lo prestan entre sí</text><rect x="24" y="548" width="1032" height="156" rx="12" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="44" y="574" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Variante con PgBouncer: dos poblaciones de conexiones</text><rect x="44" y="592" width="310" height="70" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="199" y="618" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">120 conexiones de cliente</text><text x="199" y="642" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">población 1: los pools de los workers</text><line x1="354" y1="627" x2="416" y2="627" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="420" y="592" width="230" height="70" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="535" y="618" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">PgBouncer</text><text x="535" y="642" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">pool_mode = transaction</text><line x1="650" y1="627" x2="712" y2="627" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="716" y="592" width="324" height="70" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="878" y="618" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">conexiones de servidor</text><text x="878" y="642" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">población 2: un backend cada una</text><text x="540.0" y="690" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">PgBouncer en modo transacción: 120 clientes comparten menos backends; sujeto a max_client_conn</text></svg>