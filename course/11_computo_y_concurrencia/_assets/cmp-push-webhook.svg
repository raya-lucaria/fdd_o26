<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="Tres diagramas de secuencia lado a lado. SSE: el cliente abre una petición GET y el servidor envía eventos por esa respuesta, que queda abierta y sólo va del servidor al cliente. WebSocket: el cliente abre con una petición de cambio de protocolo y después ambos lados envían mensajes por la misma conexión, que queda abierta en los dos sentidos. Webhook: el emisor llama con un POST a una URL del receptor y no queda ninguna petición pendiente entre eventos; inicia el emisor."><rect x="0" y="0" width="1080" height="650" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Quién inicia y qué queda abierto distingue SSE, WebSocket y webhook</text><text x="540.0" y="66" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las flechas van en el orden en que ocurren, de arriba hacia abajo</text><rect x="12" y="92" width="336" height="530" rx="12" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="180.0" y="120" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">SSE</text><text x="180.0" y="144" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">inicia: el cliente</text><rect x="22" y="160" width="104" height="36" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="74" y="184" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cliente</text><rect x="234" y="160" width="104" height="36" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="286" y="184" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">servidor</text><line x1="74.0" y1="196.0" x2="74.0" y2="448.0" stroke="#4a7a63" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="67.0" y="220.0" width="14.0" height="198" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="286.0" y1="196.0" x2="286.0" y2="448.0" stroke="#4a7a63" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="279.0" y="220.0" width="14.0" height="198" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="83" y1="254" x2="277" y2="254" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="180.0" y="246" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GET /eventos</text><line x1="277" y1="306" x2="83" y2="306" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="180.0" y="298" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">evento (servidor envía)</text><line x1="277" y1="358" x2="83" y2="358" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="180.0" y="350" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">evento (servidor envía)</text><line x1="277" y1="410" x2="83" y2="410" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="180.0" y="402" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">evento (servidor envía)</text><line x1="28.0" y1="462.0" x2="332.0" y2="462.0" stroke="#4a7a63" stroke-width="1"/><text x="180.0" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">queda abierto:</text><text x="180.0" y="508" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">una respuesta HTTP larga,</text><text x="180.0" y="530" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">sólo servidor → cliente</text><rect x="372" y="92" width="336" height="530" rx="12" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="540.0" y="120" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">WebSocket</text><text x="540.0" y="144" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">inicia: el cliente</text><rect x="382" y="160" width="104" height="36" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="434" y="184" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cliente</text><rect x="594" y="160" width="104" height="36" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="646" y="184" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">servidor</text><line x1="434.0" y1="196.0" x2="434.0" y2="448.0" stroke="#4a7a63" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="427.0" y="220.0" width="14.0" height="198" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="646.0" y1="196.0" x2="646.0" y2="448.0" stroke="#4a7a63" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="639.0" y="220.0" width="14.0" height="198" rx="3" fill="none" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="443" y1="254" x2="637" y2="254" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="540.0" y="246" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GET con Upgrade</text><line x1="637" y1="306" x2="443" y2="306" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="540.0" y="298" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">101: cambia de protocolo</text><line x1="443" y1="358" x2="637" y2="358" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="540.0" y="350" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">mensaje (cliente envía)</text><line x1="637" y1="410" x2="443" y2="410" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="540.0" y="402" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">mensaje (servidor envía)</text><line x1="388.0" y1="462.0" x2="692.0" y2="462.0" stroke="#4a7a63" stroke-width="1"/><text x="540.0" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">queda abierto:</text><text x="540.0" y="508" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">una conexión, en</text><text x="540.0" y="530" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">los dos sentidos</text><rect x="732" y="92" width="336" height="530" rx="12" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="900.0" y="120" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">webhook</text><text x="900.0" y="144" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">inicia: el emisor</text><rect x="742" y="160" width="104" height="36" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="794" y="184" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">emisor</text><rect x="954" y="160" width="104" height="36" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="1006" y="184" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">receptor</text><line x1="794.0" y1="196.0" x2="794.0" y2="344.0" stroke="#4a7a63" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="1006.0" y1="196.0" x2="1006.0" y2="344.0" stroke="#4a7a63" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="803" y1="254" x2="997" y2="254" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="900.0" y="246" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">POST /evento</text><line x1="997" y1="306" x2="803" y2="306" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="900.0" y="298" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">200 OK</text><line x1="748.0" y1="358.0" x2="1052.0" y2="358.0" stroke="#4a7a63" stroke-width="1"/><text x="900.0" y="380" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">queda abierto:</text><text x="900.0" y="404" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">no deja petición pendiente</text><text x="900.0" y="426" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">entre eventos</text><text x="900" y="510" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el receptor necesita una URL</text><text x="900" y="532" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">a la que el emisor pueda llegar</text></svg>