<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="636" viewBox="0 0 1080 636" role="img" aria-label="Dos Gantt en un hilo, eje de 0 a 140 ms. En ambas main ejecuta de 0 a 20 ms, crea f en 10 ms, cede con await asyncio.sleep de 20 a 120 ms y ejecuta de 120 a 130. Arriba, c igual a f sin create_task: la corrutina es un objeto inerte que nunca corre ni entra a la cola de listas. Abajo, create_task de f: f queda lista, en rayado, de 10 a 20 ms, ejecuta de 20 a 30, espera 50 ms y ejecuta de 80 a 90, aunque main nunca la espera con await."><rect x="0" y="0" width="1080" height="636" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">create_task agenda la corrutina; llamarla sola no la corre</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">main crea f en 10 ms y cede en 20 ms; f ejecuta 10 ms, espera 50 ms, ejecuta 10 ms</text><line x1="190.0" y1="100.0" x2="190.0" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="311.4" y1="100.0" x2="311.4" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="432.9" y1="100.0" x2="432.9" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="554.3" y1="100.0" x2="554.3" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="675.7" y1="100.0" x2="675.7" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="797.1" y1="100.0" x2="797.1" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="918.6" y1="100.0" x2="918.6" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="100.0" x2="1040.0" y2="456.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="40" y="116" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">c = f()</text><text x="132.99200000000002" y="116" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">crea el objeto corrutina: no entra a la cola de listas</text><text x="174" y="148.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">main</text><rect x="190.0" y="130.0" width="121.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="311.4" y="130.0" width="607.1" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="615.0" y="148.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">await asyncio.sleep(0.1): espera un timer, cede el hilo</text><rect x="918.6" y="130.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="174" y="190.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f()</text><rect x="250.7" y="172.0" width="789.3" height="26" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="645.3571428571429" y="190.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">objeto inerte: nunca corre (al final Python avisa «never awaited»)</text><line x1="20.0" y1="218.0" x2="1040.0" y2="218.0" stroke="#4a7a63" stroke-width="1"/><text x="174" y="244.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">hilo del loop</text><rect x="190.0" y="226.0" width="121.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="250.71428571428572" y="244.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">main</text><rect x="311.4" y="229.0" width="607.1" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="615.0" y="244.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">inactiva</text><rect x="918.6" y="226.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="948.9285714285714" y="244.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">main</text><rect x="979.3" y="229.0" width="60.7" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="40" y="286" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">t = asyncio.create_task(f())</text><text x="339.9680000000001" y="286" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">f queda lista de 10 a 20 ms (el loop corre main) y corre cuando main cede</text><text x="174" y="318.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">main</text><rect x="190.0" y="300.0" width="121.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="311.4" y="300.0" width="607.1" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="615.0" y="318.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">await asyncio.sleep(0.1): espera un timer, cede el hilo</text><rect x="918.6" y="300.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="174" y="360.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f()</text><rect x="250.7" y="342.0" width="60.7" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="311.4" y="342.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="372.1" y="342.0" width="303.6" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="523.9285714285713" y="360.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera un timer de 50 ms</text><rect x="675.7" y="342.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="20.0" y1="388.0" x2="1040.0" y2="388.0" stroke="#4a7a63" stroke-width="1"/><text x="174" y="414.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">hilo del loop</text><rect x="190.0" y="396.0" width="121.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="250.71428571428572" y="414.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">main</text><rect x="311.4" y="396.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="341.7857142857143" y="414.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">f</text><rect x="372.1" y="399.0" width="303.6" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="523.9285714285713" y="414.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">inactiva</text><rect x="675.7" y="396.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="706.0714285714286" y="414.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">f</text><rect x="736.4" y="399.0" width="182.1" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="827.5" y="414.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">inactiva</text><rect x="918.6" y="396.0" width="60.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="948.9285714285714" y="414.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">main</text><rect x="979.3" y="399.0" width="60.7" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="748.4285714285714" y="360" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">aunque nadie haga await t</text><line x1="190.0" y1="456.0" x2="1040.0" y2="456.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="456.0" x2="190.0" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="311.4" y1="456.0" x2="311.4" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="311.42857142857144" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">20</text><line x1="432.9" y1="456.0" x2="432.9" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="432.85714285714283" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">40</text><line x1="554.3" y1="456.0" x2="554.3" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="554.2857142857142" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">60</text><line x1="675.7" y1="456.0" x2="675.7" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="675.7142857142857" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">80</text><line x1="797.1" y1="456.0" x2="797.1" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="797.1428571428571" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">100</text><line x1="918.6" y1="456.0" x2="918.6" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="918.5714285714286" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">120</text><line x1="1040.0" y1="456.0" x2="1040.0" y2="462.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">140</text><text x="174" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><rect x="40.0" y="507.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="520" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta: corre en el hilo del loop (usa la CPU)</text><rect x="426.4" y="507.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="466.40000000000003" y="520" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">espera: un timer o la red, CPU libre</text><rect x="40.0" y="535.0" width="30.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><text x="80" y="548" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista: puede seguir; el loop corre a otra</text><rect x="383.2" y="535.0" width="30.0" height="16" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="423.2" y="548" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">CPU inactiva: nadie la usa</text><text x="540.0" y="584" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">main termina en 130 ms: 20 + 100 de sleep + 10; f corre entera dentro del sleep de main.</text><text x="540.0" y="612" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Sin create_task, gather ni await, una corrutina no corre: crearla no la agenda.</text></svg>