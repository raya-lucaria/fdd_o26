<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-label="Dos columnas. A la izquierda, pertenencia: una máquina contiene procesos, un proceso contiene hilos y un hilo recibe tareas. A la derecha, ejecución: el sistema operativo asigna hilos a CPU lógicas, el runtime reparte tareas entre hilos y una tarea puede migrar de un hilo a otro. Pertenecer no es ejecutar: planifican dos agentes distintos."><rect x="0" y="0" width="1080" height="720" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Pertenecer no es ejecutar: dos planificadores, uno para hilos y otro para tareas</text><text x="540.0" y="70.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Izquierda, qué contiene a qué; derecha, quién corre sobre quién y quién decide</text><line x1="540.0" y1="92.0" x2="540.0" y2="700.0" stroke="#4a7a63" stroke-width="1.2" stroke-dasharray="3 5"/><text x="280.0" y="112.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Pertenencia: qué contiene a qué</text><text x="800.0" y="112.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Ejecución: quién corre sobre quién</text><rect x="100" y="132" width="360" height="70" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="280.0" y="162.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">máquina</text><text x="280.0" y="186.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">tiene CPU lógicas y memoria</text><rect x="100" y="262" width="360" height="70" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="280.0" y="292.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">proceso</text><text x="280.0" y="316.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">tiene su espacio de memoria</text><rect x="100" y="392" width="360" height="70" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="280.0" y="422.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">hilo</text><text x="280.0" y="446.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size