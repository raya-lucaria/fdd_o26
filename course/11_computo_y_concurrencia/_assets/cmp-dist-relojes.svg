<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Diagrama de tiempo de dos componentes, A y B, con dos ejes alineados al mismo instante real. El reloj de B marca el reloj real menos 40 ms. A envía un mensaje cuando su reloj marca 100 ms; el mensaje tarda 20 ms reales y B lo recibe cuando su reloj marca 80 ms. Restar las marcas da 80 menos 100, es decir menos 20 ms, que es 20 ms menos 40 ms: no es la tiempo de tránsito, porque mezcla dos relojes."><rect x="0" y="0" width="1080" height="600" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Restar marcas de dos relojes distintos da −20 ms, un tiempo negativo</text><text x="540.0" y="70.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Reloj de B = reloj real − 40 ms; un mensaje de A a B tarda 20 ms reales (supuestos del ejemplo)</text><line x1="610.0" y1="128.0" x2="610.0" y2="338.0" stroke="#4a7a63" stroke-width="1.2" stroke-dasharray="3 5"/><line x1="694.0" y1="128.0" x2="694.0" y2="338.0" stroke="#4a7a63" stroke-width="1.2" stroke-dasharray="3 5"/><line x1="190.0" y1="128.0" x2="1030.0" y2="128.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="122.0" x2="190.0" y2="128.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="116.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="400.0" y1="122.0" x2="400.0" y2="128.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="400.0" y="116.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">50</text><line x1="610.0" y1="122.0" x2="610.0" y2="128.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="610.0" y="116.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">100</text><line x1="820.0" y1="122.0" x2="820.0" y2="128.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="820.0" y="116.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">150</text><line x1="1030.0" y1="122.0" x2="1030.0" y2="128.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1030.0" y="116.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">200</text><text x="156.0" y="116.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">reloj de A (ms)</text><line x1="190.0" y1="338.0" x2="1030.0" y2="338.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="338.0" x2="190.0" y2="344.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="364.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">−40</text><line x1="400.0" y1="338.0" x2="400.0" y2="344.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="400.0" y="364.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10</text><line x1="610.0" y1="338.0" x2="610.0" y2="344.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="610.0" y="364.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">60</text><line x1="820.0" y1="338.0" x2="820.0" y2="344.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="820.0" y="364.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">110</text><line x1="1030.0" y1="338.0" x2="1030.0" y2="344.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1030.0" y="364.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">160</text><text x="156.0" y="364.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">reloj de B (ms)</text><text x="694.0" y="364.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">80</text><text x="174.0" y="173.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">componente A</text><rect x="359.0" y="148.0" width="250.0" height="38.0" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="484.0" y="172.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">A prepara y envía</text><text x="174.0" y="297.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">componente B</text><rect x="359.0" y="272.0" width="334.0" height="38.0" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="526.0" y="296.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">B espera el mensaje: CPU libre</text><rect x="695.0" y="272.0" width="292.0" height="38.0" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="841.0" y="296.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">B recibe y procesa</text><line x1="610.0" y1="186" x2="694.0" y2="272" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><text x="596.0" y="214.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">A marca 100 ms al enviar</text><text x="718.0" y="214.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">mensaje: tránsito real 20 ms</text><text x="718.0" y="238.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">B marca 80 ms al recibir</text><rect x="40" y="396" width="1000" height="148" rx="10" fill="#16302a" stroke="#4a7a63" stroke-width="1.6"/><text x="540.0" y="436.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">B marca 80, A marcó 100: 80−100 = −20 ms = 20 ms − 40 ms</text><text x="540.0" y="472.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">20 ms es el tiempo de tránsito real del mensaje; −40 ms es el desfase del reloj de B.</text><text x="540.0" y="500.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">La resta mide el tránsito más el desfase, no el tránsito: dos relojes distintos no se restan como si fueran uno.</text><rect x="41.0" y="560.0" width="32.0" height="18.0" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="84.0" y="574.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">ejecuta: usa la CPU</text><rect x="264.6" y="560.0" width="32.0" height="18.0" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="307.6" y="574.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">espera: CPU libre</text></svg>