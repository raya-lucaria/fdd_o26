<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="566" viewBox="0 0 1080 566" role="img" aria-label="Dos tareas en serie sobre un eje de 0 a 480 ms. La vida de T1 es el intervalo semiabierto de 0 a 240, cerrado en 0 y abierto en 240; la de T2 va de 240 a 480. En 240 T1 tiene un punto hueco y T2 un punto lleno: el instante 240 pertenece solo a T2, asi que las dos vidas se tocan pero no se solapan y la traza es secuencial. Cada vida se parte en ejecuta 20, espera 200 y ejecuta 20 ms, sin tramo lista."><rect x="0" y="0" width="1080" height="566" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Intervalos semiabiertos: dos vidas que se tocan no se solapan</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">[a, b) incluye a y excluye b; el tramo siguiente empieza en el mismo x</text><line x1="190.0" y1="110.0" x2="190.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="260.8" y1="110.0" x2="260.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="331.7" y1="110.0" x2="331.7" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="402.5" y1="110.0" x2="402.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="473.3" y1="110.0" x2="473.3" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="544.2" y1="110.0" x2="544.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="110.0" x2="615.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="685.8" y1="110.0" x2="685.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="756.7" y1="110.0" x2="756.7" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="827.5" y1="110.0" x2="827.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="898.3" y1="110.0" x2="898.3" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="969.2" y1="110.0" x2="969.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="110.0" x2="1040.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="168.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T1</text><rect x="190.0" y="150.0" width="35.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="225.4" y="150.0" width="354.2" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="402.5" y="168.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="579.6" y="150.0" width="35.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="190.0" y1="136.0" x2="615.0" y2="136.0" stroke="#7ef29d" stroke-width="2.5"/><circle cx="190.0" cy="136" r="6" fill="#7ef29d" stroke="#7ef29d" stroke-width="2.5"/><circle cx="615.0" cy="136" r="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="2.5"/><text x="402.5" y="126" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">vida(T1) = [0, 240)</text><text x="174" y="242.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T2</text><rect x="615.0" y="224.0" width="35.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="650.4" y="224.0" width="354.2" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="827.5" y="242.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="1004.6" y="224.0" width="35.4" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="615.0" y1="210.0" x2="1040.0" y2="210.0" stroke="#6fd8e8" stroke-width="2.5"/><circle cx="615.0" cy="210" r="6" fill="#6fd8e8" stroke="#6fd8e8" stroke-width="2.5"/><circle cx="1040.0" cy="210" r="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="2.5"/><text x="827.5" y="200" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">vida(T2) = [240, 480)</text><line x1="190.0" y1="302.0" x2="1040.0" y2="302.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="302.0" x2="190.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="260.8" y1="302.0" x2="260.8" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="260.8333333333333" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">40</text><line x1="331.7" y1="302.0" x2="331.7" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="331.66666666666663" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">80</text><line x1="402.5" y1="302.0" x2="402.5" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="402.5" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">120</text><line x1="473.3" y1="302.0" x2="473.3" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="473.3333333333333" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">160</text><line x1="544.2" y1="302.0" x2="544.2" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="544.1666666666666" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">200</text><line x1="615.0" y1="302.0" x2="615.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="615.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">240</text><line x1="685.8" y1="302.0" x2="685.8" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="685.8333333333333" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">280</text><line x1="756.7" y1="302.0" x2="756.7" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="756.6666666666666" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">320</text><line x1="827.5" y1="302.0" x2="827.5" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="827.5" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">360</text><line x1="898.3" y1="302.0" x2="898.3" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="898.3333333333333" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">400</text><line x1="969.2" y1="302.0" x2="969.2" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="969.1666666666666" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">440</text><line x1="1040.0" y1="302.0" x2="1040.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">480</text><text x="174" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><line x1="615.0" y1="104.0" x2="615.0" y2="302.0" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 4"/><text x="615.0" y="98" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">t = 240</text><rect x="40" y="356" width="1000" height="186" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="540.0" y="390" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">En t = 240: 240 no está en [0, 240) y sí en [240, 480). Corta una sola vida.</text><text x="540.0" y="424" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">La traza es secuencial: ningún instante pertenece a las dos vidas.</text><text x="540.0" y="458" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Con intervalos cerrados, [0, 240] y [240, 480] compartirían t = 240</text><text x="540.0" y="492" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">y dos tareas en serie contarían como concurrentes.</text><text x="540.0" y="526" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">vida(T1) = exec ∪ wait ∪ ready, disjuntos: 20 + 200 + 20 = 240 ms (ready vacío).</text></svg>