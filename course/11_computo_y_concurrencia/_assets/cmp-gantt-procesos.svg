<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="524" viewBox="0 0 1080 524" role="img" aria-label="Diagrama de Gantt con eje de tiempo en milisegundos de 0 a 800. Las mismas tres tareas en tres procesos, P1, P2 y P3, sobre dos CPU. P1 ejecuta en la CPU 1 y P2 en la CPU 2 al mismo tiempo; P3 queda lista, en rayado, de 0 a 20 ms porque las dos CPU estan ocupadas, y luego ejecuta en la CPU 1. Las filas de CPU rotulan cada tramo con P1, P2 o P3. Total 260 ms: 20 + 20 + 200 + 20."><rect x="0" y="0" width="1080" height="524" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Procesos: dos CPU ejecutan al mismo tiempo</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las mismas 3 tareas: ejecuta 20 ms, espera 200 ms la red, ejecuta 20 ms</text><line x1="190.0" y1="106.0" x2="190.0" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="296.2" y1="106.0" x2="296.2" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="402.5" y1="106.0" x2="402.5" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="508.8" y1="106.0" x2="508.8" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="106.0" x2="615.0" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="721.2" y1="106.0" x2="721.2" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="827.5" y1="106.0" x2="827.5" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="933.8" y1="106.0" x2="933.8" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="106.0" x2="1040.0" y2="344.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="130.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">P1 · CPU 1</text><rect x="190.0" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="211.2" y="112.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="317.5" y="130.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="423.8" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="476.2" y="116.0" width="146.3" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="480.25" y="130.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta en la CPU 1</text><text x="174" y="172.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">P2 · CPU 2</text><rect x="190.0" y="154.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="211.2" y="154.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="317.5" y="172.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="423.8" y="154.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="476.2" y="158.0" width="270.1" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="480.25" y="172.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta en la CPU 2, a la vez que P1</text><text x="174" y="214.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">P3 · CPU 1</text><rect x="190.0" y="196.0" width="21.2" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="211.2" y="196.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="232.5" y="196.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="338.75" y="214.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red: CPU libre</text><rect x="445.0" y="196.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="476.2" y="200.0" width="393.8" height="18" rx="2" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="480.25" y="214.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista 0–20 ms: CPU 1 y 2 ocupadas; luego usa la CPU 1</text><line x1="20.0" y1="244.0" x2="1040.0" y2="244.0" stroke="#4a7a63" stroke-width="1"/><text x="174" y="270.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">CPU 1</text><rect x="190.0" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="200.625" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">P1</text><rect x="211.2" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="221.875" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">P3</text><rect x="232.5" y="255.0" width="191.2" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="328.125" y="270.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">inactiva</text><rect x="423.8" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="434.375" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">P1</text><rect x="445.0" y="252.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="455.625" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">P3</text><text x="174" y="312.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">CPU 2</text><rect x="190.0" y="294.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="200.625" y="312.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">P2</text><rect x="211.2" y="297.0" width="212.5" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="317.5" y="312.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">inactiva</text><rect x="423.8" y="294.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="434.375" y="312.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">P2</text><rect x="445.0" y="297.0" width="21.2" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="190.0" y1="344.0" x2="1040.0" y2="344.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="344.0" x2="190.0" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="296.2" y1="344.0" x2="296.2" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="296.25" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">100</text><line x1="402.5" y1="344.0" x2="402.5" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="402.5" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">200</text><line x1="508.8" y1="344.0" x2="508.8" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="508.75" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">300</text><line x1="615.0" y1="344.0" x2="615.0" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="615.0" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">400</text><line x1="721.2" y1="344.0" x2="721.2" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="721.25" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">500</text><line x1="827.5" y1="344.0" x2="827.5" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="827.5" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">600</text><line x1="933.8" y1="344.0" x2="933.8" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="933.75" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">700</text><line x1="1040.0" y1="344.0" x2="1040.0" y2="350.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">800</text><text x="174" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><line x1="466.2" y1="96.0" x2="466.2" y2="344.0" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 4"/><text x="474.25" y="106" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">total 260 ms</text><rect x="40.0" y="395.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta: el proceso usa la CPU de su fila</text><rect x="383.2" y="395.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="423.2" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">espera: la red, CPU libre</text><rect x="611.2" y="395.0" width="30.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><text x="651.2" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista: puede seguir; las 2 CPU están ocupadas</text><rect x="40.0" y="423.0" width="30.0" height="16" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="80" y="436" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">CPU inactiva: nadie la usa</text><text x="540.0" y="472" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">P3 espera 20 ms una CPU libre y ejecuta en la CPU 1: 20 + 20 + 200 + 20 = 260 ms.</text><text x="540.0" y="500" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">260 ms contra 280 de hilos: con tareas que esperan, el paralelismo casi no rinde.</text></svg>