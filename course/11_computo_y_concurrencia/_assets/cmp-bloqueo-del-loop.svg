<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="482" viewBox="0 0 1080 482" role="img" aria-label="Diagrama de Gantt con eje de tiempo en milisegundos de 0 a 2200. T1 y T2 lanzan una peticion y esperan 200 ms; T3 hace un calculo de 2000 ms dentro del loop sin ningun await. Las respuestas llegan en 220 y 240 ms, pero T1 y T2 quedan listas, en rayado, hasta 2040 y 2060 ms, porque el hilo del loop calcula T3 y no recupera el control hasta que el calculo termina. Total 2080 ms: 2040 + 20 + 20. Sin T3, ambas peticiones terminarian a los 260 ms."><rect x="0" y="0" width="1080" height="482" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Un cálculo de 2 s dentro del loop detiene a todas las demás</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">dos peticiones de 200 ms y un cálculo de 2000 ms sin await, en el mismo loop</text><line x1="190.0" y1="106.0" x2="190.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="267.3" y1="106.0" x2="267.3" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="344.5" y1="106.0" x2="344.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="421.8" y1="106.0" x2="421.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="499.1" y1="106.0" x2="499.1" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="576.4" y1="106.0" x2="576.4" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="653.6" y1="106.0" x2="653.6" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="730.9" y1="106.0" x2="730.9" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="808.2" y1="106.0" x2="808.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="885.5" y1="106.0" x2="885.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="962.7" y1="106.0" x2="962.7" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="106.0" x2="1040.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="130.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T1 · petición</text><rect x="190.0" y="112.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="197.7" y="112.0" width="77.3" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="275.0" y="112.0" width="703.2" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="438.6" y="116.0" width="376.0" height="18" rx="4" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="626.590909090909" y="130.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lista: llegó la respuesta, pero el loop calcula T3</text><rect x="978.2" y="112.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="174" y="172.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T2 · petición</text><rect x="190.0" y="154.0" width="7.7" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="197.7" y="154.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="205.5" y="154.0" width="77.3" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="282.7" y="154.0" width="703.2" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="460.9" y="158.0" width="346.9" height="18" rx="4" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="634.3181818181818" y="172.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lista: llegó la respuesta; el loop sigue en T3</text><rect x="985.9" y="154.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="174" y="214.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">T3 · cálculo</text><rect x="190.0" y="196.0" width="15.5" height="26" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="205.5" y="196.0" width="772.7" height="26" rx="3" fill="#ff8a7a" stroke="none" stroke-width="0"/><text x="591.8181818181818" y="214.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">calcula 2000 ms sin await</text><line x1="20.0" y1="244.0" x2="1040.0" y2="244.0" stroke="#4a7a63" stroke-width="1"/><text x="174" y="270.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">hilo del loop</text><rect x="190.0" y="252.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="193.86363636363637" y="292" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T1, T2</text><rect x="197.7" y="252.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="205.5" y="252.0" width="772.7" height="26" rx="3" fill="#ff8a7a" stroke="none" stroke-width="0"/><text x="591.8181818181818" y="270.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T3 calcula: el loop no atiende a nadie más</text><rect x="978.2" y="252.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="982.0454545454545" y="292" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">T1, T2</text><rect x="985.9" y="252.0" width="7.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="190.0" y1="302.0" x2="1040.0" y2="302.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="302.0" x2="190.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="267.3" y1="302.0" x2="267.3" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="267.27272727272725" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">200</text><line x1="344.5" y1="302.0" x2="344.5" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="344.5454545454545" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">400</text><line x1="421.8" y1="302.0" x2="421.8" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="421.8181818181818" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">600</text><line x1="499.1" y1="302.0" x2="499.1" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="499.09090909090907" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">800</text><line x1="576.4" y1="302.0" x2="576.4" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="576.3636363636364" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1000</text><line x1="653.6" y1="302.0" x2="653.6" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="653.6363636363636" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1200</text><line x1="730.9" y1="302.0" x2="730.9" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="730.9090909090909" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1400</text><line x1="808.2" y1="302.0" x2="808.2" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="808.1818181818181" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1600</text><line x1="885.5" y1="302.0" x2="885.5" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="885.4545454545454" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1800</text><line x1="962.7" y1="302.0" x2="962.7" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="962.7272727272727" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2000</text><line x1="1040.0" y1="302.0" x2="1040.0" y2="308.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2200</text><text x="174" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><line x1="993.6" y1="96.0" x2="993.6" y2="302.0" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 4"/><text x="985.6363636363636" y="106" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">total 2080 ms</text><rect x="40.0" y="353.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="80" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ejecuta: corre en el hilo del loop</text><rect x="332.8" y="353.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="372.8" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">espera: la red, CPU libre</text><rect x="560.8" y="353.0" width="30.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><text x="600.8" y="366" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lista: puede seguir; el loop está ocupado</text><rect x="40.0" y="381.0" width="30.0" height="16" rx="3" fill="#ff8a7a" stroke="none" stroke-width="0"/><text x="80" y="394" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">T3 calcula dentro del loop, sin await</text><text x="540.0" y="430" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">El loop vuelve en 2040 ms (40 + 2000 de T3) y corre T1 y T2: 2040 + 20 + 20 = 2080 ms.</text><text x="540.0" y="458" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Las respuestas llegaron a los 220 y 240 ms; nadie las atendió hasta que el cálculo soltó el loop.</text></svg>